#
# git-cliff configuration of `make release-prep` (ADR 0060). tools/ci/release_prep.py calls
# `git-cliff --unreleased --context` with the tag pattern and the paths of one component
# (tools/ci/components.py): git-cliff selects and parses the commits, the script applies the
# version rule of docs/spec/18-release.md section 3 (fix a patch, feat a minor, a break a
# major, before 1.0.0 a minor). The changelog text is not generated; it comes from the entries
# every ticket writes under "Unreleased" in the component's CHANGELOG.md, so the body template
# stays empty.

[changelog]
body = ""

[git]
# Conventional Commits with the component as scope (docs/quality/push-discipline.md);
# commits of another form never change the version.
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
sort_commits = "oldest"
