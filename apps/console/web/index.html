<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<!--
  Entry document of the web console (briefs M6-02 and M6-03). The server serves it for every path
  below /console/ that is no file of the build, with Cache-Control: no-store, and replaces the
  nonce placeholder of the script tag with the nonce of the response, the same value the style-src
  directive of its Content Security Policy names (docs/spec/19-security.md 5 rule 2). There is no <base>
  element: the policy has base-uri 'none'. `flutter build web --base-href /console/` writes the
  base path into the absolute URLs below instead; flutter_bootstrap.js derives every other URL
  from its own, and the app takes its base from lib/run.dart. The console sets the lang attribute
  to the app language at start; German is the default locale.
-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" type="image/png" href="$FLUTTER_BASE_HREFfavicon.png">
  <title>Console</title>
</head>
<body>
  <script src="$FLUTTER_BASE_HREFflutter_bootstrap.js" async nonce="__BOTHY_CSP_NONCE__"></script>
</body>
</html>
