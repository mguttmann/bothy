# SPDX-License-Identifier: Apache-2.0
name: console
description: >-
  Web console for administration and statistics.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

# Members of the workspace the console uses directly; each is reachable from the console's arrows
# in tools/arch-check/rules.yaml (docs/spec/15-client-architecture.md 3.1). Never sync_engine or
# local_store (rule 3).
dependencies:
  # The administration screens A1 to A6 the console hosts, the same as on the desktop (R-CL-01,
  # brief M6-04 Design note 1).
  admin_ui:
    path: ../../packages/admin_ui
  api_client:
    path: ../../packages/api_client
  # PkcePair of the OIDC login and re-login; the console uses no DPoP part (brief M6-02).
  auth:
    path: ../../packages/auth
  built_collection: ^5.1.2
  built_value: ^8.13.0
  design_system:
    path: ../../packages/design_system
  dio: ^5.11.1
  # Uuid7Generator for the Idempotency-Key of every changing request (06 3).
  domain:
    path: ../../packages/domain
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Path URLs below /console/ instead of #/ fragments, so the OIDC callback path reaches the app.
  flutter_web_plugins:
    sdk: flutter
  l10n:
    path: ../../packages/l10n
  # The terminal view of the apps with the console's ports: browser WebSocket, IndexedDB pins
  # and the passkey step-up (ADR 0070, brief M6-18 Design note 3).
  terminal_ui:
    path: ../../packages/terminal_ui
  # Browser interop of the web adapters (sessionStorage, navigator.credentials, location).
  web: ^1.1.1

dev_dependencies:
  alchemist: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # The browser flows of A1 to A6 under the enforced CSP (docs/spec/15-client-architecture.md 20,
  # brief M6-04 Design note 4); tools/console-e2e drives the web bundle.
  patrol: 4.10.0

flutter:
  uses-material-design: true
