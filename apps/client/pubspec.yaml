# SPDX-License-Identifier: Apache-2.0
name: client
description: >-
  Desktop and mobile app for macOS and Windows, later iOS and Android.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  admin_ui: any
  api_client: any
  audioplayers: ^6.8.1
  auth: any
  bothy_viz: any
  built_collection: ^5.1.2
  crypto: ^3.0.7
  design_system: any
  desktop_drop: ^0.8.0
  device_key: any
  dio: ^5.11.1
  domain: any
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  l10n: any
  local_store: any
  pasteboard: ^0.5.0
  path_provider: ^2.1.6
  record: ^7.1.2
  riverpod_annotation: ^4.0.7
  sentry_flutter: ^10.0.0
  sync_engine: any
  timezone: ^0.11.2
  tray_manager: ^0.5.2
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  win32_registry: ^3.0.3
  window_manager: ^0.5.2

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  pigeon: ^29.0.10
  pointycastle: ^4.0.0
  riverpod_generator: ^4.0.9
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  # The icon of the notification area on Windows is the runner's icon (tray_manager reads an
  # asset path; docs/DECISIONS.md D-M4-30-6).
  assets:
    - windows/runner/resources/app_icon.ico
