# SPDX-License-Identifier: Apache-2.0
rules:
  - id: bothy-go-no-model-credentials
    languages: [go]
    severity: ERROR
    paths:
      # Test code, which Semgrep's built-in ignore list skipped before .semgrepignore existed.
      exclude: ["*_test.go", "test/", "tests/", "testsuite/"]
    message: >-
      The server never reads model provider credentials (baseline B10, invariant I5).
      API keys and subscriptions stay with the agent adapter and its secret provider.
    # What the rule sees: a literal name with the prefix ANTHROPIC_ or CLAUDE_ read through
    # os.Getenv or os.LookupEnv. A name held in a constant or variable, other providers and other
    # ways to read the environment are left to the review.
    patterns:
      - pattern-either:
          - pattern: os.Getenv("$NAME")
          - pattern: os.LookupEnv("$NAME")
      - metavariable-regex:
          metavariable: $NAME
          regex: '^"?(ANTHROPIC_|CLAUDE_)'
