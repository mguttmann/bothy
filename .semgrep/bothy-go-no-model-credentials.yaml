# SPDX-License-Identifier: Apache-2.0
rules:
  - id: bothy-go-no-model-credentials
    languages: [go]
    severity: ERROR
    message: >-
      The server never reads model provider credentials (baseline B10, invariant I5).
      API keys and subscriptions stay with the agent adapter and its secret provider.
    patterns:
      - pattern-either:
          - pattern: os.Getenv("$NAME")
          - pattern: os.LookupEnv("$NAME")
      - metavariable-regex:
          metavariable: $NAME
          regex: '^"?(ANTHROPIC_|CLAUDE_)'
