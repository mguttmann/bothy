#
# Options of `flutter gen-l10n` (docs/spec/01-product.md section 9, docs/DECISIONS.md
# D-M4-06-1). English is the template because code and reviewers read English; German is the
# default locale of the app and comes first in supportedLocales. `make codegen-check` runs the
# generator in a temporary copy with an untranslated-messages-file and compares the output
# with lib/src/generated/ (tools/ci/l10n_check.py).
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/src/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
preferred-supported-locales: [de]
nullable-getter: false
required-resource-attributes: true
