name: admin_ui
description: >-
  Administration screens for the desktop app, the console and the emergency actions on mobile.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  api_client: any
  auth: any
  bothy_viz: any
  # BuiltList of the metrics of getStatsTimeline (M6-16).
  built_collection: ^5.1.2
  design_system: any
  dio: ^5.11.1
  # AppConfig of the views' viz.* values (M6-16); reached through design_system.
  domain: any
  flutter:
    sdk: flutter
  l10n: any
  yaml: ^3.1.4

dev_dependencies:
  alchemist: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
