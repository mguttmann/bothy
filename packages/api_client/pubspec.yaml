# SPDX-License-Identifier: Apache-2.0
name: api_client
description: >-
  REST client generated from the OpenAPI document (openapi-generator dart-dio) with a hand-written
  layer for headers, read retry, problems and tolerant events.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

# What the generated code imports (dart-dio with built_value); the hand layer needs nothing more.
dependencies:
  built_collection: ^5.1.2
  built_value: ^8.13.0
  dio: ^5.11.1
  http_parser: ^4.1.2
  one_of: ^1.5.0
  one_of_serializer: ^1.5.0

dev_dependencies:
  build_runner: ^2.16.1
  built_value_generator: ^8.13.0
  lints: ^6.1.0
  test: ^1.31.1
