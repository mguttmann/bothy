# SPDX-License-Identifier: Apache-2.0
name: device_key
description: >-
  Device keys in the secure storage of each platform (Flutter plugin, Pigeon).
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.10

# iOS and macOS share the Swift sources under darwin/ (brief M4-10, Design note 4): the Swift
# package darwin/device_key, which Flutter links through Swift Package Manager, and the core
# package darwin/device_key/DeviceKeyCore inside it. Windows (M4-11) and Android (M5-01) follow.
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: DeviceKeyPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: DeviceKeyPlugin
        sharedDarwinSource: true
