org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Repository requests that fail with 408, 429 or a 5xx: six tries, waiting 2, 4, 8, 16 and 32 s
# instead of Gradle's three with 1 and 2 s (Maven Central answered HTTP 429 in CI). Internal
# property names of Gradle, checked for the pinned wrapper (docs/quality/gates.md, "Gradle downloads").
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
