name: sync_engine
description: >-
  Gateway, catch-up, outbox, reconciliation and run documents of the apps, without Flutter.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  # A member of the workspace; pub resolves it to packages/domain (resolution: workspace).
  domain: any

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
