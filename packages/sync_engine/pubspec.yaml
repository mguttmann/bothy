# SPDX-License-Identifier: Apache-2.0
name: sync_engine
description: >-
  Gateway, catch-up, outbox, reconciliation and run documents of the apps, without Flutter.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

# The four arrows of 15 3.1: api_client (gateway models), auth (proofs, refresh, the Clock
# port), domain (AppConfig, IDs) and local_store (SyncStateDao). web_socket_channel carries the
# dart:io transport of the gateway; built_collection and built_value are the types and the
# serializers of the generated gateway models.
dependencies:
  api_client:
    path: ../api_client
  auth:
    path: ../auth
  built_collection: ^5.1.2
  built_value: ^8.13.0
  # The outbox classifies the transport errors of the generated client (brief M4-15 Design
  # note 2); the same constraint as in packages/api_client. Also the fake API of the auth
  # session in the tests (test/support/), as in packages/auth.
  dio: ^5.11.1
  # A member of the workspace; pub resolves it to packages/domain (resolution: workspace).
  domain: any
  local_store:
    path: ../local_store
  web_socket_channel: ^3.0.3
  # The fake server of `package:sync_engine/testing.dart` (brief M4-17), a separate library that
  # only test folders import (tools/arch-check rule 10): SHA-256 for `ath` and JWK thumbprints,
  # the ES256 check of DPoP proofs, and reading docs/api/openapi.yaml and asyncapi.yaml for the
  # contract checks. The software P-256 signer of the tests (test/support/) uses the same two.
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
