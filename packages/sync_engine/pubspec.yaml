# SPDX-License-Identifier: Apache-2.0
name: sync_engine
description: >-
  Gateway, catch-up, outbox, reconciliation and run documents of the apps, without Flutter.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  # Members of the workspace; pub resolves them to packages/<name> (resolution: workspace).
  api_client: any
  domain: any
  local_store: any
  # The outbox classifies the transport errors of the generated client (brief M4-15 Design
  # note 2); the same constraint as in packages/api_client.
  dio: ^5.11.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
