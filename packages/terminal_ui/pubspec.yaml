# SPDX-License-Identifier: Apache-2.0
name: terminal_ui
description: >-
  Terminal view: renderer, sessions, key pinning and the extra keys bar.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

# The members of 15 3.1 rule 7 (design_system, auth, api_client, bothy_noise, domain) and,
# through design_system, l10n; xterm is the renderer of 24 12 (latest release, assessed in
# docs/spec/24-terminal.md 12); built_collection and cryptography are the types of the
# api_client and bothy_noise surfaces this package touches, already in the workspace lock.
dependencies:
  api_client: any
  auth: any
  bothy_noise: any
  built_collection: ^5.1.2
  cryptography: ^2.9.0
  design_system: any
  domain: any
  flutter:
    sdk: flutter
  l10n: any
  xterm: ^4.0.0

dev_dependencies:
  alchemist: ^0.14.1
  # Checks the sha256 of the bundled font files against fonts/MANIFEST.json.
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# The terminal font JetBrains Mono (OFL-1.1) with its license text: the static files of the
# four styles xterm draws; fonts/MANIFEST.json records source, commit and sha256, and
# test/terminal_font_test.dart checks them (docs/decisions.d/FIX-terminal-font.md). Apps reach
# the family as `packages/terminal_ui/JetBrains Mono` (terminalFontFamily).
flutter:
  assets:
    - fonts/JetBrainsMono.OFL.txt
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
