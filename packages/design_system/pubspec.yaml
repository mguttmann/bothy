# SPDX-License-Identifier: Apache-2.0
name: design_system
description: >-
  Design tokens (generated), theme, components, icons and fonts of the apps.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  # Every interface text of the components (docs/spec/15-client-architektur.md 3.1).
  l10n:
    path: ../l10n
  # Parses message Markdown into an AST; the components build their own widgets from it and
  # never render HTML (docs/DECISIONS.md D-M4-07-2).
  markdown: ^7.3.1
  # Renders the compiled Phosphor icons of assets/icons/ (docs/DECISIONS.md D-M4-05-1).
  vector_graphics: ^1.1.19

# alchemist and flutter_test serve lib/testing.dart and lib/src/testing/ (the golden matrix,
# dsPumpIcons, the accessibility audits) and the tests. That library is test support: only the
# folders test and integration_test of a member may import it (tools/arch-check rule 10), and
# the workspace has one resolution, so its imports resolve for every member. As regular
# dependencies they put the test libraries into the dependency graph of the apps, whose bundles
# then carried the Roboto files alchemist declares
# (docs/decisions.d/AUD-pkg-design-system-01.md; test/dependencies_test.dart).
dev_dependencies:
  alchemist: ^0.14.1
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Compiles the Phosphor SVGs into assets/icons/ (tools/design-tokens/tokens.py icons).
  vector_graphics_compiler: ^1.1.19

# The variable font files and their OFL texts (fonts/MANIFEST.json, docs/design/typography.md
# "Integration"). The engine drives the `wght` axis from `fontWeight`.
flutter:
  uses-material-design: true
  # The OFL texts ship with the fonts in every app bundle (OFL-1.1 condition 2). The compiled
  # Phosphor icons and their MIT text (assets/icons/MANIFEST.json, generated by
  # tools/design-tokens/tokens.py icons; docs/design/icons.md "Integration").
  assets:
    - fonts/AtkinsonHyperlegibleNext.OFL.txt
    - fonts/AtkinsonHyperlegibleMono.OFL.txt
    - assets/icons/LICENSE
    - assets/icons/bold/
    - assets/icons/fill/
    - assets/icons/regular/
  fonts:
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: fonts/AtkinsonHyperlegibleNext-VariableFont_wght.ttf
        - asset: fonts/AtkinsonHyperlegibleNext-Italic-VariableFont_wght.ttf
          style: italic
    - family: Atkinson Hyperlegible Mono
      fonts:
        - asset: fonts/AtkinsonHyperlegibleMono-VariableFont_wght.ttf
        - asset: fonts/AtkinsonHyperlegibleMono-Italic-VariableFont_wght.ttf
          style: italic
