# SPDX-License-Identifier: Apache-2.0
name: design_system
description: >-
  Design tokens (generated), theme, components, icons and fonts of the apps.
version: 0.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  # A regular dependency because lib/testing.dart returns its GoldenTestGroup; apps import
  # testing.dart only from their tests (docs/DECISIONS.md D-M4-04-5).
  alchemist: ^0.14.1
  flutter:
    sdk: flutter
  # lib/testing.dart also exports dsPumpIcons, a PumpAction on WidgetTester; alchemist brings
  # flutter_test in anyway (docs/DECISIONS.md D-M4-05-5).
  flutter_test:
    sdk: flutter
  # Renders the compiled Phosphor icons of assets/icons/ (docs/DECISIONS.md D-M4-05-1).
  vector_graphics: ^1.1.19

dev_dependencies:
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  # Compiles the Phosphor SVGs into assets/icons/ (tools/design-tokens/tokens.py icons).
  vector_graphics_compiler: ^1.1.19

# The variable font files and their OFL texts (fonts/MANIFEST.json, docs/design/typography.md
# "Integration"). The weight drives the `wght` axis (dsTextStyle).
flutter:
  uses-material-design: true
  # The OFL texts ship with the fonts in every app bundle (OFL-1.1 condition 2). The compiled
  # Phosphor icons and their MIT text (assets/icons/MANIFEST.json, generated by
  # tools/design-tokens/tokens.py icons; docs/design/icons.md "Integration").
  assets:
    - fonts/AtkinsonHyperlegibleNext.OFL.txt
    - fonts/AtkinsonHyperlegibleMono.OFL.txt
    - assets/icons/LICENSE
    - assets/icons/bold/
    - assets/icons/fill/
    - assets/icons/regular/
  fonts:
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: fonts/AtkinsonHyperlegibleNext-VariableFont_wght.ttf
        - asset: fonts/AtkinsonHyperlegibleNext-Italic-VariableFont_wght.ttf
          style: italic
    - family: Atkinson Hyperlegible Mono
      fonts:
        - asset: fonts/AtkinsonHyperlegibleMono-VariableFont_wght.ttf
        - asset: fonts/AtkinsonHyperlegibleMono-Italic-VariableFont_wght.ttf
          style: italic
