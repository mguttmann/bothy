version = "0.0.0"
ecosystem = "Pub"
license.override = ["BSD-3-Clause"]
reason = "Flutter SDK package (packages/flutter of the SDK); its LICENSE file is BSD-3-Clause, the license of the Flutter repository. Runtime dependency of every Flutter member."

