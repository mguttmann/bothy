# SPDX-License-Identifier: Apache-2.0
#
# OSV-Scanner overrides of the root pubspec.lock of the Dart workspace (docs/quality/licenses.md,
# "Lizenz-Gate" item 3): deps.dev has no license data for these pub packages, so OSV-Scanner
# reports UNKNOWN. One entry per package and version, each checked against the LICENSE file of
# that version as pub.dev ships it (checked 2026-10-12 for M2-38, the new packages and versions
# on 2026-10-14 for M4-01). Never a blanket override; a new version needs a new check.
# Runtime packages of the apps today: cryptography (bothy_noise) and its transitive packages,
# characters, collection, material_color_utilities, meta and vector_math (Flutter); the others
# are dev dependencies (test, lints, flutter_lints, flutter_test) and their transitive packages,
# which the gate checks as well.

# Packages of the Flutter SDK (source: sdk, version 0.0.0 in pubspec.lock): they are not on
# pub.dev, so deps.dev cannot know them. Checked against the LICENSE files of Flutter 3.47.7
# on 2026-10-14 (M4-01, docs/DECISIONS.md D-M4-01-9).

