# SPDX-License-Identifier: Apache-2.0
#
# Full verification of build branches on GitHub-hosted runners (docs/quality/push-discipline.md,
# "Build branches"). A push to build/<ticket> runs every gate of the required CI, the make
# targets of `make gates` and the platform jobs of ci.yml, split into parallel jobs; the job
# build-verify-ok sums them up. No secrets: the private deny list and SonarQube stay in the
# pull request CI (ci.yml), this workflow scans with the generic deny rules. It is no required
# check of main; ci-ok of the pull request stays the merge gate.
# tools/ci/tests/test_build_verify_workflow.py keeps the target set equal to `make gates`.
#
# Runners (ADR 0039): every job runs on a GitHub-hosted runner with a fixed label;
# tools/ci/check_runners.py enforces it and limits the trigger to exactly build/**.

name: build-verify

on:
  push:
    branches: ['build/**']

permissions:
  contents: read

# A newer push to the same build branch cancels the older run.
concurrency:
  group: build-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Chromium's sandbox can be blocked where user namespaces are restricted; the renderer only
  # processes this repository's own diagrams (as in ci.yml).
  MMDC_PUPPETEER_CONFIG: tools/node/puppeteer-ci.json

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base: ${{ steps.jobs.outputs.base }}
      components: ${{ steps.jobs.outputs.components }}
      jobs: ${{ steps.jobs.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # The pushed diff is measured from the merge base with build-base/<ticket> when the build
      # team pushed that ref before the build branch (the integration head it built on), else from
      # the merge base with main, as a pull request shows it; without one every job runs
      # (tools/ci/build_base.py). The components and the conditional jobs come from the same
      # plan as in ci.yml (tools/ci/components.py ci-plan, docs/quality/gates.md "Jobs a change
      # needs"); build-verify-ok accepts a skipped job only when the plan left it out.
      - id: jobs
        name: Select the components and jobs this change needs
        env:
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          PUBLIC: ${{ github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public') }}
        run: |
          out=$(mktemp)
          uv run --no-project --python 3.14 tools/ci/build_base.py --branch "$BRANCH" --head "$HEAD_SHA" --github-output "$out"
          base=$(sed -n 's/^base=//p' "$out")
          if [ -n "$base" ]; then
            plan=$(uv run --no-project --python 3.14 tools/ci/components.py ci-plan --base "$base" --head "$HEAD_SHA" --public "$PUBLIC")
          else
            plan=$(uv run --no-project --python 3.14 tools/ci/components.py ci-plan --components all --public "$PUBLIC")
          fi
          echo "$plan"
          { echo "base=$base"; echo "$plan"; } >> "$GITHUB_OUTPUT"

  # Code and repository structure gates; commitlint covers the commits since the merge base.
  static:
    name: static (format, codegen, lint, types, structure)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make fmt-check codegen-check lint typecheck arch register-check migrations-lint sql-visibility flag-check commitlint fragments-check runners-check labels-check release-pins install-options tofu-check
        env:
          COMPONENTS: ${{ needs.plan.outputs.components }}
          COMMIT_RANGE: ${{ needs.plan.outputs.base && format('{0}..{1}', needs.plan.outputs.base, github.sha) || '' }}
          # zizmor's online audits in make lint read public data with the run's token.
          GH_TOKEN: ${{ github.token }}
        run: make fmt-check codegen-check lint typecheck arch register-check migrations-lint sql-visibility flag-check commitlint fragments-check runners-check labels-check release-pins install-options tofu-check COMPONENTS="$COMPONENTS"

  # The Python tools: `make test coverage` with no component selected runs only their tests.
  test-tools:
    name: test (tools)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make test coverage
        env:
          COMPONENTS: none
        run: make test coverage COMPONENTS="$COMPONENTS"

  # Go tests against a real Postgres (Docker on the runner) in shards, and test-server-coverage
  # with their merged coverage threshold, as in ci.yml (tools/ci/go_shards.py); AREAS=none,
  # because test-tools runs the tools suite.
  test-server:
    name: test (server, shard ${{ matrix.shard }} of 6)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' test-server ')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make test
        env:
          COMPONENTS: server
          GO_TEST_SHARD: ${{ matrix.shard }}/6
        run: make test COMPONENTS="$COMPONENTS" AREAS=none GO_TEST_SHARD="$GO_TEST_SHARD"
      - name: Pack the profiles of the shard
        run: |
          shopt -s nullglob
          profiles=(services/*/coverage.out)
          tar -cf "$RUNNER_TEMP/go-shard.tar" -C .cache/go-shard go-shard.txt -C "$GITHUB_WORKSPACE" "${profiles[@]}"
      - name: Upload the profiles of the shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-shard.tar
          if-no-files-found: error
          retention-days: 1

  # The contract tests G7 of the server (`make contract-test`, Schemathesis against the server of
  # this tree), in parallel with the shards of test-server and decided by the plan with them.
  test-server-contract:
    name: test (server contract)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' test-server ')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make contract-test
        env:
          COMPONENTS: server
        run: make contract-test COMPONENTS="$COMPONENTS" AREAS=none

  test-server-coverage:
    name: test (server coverage)
    needs: [plan, test-server]
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' test-server ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - name: Download the profiles of the shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: go-shard-*
          path: ${{ runner.temp }}/go-shard-artifacts
      - name: Merge the profiles of the shards
        run: |
          # download-artifact puts a single matching artifact straight into the path and several
          # into one folder each; every archive gets a folder of its own.
          n=0
          while IFS= read -r archive; do
            n=$((n + 1))
            mkdir -p "$RUNNER_TEMP/go-shards/$n"
            tar -xf "$archive" -C "$RUNNER_TEMP/go-shards/$n"
          done < <(find "$RUNNER_TEMP/go-shard-artifacts" -name go-shard.tar | sort)
          uv run --no-project --python 3.14 tools/ci/go_shards.py merge --tags contract_validate --from "$RUNNER_TEMP/go-shards" --to .
      - name: make coverage
        env:
          COMPONENTS: server
        run: make -o test coverage COMPONENTS="$COMPONENTS" AREAS=none

  # Dart tests of the workspace, the JVM tests of the Android code and their coverage threshold.
  test-apps:
    name: test (apps)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' test-apps ')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make test coverage
        env:
          COMPONENTS: apps
        run: make test coverage COMPONENTS="$COMPONENTS"

  # The SDK and plugin test suites, each with its own threshold.
  test-sdk-plugins:
    name: test (SDKs and plugins)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' test-sdk-plugins ')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make test coverage
        env:
          PLANNED: ${{ needs.plan.outputs.components }}
        # Only the SDK and plugin components of the plan; server and apps have their own jobs.
        run: |
          selected=""
          for c in $PLANNED; do
            case "$c" in
              all) selected="sdk-python sdk-typescript plugins" ;;
              sdk-python|sdk-typescript|plugins) selected="$selected $c" ;;
            esac
          done
          make test coverage COMPONENTS="${selected# }"

  # Documentation, configuration reference, diagrams, API contract and client gates.
  docs:
    name: docs and contracts
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make docs config-doc-check linkcheck diagrams catalog-check api-lint api-checks api-breaking ops-check signal-check api-clients tokens
        env:
          COMPONENTS: ${{ needs.plan.outputs.components }}
        run: make docs config-doc-check linkcheck diagrams catalog-check api-lint api-checks api-breaking ops-check signal-check api-clients tokens COMPONENTS="$COMPONENTS"

  # Secret scan of the whole history, Semgrep, Trivy, OSV and the license gate.
  security:
    name: security and supply chain
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make gitleaks semgrep trivy osv licenses
        env:
          COMPONENTS: ${{ needs.plan.outputs.components }}
        run: make gitleaks semgrep trivy osv licenses COMPONENTS="$COMPONENTS"

  # The generic deny rules over the pushed commits, the files and the branch name; the private
  # list needs a secret and runs in ci.yml for the pull request.
  denylist:
    name: denylist (generic rules)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - name: make denylist (generic rules only)
        env:
          BOTHY_DENYLIST_NAMES: ${{ github.ref_name }}
          DENYLIST_RANGE: ${{ needs.plan.outputs.base && format('{0}..{1}', needs.plan.outputs.base, github.sha) || '' }}
        run: make denylist DENYLIST_FLAGS=--allow-missing

  # As in ci.yml: bothy-postgres built natively per architecture with its two-container test.
  postgres-image-amd64:
    name: postgres-image (amd64)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' postgres-image-amd64 ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: make postgres-image postgres-image-test
        run: make postgres-image postgres-image-test
      # As in ci.yml: the flakes of the job (tools/ci/flakes.py); no artifact without a flake.
      - name: Upload the flakes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flakes-postgres-image-amd64
          path: .cache/flakes/
          include-hidden-files: true # .cache starts with a dot
          if-no-files-found: ignore
          retention-days: 7

  postgres-image-arm64:
    name: postgres-image (arm64)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' postgres-image-arm64 ')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: make postgres-image postgres-image-test
        run: make postgres-image postgres-image-test
      # As in ci.yml: the flakes of the job (tools/ci/flakes.py); no artifact without a flake.
      - name: Upload the flakes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flakes-postgres-image-arm64
          path: .cache/flakes/
          include-hidden-files: true # .cache starts with a dot
          if-no-files-found: ignore
          retention-days: 7

  # As in ci.yml: the console under its CSP (SEC-T05, M6-03).
  console-e2e:
    name: console-e2e
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' console-e2e ')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: make image (host platform)
        run: make image IMAGE_PLATFORMS="linux/$(dpkg --print-architecture)"
      - name: make console-e2e
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/console-e2e-results
        run: make console-e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-results
          path: ${{ runner.temp }}/console-e2e-results
          if-no-files-found: ignore
          retention-days: 7

  # As in ci.yml: platform tests of the apps on macOS, Windows and Android emulators.
  apps-macos:
    name: apps (macOS)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' apps-macos ')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform
        shell: bash
        run: uv run --project tools --locked --quiet python tools/ci/apps_platform.py --system macos

  apps-ios:
    name: apps (iOS)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' apps-ios ')
    runs-on: macos-15
    # The iOS simulator entries of platform-tests.json (--system ios, PL/44): one build and run of
    # the phone tests and the native simulator tests; a command that stalls is stopped by
    # tools/ci/apps_platform.py (SILENCE_SECONDS) and runs once more.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform (iOS)
        shell: bash
        run: uv run --project tools --locked --quiet python tools/ci/apps_platform.py --system ios

  apps-windows:
    name: apps (Windows)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' apps-windows ')
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Windows image has no yq, and flutter-action fetches it from Chocolatey when it reads
      # flutter-version-file; that feed fails often, so the pin is read here (test_ci_toolchains.py).
      - name: Flutter pin of the workspace
        id: flutter-pin
        shell: bash
        run: |
          version="$(sed -n -E 's/^  flutter: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' pubspec.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform
        shell: bash
        run: uv run --project tools --locked --quiet python tools/ci/apps_platform.py

  # The trials of the desktop distribution (brief M7-12, docs/decisions.d/M7-12.md): the release
  # steps of tools/distribution with a test publisher, two builds, and an update of the installed
  # older build through Sparkle on macOS and App Installer on Windows. Only for changes of those
  # files (components.DISTRIBUTION_JOBS); the test publisher lives in the run alone.
  desktop-trial-macos:
    name: desktop trial (macOS)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' desktop-trial-macos ')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make -C apps/client trial-apple
        shell: bash
        run: make -C apps/client trial-apple OUT="$RUNNER_TEMP/trial-apple"

  desktop-trial-windows:
    name: desktop trial (Windows)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' desktop-trial-windows ')
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Windows image has no yq, and flutter-action fetches it from Chocolatey when it reads
      # flutter-version-file; that feed fails often, so the pin is read here (test_ci_toolchains.py).
      - name: Flutter pin of the workspace
        id: flutter-pin
        shell: bash
        run: |
          version="$(sed -n -E 's/^  flutter: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' pubspec.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # make -C apps/client trial-windows; Git Bash on the runner has no make.
      - name: trial-windows
        shell: bash
        run: uv run --project tools --locked --quiet python tools/distribution/windows.py trial --out "$RUNNER_TEMP/trial-windows"

  # The trials of the phone distribution (brief M7-13, docs/decisions.d/M7-13.md): the release
  # steps of tools/distribution with a test publisher. iOS: the unsigned archive of the template's
  # publisher, its identifiers, versions and entitlements checked; Android: the App Bundle signed
  # with a throwaway upload key, checked with jarsigner, bundletool and apksigner. Only for
  # changes of those files (components.MOBILE_TRIAL_JOBS); nothing leaves the run.
  mobile-trial-ios:
    name: mobile trial (iOS)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' mobile-trial-ios ')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make -C apps/client trial-ios
        shell: bash
        run: make -C apps/client trial-ios OUT="$RUNNER_TEMP/trial-ios"

  mobile-trial-android:
    name: mobile trial (Android)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' mobile-trial-android ')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make -C apps/client trial-android
        shell: bash
        run: make -C apps/client trial-android OUT="$RUNNER_TEMP/trial-android"

  # The platform trials of the host packages (brief M7-23, docs/decisions.d/M7-23.md): the .pkg and
  # the MSI built and signed with a test publisher (tools/distribution/hostdist.py), installed on
  # the disposable runner and checked (owners, modes, no running service, the version; on Windows
  # also the uninstall). Only for changes of the host service and its release steps
  # (components.HOST_TRIAL_JOBS); the test publisher lives in the run alone.
  host-trial-macos:
    name: host trial (macOS)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' host-trial-macos ')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/host/go.mod
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make -C services/host trial-apple
        shell: bash
        run: make -C services/host trial-apple OUT="$RUNNER_TEMP/trial-host-apple"

  host-trial-windows:
    name: host trial (Windows)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' host-trial-windows ')
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/host/go.mod
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # Git Bash on the runner has no make: the step of the trial directly.
      - name: host trial (Windows)
        shell: bash
        run: uv run --project tools --locked --quiet python tools/distribution/hostdist.py windows-trial --out "$RUNNER_TEMP/trial-host-windows"

  apps-android-26:
    name: apps (Android API 26)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' apps-android-26 ')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable hardware acceleration (kvm)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # The client app's Android tests build the app (brief M5-03).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # The emulator and its system image before the action, with retries: the action gives up
      # on the first broken download (tools/ci/android_sdk.py).
      - name: Install the emulator packages
        run: uv run --project tools --locked --quiet python tools/ci/android_sdk.py --api-level 26
      - name: make apps-platform (Android)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: uv run --project tools --locked --quiet python tools/ci/apps_platform.py --system android

  apps-android-36:
    name: apps (Android API 36)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' apps-android-36 ')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable hardware acceleration (kvm)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # The client app's Android tests build the app (brief M5-03).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # The emulator and its system image before the action, with retries: the action gives up
      # on the first broken download (tools/ci/android_sdk.py).
      - name: Install the emulator packages
        run: uv run --project tools --locked --quiet python tools/ci/android_sdk.py --api-level 36
      - name: make apps-platform (Android)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: uv run --project tools --locked --quiet python tools/ci/apps_platform.py --system android

  # One result per push: the plan and every job it needs passed; a conditional job may be
  # skipped only when the plan left it out (tools/ci/ci_ok.py needs). A failed, cancelled or
  # missing plan fails it.
  build-verify-ok:
    name: build-verify-ok
    needs: [plan, static, test-tools, test-server, test-server-coverage, test-server-contract, test-apps, test-sdk-plugins, docs, security, denylist, postgres-image-amd64, postgres-image-arm64, console-e2e, apps-macos, apps-ios, apps-windows, apps-android-26, apps-android-36, desktop-trial-macos, desktop-trial-windows, mobile-trial-ios, mobile-trial-android, host-trial-macos, host-trial-windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Every job the plan needs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CI_JOBS: ${{ needs.plan.outputs.jobs }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' \
            | { echo "| job | result |"; echo "|---|---|"; cat; } >> "$GITHUB_STEP_SUMMARY"
          uv run --no-project --python 3.14 tools/ci/ci_ok.py needs
