# SPDX-License-Identifier: Apache-2.0
#
# Publishes the documentation site to GitHub Pages, only while the repository is public
# (ADR 0039 rule 1): Pages of a private repository would still be a public website. The docs
# build itself is a gate of every pull request (`make docs` in ci.yml).
# Publishes at every release tag, once a day from main, and on demand.

name: docs

on:
  push:
    tags:
      - "v[0-9]*"
      - "*/v[0-9]*"
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site
    if: github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # `make docs` generates the Dart API pages with `dart doc` (docs/DECISIONS.md D-M4-01-6).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # `make docs` builds the typedoc reference of the TypeScript SDK first
      # (docs/DECISIONS.md D-M2-30-13).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --prefix sdk/typescript --ignore-scripts --no-audit --no-fund --loglevel=error
      - run: make docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    if: github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # deploy the site
      id-token: write # authenticate the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
