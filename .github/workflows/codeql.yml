# SPDX-License-Identifier: Apache-2.0
#
# CodeQL code scanning, only while the repository is public (ADR 0039 rule 1): code scanning
# is free for public repositories. Semgrep, SonarQube, golangci-lint (gosec) and bandit cover
# static analysis in every pull request and locally.
# Languages: the matrix lists every tracked language CodeQL supports, found through the
# workflows, tools/ and the component manifests the root Makefile discovers;
# tools/ci/tests/test_codeql_workflow.py enforces it. `javascript-typescript` is added by the
# ticket that adds the first TypeScript project. Go uses `build-mode: manual` because CodeQL
# has no `none` mode for Go and its autobuilder would run the root Makefile first; the
# manual build runs `go build ./...` in the module, as `make typecheck` does. Dart is not
# supported by CodeQL.

name: codeql

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    if: github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the CodeQL results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/server/go.mod
          # A restored cache is not verified again: go.sum is checked when a module is
          # downloaded, the build cache never. An analysis must not trust state written by
          # another run, and on free public runners a cache saves nothing worth that risk.
          cache: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build the server module for CodeQL
        if: matrix.language == 'go'
        working-directory: services/server
        env:
          # The server ships as a static binary (baseline B2, ADR 0005): CodeQL sees the
          # build configuration that is shipped.
          CGO_ENABLED: "0"
        run: go build ./...
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
