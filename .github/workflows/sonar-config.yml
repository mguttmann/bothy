# SPDX-License-Identifier: Apache-2.0
#
# Apply the repository's SonarQube quality gate and quality profiles (quality/sonar/) to
# SonarQube Cloud and check them (docs/quality/sonarqube-local.md, section 6;
# docs/quality/public-switch.md, step 12). On the cloud the gate and the profiles are
# assigned to the project of the variable SONAR_PROJECT_KEY, and the project's main branch is
# named `main` (ci.yml analyses main only after that, see SONAR_MAIN_ANALYSIS) and the project
# is made public (a private project on the free plan is capped in lines of code). The token exists only as the secret SONAR_TOKEN,
# so the maintainer starts this run by hand after a change under quality/sonar/ or the
# monthly check: gh workflow run sonar-config.yml --ref main.
#
# Only workflow_dispatch, and the job runs only for main: the code that receives the token
# is the merged, reviewed commit, on a GitHub-hosted runner like every job (ADR 0039).

name: sonar-config

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-config
  cancel-in-progress: false

jobs:
  sonar-config:
    name: sonar-config (SonarQube Cloud)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - name: Check the repository variables
        run: |
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::repository variable SONAR_ORGANIZATION is not set"
            exit 1
          fi
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::error::repository variable SONAR_PROJECT_KEY is not set"
            exit 1
          fi
      # The free plan caps the lines of code of a private project and refused the analysis of
      # main; a public project has no such cap, and the repository is public anyway.
      - name: make sonar-visibility
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: make sonar-visibility SONAR_HOST_URL="$SONAR_HOST_URL" SONAR_ORGANIZATION="$SONAR_ORGANIZATION" SONAR_PROJECT_KEY="$SONAR_PROJECT_KEY"
      # First, because it does not depend on gate and profiles: a failing check below must not
      # keep the main branch from being named main.
      - name: make sonar-main-branch
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: make sonar-main-branch SONAR_HOST_URL="$SONAR_HOST_URL" SONAR_ORGANIZATION="$SONAR_ORGANIZATION" SONAR_PROJECT_KEY="$SONAR_PROJECT_KEY"
      - name: make sonar-config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: make sonar-config SONAR_HOST_URL="$SONAR_HOST_URL" SONAR_ORGANIZATION="$SONAR_ORGANIZATION" SONAR_PROJECT_KEY="$SONAR_PROJECT_KEY"
      - name: make sonar-config-check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: make sonar-config-check SONAR_HOST_URL="$SONAR_HOST_URL" SONAR_ORGANIZATION="$SONAR_ORGANIZATION" SONAR_PROJECT_KEY="$SONAR_PROJECT_KEY"
