# SPDX-License-Identifier: Apache-2.0
#
# Daily vulnerability scan of the images an instance runs (docs/quality/gates.md, section
# "Advisories"; #908). It scans the operating system packages and binaries that no lock file
# names: bothy-server and bothy-postgres built from main for the runner's platform (until a
# release publishes them; the release scans its own images in release.yml) and the third-party
# images of the Compose files at their default versions (tools/ci/compose_images.py). A HIGH or
# CRITICAL finding with a fix fails the run, and the red run reaches an issue like any other
# (docs/quality/gates.md, "Red runs"). It is a workflow of its own so that a finding that waits
# for an upstream release does not hide a red lock scan of advisories.yml.

name: images

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  images:
    name: images (vulnerability scan of the images of an instance)
    if: github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two image builds and ten image pulls; without the unused toolchains the disk ran full
      # in the image jobs of ci.yml (tools/ci/free_disk.sh).
      - name: Free disk space
        run: sh tools/ci/free_disk.sh
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Restore pinned binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json') }}
      - name: make image and make postgres-image (host platform)
        run: |
          platform="linux/$(dpkg --print-architecture)"
          make image IMAGE_PLATFORMS="$platform" IMAGE_TAG=scan
          make postgres-image IMAGE_PLATFORMS="$platform" POSTGRES_IMAGE_TAG=pg18-scan
      # Every image is scanned before the step fails, so one run lists every finding.
      - name: make trivy-image over the built and the third-party images
        run: |
          third_party=$(uv run --project tools --locked --quiet python tools/ci/compose_images.py)
          failed=""
          for image in bothy-server:scan bothy-postgres:pg18-scan $third_party; do
            echo "::group::$image"
            make trivy-image IMAGE="$image" || failed="$failed $image"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            # Trivy exits 1 for a finding and for its own error (database download, image pull).
            echo "::error::HIGH or CRITICAL vulnerabilities with a fix, or a Trivy error (see the group of the image), in:$failed"
            exit 1
          fi
