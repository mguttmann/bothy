# SPDX-License-Identifier: Apache-2.0
#
# Daily proposal of the newest upstream main commit of Hermes Agent as the adapter's pin
# (docs/decisions.d/HERMES-PIN-MAIN.md, D-HERMES-PIN-1 and D-HERMES-PIN-2). The job rewrites
# plugins/hermes-adapter/tests/hermes_pin.toml and the "Current pin" line of spec 09 17.10,
# records again and runs the component's tests against the new pin, and force-pushes one bundled
# proposal branch with one pull request. It never replaces a proposal that a maintainer has
# committed to, and does nothing while main or the proposal already names the head.
# A pull request that this token opens starts no workflow, so ci.yml runs on it once a
# maintainer closes and reopens it or edits it (D-HERMES-PIN-4).

name: hermes-pin

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-pin
  cancel-in-progress: false

jobs:
  propose:
    name: hermes-pin (propose the newest upstream main commit)
    if: github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # push the proposal branch
      pull-requests: write # open or update its pull request
    env:
      BRANCH: bot/hermes-main-pin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: plugins/hermes-adapter/uv.lock
      - id: proposal
        name: Fetch the open proposal
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch -q --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            echo "ref=origin/$BRANCH" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse "origin/$BRANCH")" >> "$GITHUB_OUTPUT"
          fi
      - id: bump
        name: Bump the pin to the upstream main head
        env:
          PROPOSAL: ${{ steps.proposal.outputs.ref }}
        run: |
          uv run --no-project --python 3.14 plugins/hermes-adapter/tests/follow_main.py \
            bump --root . ${PROPOSAL:+--proposal "$PROPOSAL"} --github-output "$GITHUB_OUTPUT"
      - id: record
        name: make -C plugins/hermes-adapter record
        if: steps.bump.outputs.propose == 'true'
        continue-on-error: true
        run: make -C plugins/hermes-adapter record
      - id: test
        name: make -C plugins/hermes-adapter test
        if: steps.bump.outputs.propose == 'true'
        continue-on-error: true
        run: make -C plugins/hermes-adapter test
      - name: Push the proposal and open or update its pull request
        if: steps.bump.outputs.propose == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ steps.bump.outputs.commit }}
          SHORT: ${{ steps.bump.outputs.short }}
          EXPECTED: ${{ steps.proposal.outputs.sha }}
          RECORD: ${{ steps.record.outcome }}
          TEST: ${{ steps.test.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="chore(deps): follow Hermes Agent main to $SHORT"
          git add -A -- plugins/hermes-adapter/tests docs/spec/09-agents.md
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -s -F - <<EOF
          $title

          Pin upstream main commit $COMMIT (D-HERMES-PIN-1).
          Recording: $RECORD. Tests of plugins/hermes-adapter: $TEST.
          EOF
          gh auth setup-git
          git push -q --force-with-lease="refs/heads/$BRANCH:$EXPECTED" origin "HEAD:refs/heads/$BRANCH"
          body=$(mktemp)
          cat > "$body" <<EOF
          Proposes upstream Hermes Agent main commit \`$COMMIT\` as the pin of the Hermes adapter
          (docs/decisions.d/HERMES-PIN-MAIN.md, D-HERMES-PIN-1). Written by the workflow hermes-pin: $RUN_URL

          - \`make -C plugins/hermes-adapter record\`: $RECORD
          - \`make -C plugins/hermes-adapter test\`: $TEST

          When a step failed, adapt this branch (fixtures, the verdicts of spec 09 17.10, stubs);
          the workflow never replaces a branch with a commit of anyone else. A newer upstream
          commit replaces this proposal while only the workflow wrote it.

          This pull request was opened with the workflow token, so ci.yml starts only when a
          maintainer closes and reopens it or edits its title or body (D-HERMES-PIN-4).
          EOF
          number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" --title "$title" --body-file "$body"
          elif ! gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body-file "$body"; then
            echo "::error::branch $BRANCH is pushed, but no pull request was opened; the repository setting 'Allow GitHub Actions to create and approve pull requests' must be on (D-HERMES-PIN-4)"
            exit 1
          fi
      - name: Fail when the recording or the tests failed
        if: steps.bump.outputs.propose == 'true' && (steps.record.outcome != 'success' || steps.test.outcome != 'success')
        env:
          RECORD: ${{ steps.record.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          echo "::error::recording $RECORD, tests $TEST: the proposal names what to adapt"
          exit 1
