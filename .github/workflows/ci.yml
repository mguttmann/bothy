# SPDX-License-Identifier: Apache-2.0
#
# Merge gate for pull requests to main, and the gate stage of release.yml.
# Runs exactly the make targets of `make check`: gates, denylist, sonar
# (docs/quality/gates.md). The only required status check is "ci-ok".
#
# Runner switch (ADR 0039): while the repository is private, every job runs on the
# self-hosted runner with the label bothy-ci; once it is public, on GitHub-hosted
# runners. tools/ci/check_runners.py enforces the switch on every job.

name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      components:
        description: Gate components (tools/ci/components.py) or "all"
        type: string
        default: all
    secrets:
      SONAR_TOKEN:
        required: false
      # Provided by the protected environment "denylist", never by the caller.
      BOTHY_DENYLIST:
        required: false
      BOTHY_DENYLIST_ALLOW_AUTHORS:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","bothy-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      components: ${{ steps.plan.outputs.components }}
      same_repo: ${{ steps.plan.outputs.same_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - id: plan
        name: Select components from the changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          INPUT_COMPONENTS: ${{ inputs.components }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            components=$(uv run --no-project --python 3.14 tools/ci/components.py changed --base "$BASE_SHA" --head "$HEAD_SHA")
            if [ "$HEAD_REPO" = "$REPO" ]; then same_repo=true; else same_repo=false; fi
          else
            components="${INPUT_COMPONENTS:-all}"
            same_repo=true
          fi
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "same_repo=$same_repo" >> "$GITHUB_OUTPUT"
          echo "components: $components (same repository: $same_repo)"

  gates:
    name: gates
    needs: plan
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","bothy-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make gates
        env:
          # Chromium's sandbox can be blocked where user namespaces are restricted; the
          # renderer only processes this repository's own diagrams.
          MMDC_PUPPETEER_CONFIG: tools/node/puppeteer-ci.json
          COMPONENTS: ${{ needs.plan.outputs.components }}
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: make gates COMPONENTS="$COMPONENTS"

  denylist:
    name: denylist (private list)
    needs: plan
    if: needs.plan.outputs.same_repo == 'true'
    environment: denylist
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","bothy-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make denylist
        env:
          LIST: ${{ secrets.BOTHY_DENYLIST }}
          ALLOW: ${{ secrets.BOTHY_DENYLIST_ALLOW_AUTHORS }}
          BOTHY_DENYLIST_NAMES: ${{ github.head_ref }}
          DENYLIST_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
        run: |
          umask 077
          dir=$(mktemp -d "$RUNNER_TEMP/denylist.XXXXXX")
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$LIST" > "$dir/denylist.txt"
          printf '%s\n' "$ALLOW" > "$dir/allow-authors.txt"
          export BOTHY_DENYLIST_FILE="$dir/denylist.txt"
          make denylist

  denylist-fork:
    name: denylist (generic rules, fork)
    needs: plan
    if: needs.plan.outputs.same_repo != 'true'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","bothy-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make denylist (generic rules only)
        env:
          BOTHY_DENYLIST_NAMES: ${{ github.head_ref }}
          DENYLIST_RANGE: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: make denylist DENYLIST_FLAGS=--allow-missing

  sonar:
    name: sonar
    needs: plan
    if: needs.plan.outputs.same_repo == 'true'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","bothy-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - run: make bootstrap-ci
      - name: make sonar
        env:
          # As for "make gates": `make sonar` runs `make test` first, and its diagram tests
          # start Chromium.
          MMDC_PUPPETEER_CONFIG: tools/node/puppeteer-ci.json
          COMPONENTS: ${{ needs.plan.outputs.components }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: make sonar COMPONENTS="$COMPONENTS" SONAR_HOST_URL="${SONAR_HOST_URL:-http://127.0.0.1:9000}" SONAR_ORGANIZATION="$SONAR_ORGANIZATION" SONAR_PROJECT_KEY="${SONAR_PROJECT_KEY:-bothy}"

  # bothy-postgres built natively on each architecture and proven with its two-container test
  # (brief M7-01, 18 "Server-Images" rule 2): no QEMU, because no build step runs on the target
  # platform and each runner tests its own. Only when the component server changed; public phase
  # only, because the arm64 runner is GitHub-hosted (ADR 0039).
  postgres-image:
    name: postgres-image (${{ matrix.runner }})
    needs: plan
    if: >-
      (github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public'))
      && (needs.plan.outputs.components == 'all' || contains(format(' {0} ', needs.plan.outputs.components), ' server '))
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      # A docker-container builder writes the multi-platform OCI archive; it emulates nothing.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: make postgres-image postgres-image-test
        run: make postgres-image postgres-image-test

  # Platform tests of the apps (make apps-platform, docs/DECISIONS.md D-M4-01-7): native code
  # and desktop integration tests need macOS and Windows (ADR 0039), the pure gates run on
  # Linux. Only when the apps component is selected; in the private phase there is no runner
  # for them, so they run in the public phase only, and ci-ok accepts "skipped".
  apps-macos:
    name: apps (macOS)
    needs: plan
    if: (github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')) && (needs.plan.outputs.components == 'all' || contains(format(' {0} ', needs.plan.outputs.components), ' apps '))
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform
        shell: bash
        run: uv run --project tools --locked --quiet python tools/ci/apps_platform.py

  apps-windows:
    name: apps (Windows)
    needs: plan
    if: (github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')) && (needs.plan.outputs.components == 'all' || contains(format(' {0} ', needs.plan.outputs.components), ' apps '))
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform
        shell: bash
        run: uv run --project tools --locked --quiet python tools/ci/apps_platform.py

  ci-ok:
    name: ci-ok
    needs: [plan, gates, denylist, denylist-fork, sonar, postgres-image, apps-macos, apps-windows]
    if: always()
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","bothy-ci"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gates.result }}
          DENY: ${{ needs.denylist.result }}
          DENY_FORK: ${{ needs.denylist-fork.result }}
          SONAR: ${{ needs.sonar.result }}
          POSTGRES_IMAGE: ${{ needs.postgres-image.result }}
          APPS_MACOS: ${{ needs.apps-macos.result }}
          APPS_WINDOWS: ${{ needs.apps-windows.result }}
        # Explicit checks: a failing test inside an && list would not stop `bash -e`.
        run: |
          echo "plan=$PLAN gates=$GATES denylist=$DENY denylist-fork=$DENY_FORK sonar=$SONAR postgres-image=$POSTGRES_IMAGE apps-macos=$APPS_MACOS apps-windows=$APPS_WINDOWS"
          fail=0
          if [ "$PLAN" != success ]; then fail=1; fi
          if [ "$GATES" != success ]; then fail=1; fi
          if [ "$DENY" != success ] && [ "$DENY_FORK" != success ]; then fail=1; fi
          case "$SONAR" in success|skipped) ;; *) fail=1 ;; esac
          # Skipped when the component server did not change (job postgres-image).
          case "$POSTGRES_IMAGE" in success|skipped) ;; *) fail=1 ;; esac
          case "$APPS_MACOS" in success|skipped) ;; *) fail=1 ;; esac
          case "$APPS_WINDOWS" in success|skipped) ;; *) fail=1 ;; esac
          exit "$fail"
