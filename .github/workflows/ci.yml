# SPDX-License-Identifier: Apache-2.0
#
# Merge gate for pull requests to main, and the gate stage of release.yml.
# Runs exactly the make targets of `make check`: gates, denylist, sonar
# (docs/quality/gates.md). The only required status check is "ci-ok".
# The tests run once per run, in the job gates; the job sonar scans the coverage reports that
# job wrote. A push to main runs the workflow too, so SonarQube keeps an analysis of main (its
# overall state and the reference of new code); push events only come from this repository's
# own branch, never from a fork, so no fork code runs with the secrets.
# The pull request title and body become the squash commit on main, so the deny-list jobs
# scan them too (PR_TITLE, PR_BODY), and an edit of title or body ("edited") runs the whole
# workflow again. ci-ok starts with every run (no `needs`), so its check run is pending from
# the first second of the new run; what this does not cover is listed in
# docs/quality/push-discipline.md, section "Pull request title and body".
#
# Runners (ADR 0039): every job runs on a GitHub-hosted runner with a fixed label;
# tools/ci/check_runners.py enforces it on every job.

name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      components:
        description: Gate components (tools/ci/components.py) or "all"
        type: string
        default: all
    secrets:
      SONAR_TOKEN:
        required: false
      # Provided by the protected environment "denylist", never by the caller.
      BOTHY_DENYLIST:
        required: false
      BOTHY_DENYLIST_ALLOW_AUTHORS:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      components: ${{ steps.plan.outputs.components }}
      private_checks: ${{ steps.plan.outputs.private_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # private_checks=false (fork pull request, or a dependency bot's run, which GitHub
      # gives no secrets): generic deny rules instead of the private list, sonar skipped,
      # with a notice on the run (tools/ci/pr_mode.py, D-DEPS-3).
      - id: plan
        name: Select components and the checks that need secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          INPUT_COMPONENTS: ${{ inputs.components }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            components=$(uv run --no-project --python 3.14 tools/ci/components.py changed --base "$BASE_SHA" --head "$HEAD_SHA")
          else
            components="${INPUT_COMPONENTS:-all}"
          fi
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "components: $components"
          uv run --no-project --python 3.14 tools/ci/pr_mode.py --event "$EVENT" --repo "$REPO" \
            --head-repo "$HEAD_REPO" --author "$AUTHOR" --actor "$ACTOR" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  gates:
    name: gates
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # JDK and Android SDK for the JVM tests of the Android core that `make test` runs
      # (brief M5-01; docs/DECISIONS.md D-M5-01-5).
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make gates
        env:
          # Chromium's sandbox can be blocked where user namespaces are restricted; the
          # renderer only processes this repository's own diagrams.
          MMDC_PUPPETEER_CONFIG: tools/node/puppeteer-ci.json
          COMPONENTS: ${{ needs.plan.outputs.components }}
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # A dependency bot's own commits need no sign-off in its pull request (D-DEPS-3).
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: make gates COMPONENTS="$COMPONENTS"
      # The coverage reports of `make test` for the job sonar, which scans them instead of
      # running the tests again. REPORTS covers every report path of sonar-project.properties
      # (tools/ci/tests/test_sonar_coverage_handoff.py); a component that was not selected wrote
      # no report, as before. The list file always exists, so the artifact is never empty.
      - name: Pack the coverage reports for sonar
        env:
          REPORTS: >-
            services/*/coverage.out
            sdk/python/coverage.xml
            plugins/*/coverage.xml
            sdk/typescript/coverage/lcov.info
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
            packages/*/*/coverage/lcov.info
        run: |
          shopt -s nullglob
          dir="$RUNNER_TEMP/sonar-coverage"
          mkdir -p "$dir"
          # A run that selects only some components writes only their reports: nullglob drops the
          # globs without a match, the test drops the literal paths that do not exist.
          files=()
          # shellcheck disable=SC2086 # REPORTS is a list of globs, expanded on purpose
          for f in $REPORTS; do
            if [ -e "$f" ]; then files+=("$f"); fi
          done
          printf '%s\n' "${files[@]}" > "$dir/reports.txt"
          tar -cf "$dir/coverage.tar" -T "$dir/reports.txt"
          echo "coverage reports for sonar: ${#files[@]}"
      - name: Upload the coverage reports for sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage/coverage.tar
          if-no-files-found: error
          retention-days: 1

  denylist:
    name: denylist (private list)
    needs: plan
    if: needs.plan.outputs.private_checks == 'true'
    environment: denylist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make denylist
        env:
          LIST: ${{ secrets.BOTHY_DENYLIST }}
          ALLOW: ${{ secrets.BOTHY_DENYLIST_ALLOW_AUTHORS }}
          BOTHY_DENYLIST_NAMES: ${{ github.head_ref }}
          DENYLIST_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          # Untrusted text: only through the environment, never into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          umask 077
          dir=$(mktemp -d "$RUNNER_TEMP/denylist.XXXXXX")
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$LIST" > "$dir/denylist.txt"
          printf '%s\n' "$ALLOW" > "$dir/allow-authors.txt"
          export BOTHY_DENYLIST_FILE="$dir/denylist.txt"
          make denylist

  denylist-fork:
    name: denylist (generic rules, fork)
    needs: plan
    if: needs.plan.outputs.private_checks != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make denylist (generic rules only)
        env:
          BOTHY_DENYLIST_NAMES: ${{ github.head_ref }}
          DENYLIST_RANGE: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make denylist DENYLIST_FLAGS=--allow-missing

  sonar:
    name: sonar
    # Scans the coverage reports of the job gates instead of running the tests again; skipped
    # when gates fails, which already fails ci-ok.
    needs: [plan, gates]
    if: needs.plan.outputs.private_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # Go and Flutter as the scan saw them when it followed `make test` in this job: the Go
      # toolchain on the PATH and the Dart workspace resolved (docs/DECISIONS.md D-M2-38-1,
      # D-M4-01-1). No JDK or Android SDK: those only served the JVM tests.
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        run: flutter pub get --enforce-lockfile
      - run: make bootstrap-ci
      - name: Download the coverage reports of gates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage
      - name: Unpack the coverage reports
        run: tar -xvf "$RUNNER_TEMP/sonar-coverage/coverage.tar"
      - name: make sonar-scan
        env:
          COMPONENTS: ${{ needs.plan.outputs.components }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: make sonar-scan COMPONENTS="$COMPONENTS" SONAR_HOST_URL="${SONAR_HOST_URL:-http://127.0.0.1:9000}" SONAR_ORGANIZATION="$SONAR_ORGANIZATION" SONAR_PROJECT_KEY="${SONAR_PROJECT_KEY:-bothy}"

  # bothy-postgres built natively on each architecture and proven with its two-container test
  # (brief M7-01, 18 "Server images" rule 2): no QEMU, because no build step runs on the target
  # platform and each runner tests its own. Only when the component server changed. Two jobs
  # with fixed names instead of a matrix, so that tools/ci/ci_ok.py can require them by name
  # (a skipped matrix job has no expanded name).
  postgres-image-amd64:
    name: postgres-image (amd64)
    needs: plan
    if: needs.plan.outputs.components == 'all' || contains(format(' {0} ', needs.plan.outputs.components), ' server ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      # A docker-container builder writes the multi-platform OCI archive; it emulates nothing.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: make postgres-image postgres-image-test
        run: make postgres-image postgres-image-test

  postgres-image-arm64:
    name: postgres-image (arm64)
    needs: plan
    if: needs.plan.outputs.components == 'all' || contains(format(' {0} ', needs.plan.outputs.components), ' server ')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      # A docker-container builder writes the multi-platform OCI archive; it emulates nothing.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: make postgres-image postgres-image-test
        run: make postgres-image postgres-image-test

  # Platform tests of the apps (make apps-platform, docs/DECISIONS.md D-M4-01-7): native code
  # and desktop integration tests need macOS and Windows (ADR 0039), Android code an emulator
  # (apps-android-*, D-M5-01-5), the pure gates run on Linux. Only when the apps component is
  # selected (Android only in the public phase); ci-ok (tools/ci/ci_ok.py) requires each job to
  # pass or be skipped.
  apps-macos:
    name: apps (macOS)
    needs: plan
    if: needs.plan.outputs.components == 'all' || contains(format(' {0} ', needs.plan.outputs.components), ' apps ')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform
        shell: bash
        run: uv run --project tools --locked --quiet python tools/ci/apps_platform.py

  apps-windows:
    name: apps (Windows)
    needs: plan
    if: needs.plan.outputs.components == 'all' || contains(format(' {0} ', needs.plan.outputs.components), ' apps ')
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform
        shell: bash
        run: uv run --project tools --locked --quiet python tools/ci/apps_platform.py

  apps-android-26:
    name: apps (Android API 26)
    needs: plan
    if: (github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')) && (needs.plan.outputs.components == 'all' || contains(format(' {0} ', needs.plan.outputs.components), ' apps '))
    # The instrumented tests of the Android code on an emulator (brief M5-01, Design note 5): the
    # minimum API level of 15 2 and the current stable one, x86_64 Google APIs images without
    # the Play Store. Emulators have no StrongBox, so that test reports a skip. One job per level
    # instead of a matrix, because ci-ok requires its jobs by name (D-M7-01-7).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable hardware acceleration (kvm)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform (Android)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: uv run --project tools --locked --quiet python tools/ci/apps_platform.py --system android

  apps-android-36:
    name: apps (Android API 36)
    needs: plan
    if: (github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')) && (needs.plan.outputs.components == 'all' || contains(format(' {0} ', needs.plan.outputs.components), ' apps '))
    # The instrumented tests of the Android code on an emulator (brief M5-01, Design note 5): the
    # minimum API level of 15 2 and the current stable one, x86_64 Google APIs images without
    # the Play Store. Emulators have no StrongBox, so that test reports a skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable hardware acceleration (kvm)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform (Android)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: uv run --project tools --locked --quiet python tools/ci/apps_platform.py --system android

  ci-ok:
    name: ci-ok
    # No `needs` on purpose: a job with `needs` gets its check run only when the others are
    # done, so an older green ci-ok would stay the latest result of the head commit while the
    # run after an edit of the pull request text is still going. tools/ci/ci_ok.py waits for
    # the other jobs of this run through the API and combines their results. Its timeout
    # covers plan, gates and sonar in a row, with margin for queueing.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: read # list the jobs of this run
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: All required jobs passed
        env:
