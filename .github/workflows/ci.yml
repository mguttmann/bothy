# SPDX-License-Identifier: Apache-2.0
#
# Merge gate for pull requests to main, and the gate stage of release.yml.
# Runs exactly the make targets of `make check`: gates, denylist, sonar
# (docs/quality/gates.md). The only required status check is "ci-ok".
# The tests run once per run, in the job gates; the job sonar scans the coverage reports that
# job wrote. A push to main runs the workflow too, so SonarQube keeps an analysis of main (its
# overall state and the reference of new code); push events only come from this repository's
# own branch, never from a fork, so no fork code runs with the secrets.
# The pull request title and body become the squash commit on main, so the deny-list jobs
# scan them too (PR_TITLE, PR_BODY), and an edit of title or body ("edited") runs the whole
# workflow again. ci-ok is the last job (it needs every other job), and the plan job marks
# ci-ok pending for the head commit at once, so an older green ci-ok never stands for the new
# run; what this does not cover is listed in docs/quality/push-discipline.md, section
# "Pull request title and body".
#
# Runners (ADR 0039): every job runs on a GitHub-hosted runner with a fixed label;
# tools/ci/check_runners.py enforces it on every job.

name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      components:
        description: Gate components (tools/ci/components.py) or "all"
        type: string
        default: all
    secrets:
      SONAR_TOKEN:
        required: false
      # Provided by the protected environment "denylist", never by the caller.
      BOTHY_DENYLIST:
        required: false
      BOTHY_DENYLIST_ALLOW_AUTHORS:
        required: false

permissions:
  contents: read

# A new commit of a pull request cancels its older run. A push to main never cancels the run
# in progress: merges come faster than one full run, and SonarQube needs a finished analysis of
# main. The newer push waits; GitHub keeps at most one pending run per group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      checks: write # mark ci-ok pending for the head commit
      contents: read
    outputs:
      components: ${{ steps.jobs.outputs.components }}
      jobs: ${{ steps.jobs.outputs.jobs }}
      marker: ${{ steps.mark.outputs.marker }}
      private_checks: ${{ steps.plan.outputs.private_checks }}
    steps:
      # ci-ok is the last job, and a job with `needs` gets its check run only when the jobs it
      # needs have ended. So that an older green ci-ok of the same head commit (a run before an
      # edit of title or body, or before a reopen) never stands while this run goes, the first
      # step creates a check run `ci-ok` in progress; it is the latest ci-ok of the commit, and
      # ci-ok completes it with its own conclusion (tools/ci/ci_ok.py). Not for a fork or a
      # dependency bot's run: their token cannot write checks (D-DEPS-3).
      - id: mark
        name: Mark ci-ok pending for the head commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker=$(gh api -X POST "repos/$REPO/check-runs" -f name=ci-ok -f head_sha="$HEAD_SHA" \
            -f status=in_progress -f details_url="$DETAILS_URL" \
            -f 'output[title]=Waiting for the jobs of this run' \
            -f 'output[summary]=The job ci-ok of this run completes this check run with its own conclusion.' \
            --jq .id)
          case "$marker" in '' | *[!0-9]*) echo "unexpected check run id: $marker"; exit 1 ;; esac
          echo "ci-ok pending: check run $marker"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # The components and the conditional jobs this change needs (tools/ci/components.py
      # ci-plan, docs/quality/gates.md "Jobs a change needs"): a pull request by its diff, a push
      # to main and a manual run everything, a release the components of its tag. ci-ok accepts
      # a skipped job only when this plan left it out (tools/ci/ci_ok.py).
      - id: jobs
        name: Select the components and jobs this change needs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_COMPONENTS: ${{ inputs.components }}
          PUBLIC: ${{ github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public') }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            plan=$(uv run --no-project --python 3.14 tools/ci/components.py ci-plan --base "$BASE_SHA" --head "$HEAD_SHA" --public "$PUBLIC")
          else
            plan=$(uv run --no-project --python 3.14 tools/ci/components.py ci-plan --components "${INPUT_COMPONENTS:-all}" --public "$PUBLIC")
          fi
          echo "$plan"
          echo "$plan" >> "$GITHUB_OUTPUT"
      # private_checks=false (fork pull request, or a dependency bot's run, which GitHub
      # gives no secrets): generic deny rules instead of the private list, sonar skipped,
      # with a notice on the run (tools/ci/pr_mode.py, D-DEPS-3).
      - id: plan
        name: Select the checks that need secrets
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
        run: |
          uv run --no-project --python 3.14 tools/ci/pr_mode.py --event "$EVENT" --repo "$REPO" \
            --head-repo "$HEAD_REPO" --author "$AUTHOR" --actor "$ACTOR" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  # The gates of `make gates` run in parallel jobs (docs/quality/gates.md, "CI jobs"); together
  # they run exactly the targets of `make gates` for the planned components
  # (tools/ci/tests/test_ci_parallel_gates.py). This one: code and repository structure.
  gates:
    name: gates
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # JDK and Android SDK for the JVM tests of the Android core that `make test` runs
      # (brief M5-01; docs/DECISIONS.md D-M5-01-5).
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make fmt-check codegen-check lint typecheck arch register-check migrations-lint flag-check commitlint runners-check labels-check release-pins
        env:
          COMPONENTS: ${{ needs.plan.outputs.components }}
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # A dependency bot's own commits need no sign-off in its pull request (D-DEPS-3).
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: make fmt-check codegen-check lint typecheck arch register-check migrations-lint flag-check commitlint runners-check labels-check release-pins COMPONENTS="$COMPONENTS"

  # Documentation, configuration reference, diagrams, API contract and client gates.
  gates-docs:
    name: gates (docs and contracts)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # JDK and Android SDK for the JVM tests of the Android core that `make test` runs
      # (brief M5-01; docs/DECISIONS.md D-M5-01-5).
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make docs config-doc-check linkcheck diagrams catalog-check api-lint api-checks api-breaking ops-check api-clients tokens
        env:
          MMDC_PUPPETEER_CONFIG: tools/node/puppeteer-ci.json
          COMPONENTS: ${{ needs.plan.outputs.components }}
        run: make docs config-doc-check linkcheck diagrams catalog-check api-lint api-checks api-breaking ops-check api-clients tokens COMPONENTS="$COMPONENTS"

  # Secret scan of the history, Semgrep, Trivy, OSV and the license gate.
  gates-security:
    name: gates (security and supply chain)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # JDK and Android SDK for the JVM tests of the Android core that `make test` runs
      # (brief M5-01; docs/DECISIONS.md D-M5-01-5).
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make gitleaks semgrep trivy osv licenses
        env:
          COMPONENTS: ${{ needs.plan.outputs.components }}
        run: make gitleaks semgrep trivy osv licenses COMPONENTS="$COMPONENTS"

  # The tests of the Python tools and their coverage: no component selected. On every change:
  # some also build component sources for other platforms (the release builds).
  test-tools:
    name: test (tools)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # JDK and Android SDK for the JVM tests of the Android core that `make test` runs
      # (brief M5-01; docs/DECISIONS.md D-M5-01-5).
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make test coverage
        env:
          # Chromium's sandbox can be blocked where user namespaces are restricted; the
          # renderer only processes this repository's own diagrams.
          MMDC_PUPPETEER_CONFIG: tools/node/puppeteer-ci.json
          COMPONENTS: none
        run: make test coverage COMPONENTS="$COMPONENTS"

  # Go tests against PostgreSQL and SeaweedFS (Docker on the runner) and the coverage threshold;
  # AREAS=none leaves the tools suite to test-tools.
  test-server:
    name: test (server)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' test-server ')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # JDK and Android SDK for the JVM tests of the Android core that `make test` runs
      # (brief M5-01; docs/DECISIONS.md D-M5-01-5).
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make test coverage
        env:
          # As every step that reaches `make test` (docs/quality/gates.md, "Individual gates").
          MMDC_PUPPETEER_CONFIG: tools/node/puppeteer-ci.json
          COMPONENTS: server
        run: make test coverage COMPONENTS="$COMPONENTS" AREAS=none
      # The coverage reports of `make test` in this job for the job sonar, which scans them
      # instead of running the tests again. REPORTS covers every report path of
      # sonar-project.properties (tools/ci/tests/test_sonar_coverage_handoff.py); a component
      # this job did not test wrote no report. The list file always exists, so the artifact is
      # never empty.
      - name: Pack the coverage reports for sonar
        env:
          REPORTS: >-
            services/*/coverage.out
            sdk/python/coverage.xml
            plugins/*/coverage.xml
            sdk/typescript/coverage/lcov.info
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
            packages/*/*/coverage/lcov.info
        run: |
          shopt -s nullglob
          dir="$RUNNER_TEMP/sonar-coverage"
          mkdir -p "$dir"
          # A job writes only the reports of its components: nullglob drops the globs without a
          # match, the test drops the literal paths that do not exist.
          files=()
          # shellcheck disable=SC2086 # REPORTS is a list of globs, expanded on purpose
          for f in $REPORTS; do
            if [ -e "$f" ]; then files+=("$f"); fi
          done
          printf '%s\n' "${files[@]}" > "$dir/reports.txt"
          tar -cf "$dir/coverage.tar" -T "$dir/reports.txt"
          echo "coverage reports for sonar: ${#files[@]}"
      - name: Upload the coverage reports for sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-server
          path: ${{ runner.temp }}/sonar-coverage/coverage.tar
          if-no-files-found: error
          retention-days: 1

  # Dart tests of the workspace, the JVM tests of the Android code and their coverage threshold.
  test-apps:
    name: test (apps)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' test-apps ')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # JDK and Android SDK for the JVM tests of the Android core that `make test` runs
      # (brief M5-01; docs/DECISIONS.md D-M5-01-5).
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make test coverage
        env:
          # As every step that reaches `make test` (docs/quality/gates.md, "Individual gates").
          MMDC_PUPPETEER_CONFIG: tools/node/puppeteer-ci.json
          COMPONENTS: apps
        run: make test coverage COMPONENTS="$COMPONENTS" AREAS=none
      # The coverage reports of `make test` in this job for the job sonar, which scans them
      # instead of running the tests again. REPORTS covers every report path of
      # sonar-project.properties (tools/ci/tests/test_sonar_coverage_handoff.py); a component
      # this job did not test wrote no report. The list file always exists, so the artifact is
      # never empty.
      - name: Pack the coverage reports for sonar
        env:
          REPORTS: >-
            services/*/coverage.out
            sdk/python/coverage.xml
            plugins/*/coverage.xml
            sdk/typescript/coverage/lcov.info
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
            packages/*/*/coverage/lcov.info
        run: |
          shopt -s nullglob
          dir="$RUNNER_TEMP/sonar-coverage"
          mkdir -p "$dir"
          # A job writes only the reports of its components: nullglob drops the globs without a
          # match, the test drops the literal paths that do not exist.
          files=()
          # shellcheck disable=SC2086 # REPORTS is a list of globs, expanded on purpose
          for f in $REPORTS; do
            if [ -e "$f" ]; then files+=("$f"); fi
          done
          printf '%s\n' "${files[@]}" > "$dir/reports.txt"
          tar -cf "$dir/coverage.tar" -T "$dir/reports.txt"
          echo "coverage reports for sonar: ${#files[@]}"
      - name: Upload the coverage reports for sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-apps
          path: ${{ runner.temp }}/sonar-coverage/coverage.tar
          if-no-files-found: error
          retention-days: 1

  # The SDK and plugin components of the plan; server and apps have their own jobs.
  test-sdk-plugins:
    name: test (SDKs and plugins)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' test-sdk-plugins ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # One Go for every tracked module: all modules share the go and toolchain lines
      # (tools/ci/tests/test_ci_toolchains.py, docs/DECISIONS.md D-M2-38-1).
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      # Flutter for every tracked Dart package, pinned in the root pubspec.yaml of the Dart
      # workspace (docs/DECISIONS.md D-M4-01-1).
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      # JDK and Android SDK for the JVM tests of the Android core that `make test` runs
      # (brief M5-01; docs/DECISIONS.md D-M5-01-5).
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - if: hashFiles('packages/*/android/gradlew') != ''
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Restore pinned binaries and hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            ~/.cache/pre-commit
          key: gates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bin/tools.lock.json', '.pre-commit-config.yaml') }}
      - run: make bootstrap-ci
      - name: make test coverage
        env:
          MMDC_PUPPETEER_CONFIG: tools/node/puppeteer-ci.json
          PLANNED: ${{ needs.plan.outputs.components }}
        run: |
          selected=""
          for c in $PLANNED; do
            case "$c" in
              all) selected="sdk-python sdk-typescript plugins" ;;
              sdk-python|sdk-typescript|plugins) selected="$selected $c" ;;
            esac
          done
          make test coverage COMPONENTS="${selected# }" AREAS=none
      # The coverage reports of `make test` in this job for the job sonar, which scans them
      # instead of running the tests again. REPORTS covers every report path of
      # sonar-project.properties (tools/ci/tests/test_sonar_coverage_handoff.py); a component
      # this job did not test wrote no report. The list file always exists, so the artifact is
      # never empty.
      - name: Pack the coverage reports for sonar
        env:
          REPORTS: >-
            services/*/coverage.out
            sdk/python/coverage.xml
            plugins/*/coverage.xml
            sdk/typescript/coverage/lcov.info
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
            packages/*/*/coverage/lcov.info
        run: |
          shopt -s nullglob
          dir="$RUNNER_TEMP/sonar-coverage"
          mkdir -p "$dir"
          # A job writes only the reports of its components: nullglob drops the globs without a
          # match, the test drops the literal paths that do not exist.
          files=()
          # shellcheck disable=SC2086 # REPORTS is a list of globs, expanded on purpose
          for f in $REPORTS; do
            if [ -e "$f" ]; then files+=("$f"); fi
          done
          printf '%s\n' "${files[@]}" > "$dir/reports.txt"
          tar -cf "$dir/coverage.tar" -T "$dir/reports.txt"
          echo "coverage reports for sonar: ${#files[@]}"
      - name: Upload the coverage reports for sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-sdk-plugins
          path: ${{ runner.temp }}/sonar-coverage/coverage.tar
          if-no-files-found: error
          retention-days: 1

  denylist:
    name: denylist (private list)
    needs: plan
    if: needs.plan.outputs.private_checks == 'true'
    environment: denylist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make denylist
        env:
          LIST: ${{ secrets.BOTHY_DENYLIST }}
          ALLOW: ${{ secrets.BOTHY_DENYLIST_ALLOW_AUTHORS }}
          BOTHY_DENYLIST_NAMES: ${{ github.head_ref }}
          DENYLIST_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
          # Untrusted text: only through the environment, never into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          umask 077
          dir=$(mktemp -d "$RUNNER_TEMP/denylist.XXXXXX")
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$LIST" > "$dir/denylist.txt"
          printf '%s\n' "$ALLOW" > "$dir/allow-authors.txt"
          export BOTHY_DENYLIST_FILE="$dir/denylist.txt"
          make denylist

  denylist-fork:
    name: denylist (generic rules, fork)
    needs: plan
    if: needs.plan.outputs.private_checks != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make denylist (generic rules only)
        env:
          BOTHY_DENYLIST_NAMES: ${{ github.head_ref }}
          DENYLIST_RANGE: ${{ format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make denylist DENYLIST_FLAGS=--allow-missing

  sonar:
    name: sonar
    # Scans the coverage reports of the test jobs instead of running the tests again. A test job
    # of a component the plan left out is skipped; a failed or cancelled one skips the scan,
    # which ci-ok already fails. On main only with the repository variable SONAR_MAIN_ANALYSIS:
    # until the main branch of the SonarQube Cloud project is named `main`, the server takes
    # `main` for a short-lived branch and fails its analysis (docs/quality/sonarqube-local.md).
    needs: [plan, test-server, test-apps, test-sdk-plugins]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.private_checks == 'true'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (github.ref != 'refs/heads/main' || vars.SONAR_MAIN_ANALYSIS == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/node/package-lock.json
      # Go and Flutter as the scan saw them when it followed `make test` in this job: the Go
      # toolchain on the PATH and the Dart workspace resolved (docs/DECISIONS.md D-M2-38-1,
      # D-M4-01-1). No JDK or Android SDK: those only served the JVM tests.
      - if: hashFiles('services/*/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ hashFiles('services/server/go.mod') != '' && 'services/server/go.mod' || 'services/host/go.mod' }}
          cache-dependency-path: services/*/go.sum
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - if: hashFiles('apps/*/pubspec.yaml', 'packages/*/pubspec.yaml') != ''
        run: flutter pub get --enforce-lockfile
      - run: make bootstrap-ci
      - name: Download the coverage reports of the test jobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-coverage-*
          path: ${{ runner.temp }}/sonar-coverage
      - name: Unpack the coverage reports
        run: |
          shopt -s nullglob
          # download-artifact puts a single matching artifact straight into the path and several
          # into one folder each.
          for archive in "$RUNNER_TEMP"/sonar-coverage/coverage.tar "$RUNNER_TEMP"/sonar-coverage/*/coverage.tar; do
            if [ -e "$archive" ]; then tar -xvf "$archive"; fi
          done
      - name: make sonar-scan
        env:
          COMPONENTS: ${{ needs.plan.outputs.components }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          # The analysis of main records the overall state and the new code baseline and must
          # not block main; a pull request waits for the gate, its blocking quality check.
          SONAR_QUALITYGATE_WAIT: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
        run: make sonar-scan COMPONENTS="$COMPONENTS" SONAR_HOST_URL="${SONAR_HOST_URL:-http://127.0.0.1:9000}" SONAR_ORGANIZATION="$SONAR_ORGANIZATION" SONAR_PROJECT_KEY="${SONAR_PROJECT_KEY:-bothy}" SONAR_QUALITYGATE_WAIT="$SONAR_QUALITYGATE_WAIT"

  # bothy-postgres built natively on each architecture and proven with its two-container test
  # (brief M7-01, 18 "Server images" rule 2): no QEMU, because no build step runs on the target
  # platform and each runner tests its own. Only when the change touches what the image is built
  # and tested from (tools/ci/components.py POSTGRES_IMAGE_PREFIXES) or a shared input. Two jobs
  # with fixed names instead of a matrix, so that tools/ci/ci_ok.py can require them by name
  # (a skipped matrix job has no expanded name).
  postgres-image-amd64:
    name: postgres-image (amd64)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' postgres-image-amd64 ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      # A docker-container builder writes the multi-platform OCI archive; it emulates nothing.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: make postgres-image postgres-image-test
        run: make postgres-image postgres-image-test

  postgres-image-arm64:
    name: postgres-image (arm64)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' postgres-image-arm64 ')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      # A docker-container builder writes the multi-platform OCI archive; it emulates nothing.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: make postgres-image postgres-image-test
        run: make postgres-image postgres-image-test

  # Platform tests of the apps (make apps-platform, docs/DECISIONS.md D-M4-01-7): native code
  # and desktop integration tests need macOS and Windows (ADR 0039), Android code an emulator
  # (apps-android-*, D-M5-01-5), the pure gates run on Linux. Only when the change touches a
  # member of the Dart workspace, its root manifest or lock file (tools/ci/components.py
  # PLATFORM_PREFIXES) or a shared input, Android only in the public phase; ci-ok
  # (tools/ci/ci_ok.py) accepts a skip only when the plan left the job out.
  apps-macos:
    name: apps (macOS)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' apps-macos ')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform
        shell: bash
        run: uv run --project tools --locked --quiet python tools/ci/apps_platform.py

  apps-windows:
    name: apps (Windows)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' apps-windows ')
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform
        shell: bash
        run: uv run --project tools --locked --quiet python tools/ci/apps_platform.py

  apps-android-26:
    name: apps (Android API 26)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' apps-android-26 ')
    # The instrumented tests of the Android code on an emulator (brief M5-01, Design note 5): the
    # minimum API level of 15 2 and the current stable one, x86_64 Google APIs images without
    # the Play Store. Emulators have no StrongBox, so that test reports a skip. One job per level
    # instead of a matrix, because ci-ok requires its jobs by name (D-M7-01-7).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable hardware acceleration (kvm)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform (Android)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: uv run --project tools --locked --quiet python tools/ci/apps_platform.py --system android

  apps-android-36:
    name: apps (Android API 36)
    needs: plan
    if: contains(format(' {0} ', needs.plan.outputs.jobs), ' apps-android-36 ')
    # The instrumented tests of the Android code on an emulator (brief M5-01, Design note 5): the
    # minimum API level of 15 2 and the current stable one, x86_64 Google APIs images without
    # the Play Store. Emulators have no StrongBox, so that test reports a skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable hardware acceleration (kvm)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: make apps-platform (Android)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: uv run --project tools --locked --quiet python tools/ci/apps_platform.py --system android

  ci-ok:
    name: ci-ok
    # The last job: it needs every other job and runs with always(), so it starts when they have
    # ended, holds no runner while they run, and reports on every run, also after a failed,
    # skipped or cancelled job. tools/ci/ci_ok.py checks the results against the plan: a needed
    # job must succeed, a job that ran must pass, a missing plan fails. It then completes the
    # pending check run that the plan job created (docs/quality/push-discipline.md).
    needs: [plan, gates, gates-docs, gates-security, test-tools, test-server, test-apps, test-sdk-plugins, denylist, denylist-fork, sonar, postgres-image-amd64, postgres-image-arm64, apps-macos, apps-windows, apps-android-26, apps-android-36]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write # complete the pending ci-ok check run of the plan job
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - id: check
        name: Every job the plan needs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CI_JOBS: ${{ needs.plan.outputs.jobs }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' \
            | { echo "| job | result |"; echo "|---|---|"; cat; } >> "$GITHUB_STEP_SUMMARY"
          uv run --no-project --python 3.14 tools/ci/ci_ok.py needs
      - name: Complete the pending ci-ok check run
        if: always() && needs.plan.outputs.marker != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MARKER: ${{ needs.plan.outputs.marker }}
          CONCLUSION: ${{ steps.check.outcome == 'success' && 'success' || 'failure' }}
        run: |
          case "$MARKER" in *[!0-9]*) echo "unexpected check run id: $MARKER"; exit 1 ;; esac
          gh api -X PATCH "repos/$REPO/check-runs/$MARKER" -f status=completed \
            -f conclusion="$CONCLUSION" -f "output[title]=ci-ok: $CONCLUSION" \
            -f 'output[summary]=The conclusion of the job ci-ok of this run.' --silent
