# SPDX-License-Identifier: Apache-2.0
#
# Platform suite of the host service (brief M2-42 design note 19, docs/DECISIONS.md D-M2-42-19).
# It creates and deletes operating system users, services and ACLs with administrator rights, so
# it runs only on throwaway GitHub-hosted runners: Linux with systemd, macOS and Windows 11 (Windows
# 10 has no hosted runner and stays unmeasured). Manual or scheduled; a required gate before
# M2-48. The result file of each platform is kept as an artifact.

name: host-platform

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: host-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform:
    name: platform suite (${{ matrix.os }})
    if: github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/host/go.mod
          cache: false
      # The unit tests as the normal runner user first, so a platform run also proves them on
      # each system (brief M2-45 "Platform runs"); Windows has no cgo for the race detector.
      - name: Unit tests (Linux and macOS, runner user)
        if: runner.os != 'Windows'
        shell: bash
        run: cd services/host && go test -race -count=1 ./...
      # The packages of the terminal sessions (M2-45) whose tests run on Windows; the tests of the
      # M2-42 packages and of internal/profiles simulate Unix paths and do not run on Windows yet.
      - name: Unit tests (Windows, runner user)
        if: runner.os == 'Windows'
        shell: bash
        run: cd services/host && go test -count=1 ./internal/session/... ./internal/pty/... ./internal/confirm/...
      # TestPlatform_TMT25 traces the file opens and local channels of the service user on Linux.
      - name: Install strace (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends strace
      # The test binary refuses to run without the marker of a disposable machine (brief M2-48
      # design note 11); a hosted runner is thrown away after the job.
      - name: Mark the runner as a disposable test machine (Linux and macOS)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        run: |
          printf 'termsuite - disposable test machine (GitHub-hosted runner)\n' | sudo tee /etc/termsuite-disposable >/dev/null
      - name: Mark the runner as a disposable test machine (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Set-Content -LiteralPath (Join-Path $env:ProgramData 'termsuite-disposable') -Value 'termsuite - disposable test machine (GitHub-hosted runner)'
      # The suite runs even when a unit test failed: both results are kept.
      - name: Platform suite (Linux and macOS, as root)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        # sudo resets PATH to secure_path; env hands the Go of setup-go to make.
        # The binaries go to a folder every user can traverse: the service user and the session users
        # run them, and the home of the runner user is closed to them.
        run: sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" BOTHY_PLATFORM_DISPOSABLE=1 PLATFORM_OUT=/opt/bothy-platform make -C services/host platform-test
      - name: Platform suite (Windows, elevated)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        env:
          BOTHY_PLATFORM_DISPOSABLE: "1"
        run: make -C services/host platform-test
      - name: Keep the result file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-platform-${{ matrix.os }}
          path: |
            services/host/.platform/result-*.json
            /opt/bothy-platform/result-*.json
          if-no-files-found: warn
