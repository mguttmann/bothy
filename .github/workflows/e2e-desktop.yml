# SPDX-License-Identifier: Apache-2.0
#
# Desktop E2E suite and performance level on the hosted runners (brief M4-34 Design note 6;
# docs/spec/15-client-architecture.md 20; docs/decisions.d/AUD-misc-testing-01.md). The suites
# run against the Compose stack of infra/compose/e2e.sh, which needs a Docker engine next to the
# app: GitHub-hosted macOS runners have none and Windows runners run only Windows containers, so
# the runs on a desktop are the local targets `make e2e-desktop` and `make perf-desktop` (before
# a release and at the close of M4). Two jobs, each with its own schedule:
#
#   build     every week: builds both suites on macOS and Windows, so they cannot rot; a compile
#             error fails it. The terminal suites of brief M4-38 (terminal_e2e_test.dart, and
#             terminal_perf_test.dart with the timing hooks of terminal_ui) are built the same
#             way.
#   headless  every night: runs the E2E suites themselves on a Linux runner, which has the Docker
#             engine, through `make e2e-desktop` with E2E_DEVICE=flutter-tester (no desktop
#             session, no performance level): the app against the real server of the Compose
#             stack, then its terminal part against the terminal's client stack with a host
#             container, which needs Go.
#
# A manual run runs both jobs. Not a check of pull requests; no secrets: the stacks generate
# their example keys per run.

name: e2e-desktop

on:
  workflow_dispatch:
  schedule:
    # Each job names the schedule of the other job in its condition
    # (tools/ci/tests/test_e2e_desktop_workflow.py).
    - cron: "41 4 * * 2" # build
    - cron: "41 3 * * *" # headless

permissions:
  contents: read

concurrency:
  group: e2e-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build the desktop E2E suites (${{ matrix.os }})
    if: (github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')) && github.event.schedule != '41 3 * * *'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Windows image has no yq, and flutter-action fetches it from Chocolatey when it reads
      # flutter-version-file; that feed fails often, so the pin is read here (test_ci_toolchains.py).
      - name: Flutter pin of the workspace
        id: flutter-pin
        shell: bash
        run: |
          version="$(sed -n -E 's/^  flutter: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' pubspec.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true
      - name: Analyze the suites and their drivers
        shell: bash
        working-directory: apps/client
        run: flutter analyze --fatal-infos e2e_test perf_test test_driver
      # The E2E suite in a debug build (flutter drive of tool/e2e_suite.sh), the performance level
      # in a profile build (make perf-desktop); the defines of the stack are runtime inputs.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: apps/client
        run: |
          flutter build macos --debug --target=e2e_test/desktop_e2e_test.dart
          flutter build macos --profile --target=perf_test/perf_test.dart
          flutter build macos --debug --target=e2e_test/terminal_e2e_test.dart
          flutter build macos --profile --target=perf_test/terminal_perf_test.dart --dart-define=TERMINAL_PERF_HOOKS=true
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/client
        run: |
          flutter build windows --debug --target=e2e_test/desktop_e2e_test.dart
          flutter build windows --profile --target=perf_test/perf_test.dart
          flutter build windows --debug --target=e2e_test/terminal_e2e_test.dart
          flutter build windows --profile --target=perf_test/terminal_perf_test.dart --dart-define=TERMINAL_PERF_HOOKS=true

  headless:
    name: desktop E2E suites, headless (Linux)
    if: (github.event.repository.visibility == 'public' || (github.event_name == 'schedule' && vars.BOTHY_VISIBILITY == 'public')) && github.event.schedule != '41 4 * * 2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      # The helper of the terminal's client stack (go test) and the binaries it builds for the
      # host container.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/*/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The release image the Compose stack starts from.
      - name: make image (host platform)
        run: make image IMAGE_PLATFORMS="linux/$(dpkg --print-architecture)"
      - name: make e2e-desktop (headless)
        env:
          E2E_DEVICE: flutter-tester
        run: make e2e-desktop
