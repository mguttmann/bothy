        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # The resolve job has no release environment. Its outputs may steer control flow
      # (`if:`), but no value from it reaches a shell or an action here: this job resolves
      # the tag again from the fixed component list and stops on any difference (T-SC-05,
      # rule release-untrusted-output in tools/ci/check_runners.py).
      - name: Resolve the tag again on this runner
        id: info
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project --python 3.14 tools/ci/components.py release --tag "$TAG" --github-output >> "$GITHUB_OUTPUT"
      - name: Stop if the resolve job reported something else
        if: >-
          steps.info.outputs.component != needs.resolve.outputs.component ||
          steps.info.outputs.version != needs.resolve.outputs.version ||
          steps.info.outputs.path != needs.resolve.outputs.path ||
          steps.info.outputs.gate_components != needs.resolve.outputs.gate_components ||
          steps.info.outputs.prerelease != needs.resolve.outputs.prerelease
        run: |
          echo "::error::the resolve job disagrees with this release job; release stopped"
          exit 1
      - name: Binaries and Linux packages of the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.dist_id }}
          path: dist
          merge-multiple: true
      - name: macOS packages of build-apple
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-apple.outputs.dist_id }}
          path: dist
          merge-multiple: true
      - name: Windows package of build-windows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-windows.outputs.dist_id }}
          path: dist
          merge-multiple: true
      # Every file the three jobs wrote, named once: the binaries and packages of the release.
      - name: Files of the release
        run: |
          find dist -maxdepth 1 -type f -name 'bothy-host_*' -print | sort > "$RUNNER_TEMP/files.txt"
          [ "$(wc -l < "$RUNNER_TEMP/files.txt")" -eq 12 ] || { echo "::error::expected 5 binaries and 7 packages, found:"; cat "$RUNNER_TEMP/files.txt"; exit 1; }
          sed 's/^/--binary /' "$RUNNER_TEMP/files.txt" | tr '\n' ' ' > "$RUNNER_TEMP/binary-args.txt"
      - name: SBOMs (SPDX and CycloneDX) of every binary and package
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          read -r -a files < "$RUNNER_TEMP/binary-args.txt"
          uv run --project tools --locked --quiet python tools/ci/release_chain.py sbom --dist dist \
            --version "$VERSION" "${files[@]}"
      - name: Sign with the key pair of the private phase (ADR 0062)
        if: github.event.repository.visibility != 'public'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          read -r -a files < "$RUNNER_TEMP/binary-args.txt"
          uv run --project tools --locked --quiet python tools/ci/release_chain.py sign --mode private \
            --dist dist --version "$VERSION" "${files[@]}"
      - name: Verify like an instance operator (private phase)
        if: github.event.repository.visibility != 'public'
        run: |
          uv run --project tools --locked --quiet python tools/ci/release_chain.py verify --mode private \
            --key quality/release/cosign-private-phase.pub --dist dist
      - name: Sign keyless with the workflow identity (public phase)
        if: github.event.repository.visibility == 'public'
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          read -r -a files < "$RUNNER_TEMP/binary-args.txt"
          uv run --project tools --locked --quiet python tools/ci/release_chain.py sign --mode public \
            --dist dist --version "$VERSION" "${files[@]}"
      - name: Verify like an instance operator (public phase)
        if: github.event.repository.visibility == 'public'
        run: |
          uv run --project tools --locked --quiet python tools/ci/release_chain.py verify --mode public \
            --identity-regexp "^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/tags/host/v" \
            --issuer https://token.actions.githubusercontent.com --dist dist
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-host
          path: dist
          if-no-files-found: error

  publish:
    name: publish
    needs: [resolve, build, supply-chain, product-signing, plugin-signing, host-signing, build-apple, build-windows]
    if: >-
      always() && needs.build.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.supply-chain.result) &&
      (needs.resolve.outputs.component != 'server' || needs.supply-chain.result == 'success') &&
      contains(fromJSON('["success","skipped"]'), needs.product-signing.result) &&
      (needs.resolve.outputs.component != 'bothy' || needs.product-signing.result == 'success') &&
      contains(fromJSON('["success","skipped"]'), needs.plugin-signing.result) &&
      (needs.resolve.outputs.component != 'grafana-bothy-live' || needs.plugin-signing.result == 'success') &&
      contains(fromJSON('["success","skipped"]'), needs.host-signing.result) &&
      (needs.resolve.outputs.component != 'host' || needs.host-signing.result == 'success') &&
      contains(fromJSON('["success","skipped"]'), needs.build-apple.result) &&
      contains(fromJSON('["success","skipped"]'), needs.build-windows.result)
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub release
      id-token: write # Sigstore certificate for the attestations
      attestations: write # store the attestations
      artifact-metadata: write # storage record required by actions/attest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # The resolve job has no release environment. Its outputs may steer control flow
      # (`if:`), but no value from it reaches a shell or an action here: this job resolves
      # the tag again from the fixed component list and stops on any difference (T-SC-05,
      # rule release-untrusted-output in tools/ci/check_runners.py).
      - name: Resolve the tag again on this runner
        id: info
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project --python 3.14 tools/ci/components.py release --tag "$TAG" --github-output >> "$GITHUB_OUTPUT"
      - name: Stop if the resolve job reported something else
        if: >-
          steps.info.outputs.component != needs.resolve.outputs.component ||
          steps.info.outputs.version != needs.resolve.outputs.version ||
          steps.info.outputs.path != needs.resolve.outputs.path ||
          steps.info.outputs.gate_components != needs.resolve.outputs.gate_components ||
          steps.info.outputs.prerelease != needs.resolve.outputs.prerelease
        run: |
          echo "::error::the resolve job disagrees with this release job; release stopped"
          exit 1
      # By id, not by name or pattern: every job of this run, also the ones without a release
      # environment, can upload an artifact named dist-something (release-artifact-by-id).
      # Server: the signed set of the supply-chain job (SBOMs, signature bundles, SHA256SUMS and
      # the ScanCode report are already in it).
      - name: Signed artifacts of the server
        if: steps.info.outputs.component == 'server'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.supply-chain.outputs.dist_id }}
          path: dist
          merge-multiple: true
      # Product: the signed set of the product-signing job, by id.
      - name: Signed artifacts of the product
        if: steps.info.outputs.component == 'bothy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.product-signing.outputs.dist_id }}
          path: dist
          merge-multiple: true
      # Grafana panel plugin: the signed set of the plugin-signing job, by id.
      - name: Signed artifacts of the plugin
        if: steps.info.outputs.component == 'grafana-bothy-live'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plugin-signing.outputs.dist_id }}
          path: dist
          merge-multiple: true
      # Host service: the signed set of the host-signing job (all binaries and packages), by id.
      - name: Signed artifacts of the host
        if: steps.info.outputs.component == 'host'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.host-signing.outputs.dist_id }}
          path: dist
          merge-multiple: true
      - name: Artifacts of the Linux build
        if: steps.info.outputs.component != 'server' && steps.info.outputs.component != 'bothy' && steps.info.outputs.component != 'grafana-bothy-live' && steps.info.outputs.component != 'host' && needs.build.outputs.dist_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.dist_id }}
          path: dist
          merge-multiple: true
      - name: Artifacts of the Apple build
        if: steps.info.outputs.component != 'host' && needs.build-apple.outputs.dist_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-apple.outputs.dist_id }}
          path: dist
          merge-multiple: true
      - name: Artifacts of the Windows build
        if: steps.info.outputs.component != 'host' && needs.build-windows.outputs.dist_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-windows.outputs.dist_id }}
          path: dist
          merge-multiple: true
      - name: SBOM of all release artifacts
        if: steps.info.outputs.component != 'server' && steps.info.outputs.component != 'bothy' && steps.info.outputs.component != 'grafana-bothy-live' && steps.info.outputs.component != 'host'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        if: steps.info.outputs.component != 'server' && steps.info.outputs.component != 'bothy' && steps.info.outputs.component != 'grafana-bothy-live' && steps.info.outputs.component != 'host'
        run: |
          mv sbom.spdx.json dist/
          (cd dist && find . -type f -print0 | sort -z | xargs -0 shasum -a 256 > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
      - name: Build provenance (public phase only)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: SBOM attestation (public phase only)
        if: github.event.repository.visibility == 'public' && steps.info.outputs.component != 'server' && steps.info.outputs.component != 'bothy' && steps.info.outputs.component != 'grafana-bothy-live' && steps.info.outputs.component != 'host'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          sbom-path: dist/sbom.spdx.json
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMPONENT_PATH: ${{ steps.info.outputs.path }}
          VERSION: ${{ steps.info.outputs.version }}
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' \
            "$COMPONENT_PATH/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          flags=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md")
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* "${flags[@]}"

  # Portability test of a product release (docs/spec/16-operations.md, 11.1): only after
  # publish, because install.sh and the bundle exist under the tag only from then on; only
  # for the product component (tag vX.Y.Z), the only one with an install.sh. The tag comes from
  # github.ref_name, not from the resolve job; its output only steers the condition.
  portability:
    name: portability
    needs: [resolve, publish]
    if: always() && needs.publish.result == 'success' && needs.resolve.outputs.component == 'bothy'
    uses: ./.github/workflows/portability.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # check out the tag
    with:
      tag: ${{ github.ref_name }}
