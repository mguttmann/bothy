          uv run --project tools --locked --quiet python tools/distribution/windows.py release --version "$VERSION" --out "$GITHUB_WORKSPACE/dist" --distribution "$RUNNER_TEMP/distribution.yaml" --branding "$RUNNER_TEMP/branding.yaml"
