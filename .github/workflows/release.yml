  build-apple:
    name: build (macOS and iOS apps, macOS host packages)
    needs: [resolve, gates]
    if: needs.resolve.outputs.component == 'client' || needs.resolve.outputs.component == 'host'
    environment: release-apple
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      dist_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.resolve.outputs.component == 'client'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: apps/client/pubspec.yaml
      - if: needs.resolve.outputs.component == 'host'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/host/go.mod
          cache: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # The resolve job has no release environment. Its outputs may steer control flow
      # (`if:`), but no value from it reaches a shell or an action here: this job resolves
      # the tag again from the fixed component list and stops on any difference (T-SC-05,
      # rule release-untrusted-output in tools/ci/check_runners.py).
      - name: Resolve the tag again on this runner
        id: info
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project --python 3.14 tools/ci/components.py release --tag "$TAG" --github-output >> "$GITHUB_OUTPUT"
      - name: Stop if the resolve job reported something else
        if: >-
          steps.info.outputs.component != needs.resolve.outputs.component ||
          steps.info.outputs.version != needs.resolve.outputs.version ||
          steps.info.outputs.path != needs.resolve.outputs.path ||
          steps.info.outputs.gate_components != needs.resolve.outputs.gate_components ||
          steps.info.outputs.prerelease != needs.resolve.outputs.prerelease
        run: |
          echo "::error::the resolve job disagrees with this release job; release stopped"
          exit 1
      # The publisher values (apps/distribution/distribution.yaml of the organization) are the
      # environment variable DISTRIBUTION_YAML; the signing material are its secrets
      # (docs/operations/release.md 4). Without them the step stops before anything is signed
      # (tools/distribution/apple.py).
      - name: Build, sign and notarize (apps/client/Makefile, target release-apple)
        if: steps.info.outputs.component == 'client'
        env:
          VERSION: ${{ steps.info.outputs.version }}
          DISTRIBUTION_YAML: ${{ vars.DISTRIBUTION_YAML }}
          BRANDING_YAML: ${{ vars.BRANDING_YAML }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_EXTENSION_PROVISIONING_PROFILE: ${{ secrets.APPLE_EXTENSION_PROVISIONING_PROFILE }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [ -n "$DISTRIBUTION_YAML" ] || { echo "::error::the environment release-apple has no variable DISTRIBUTION_YAML (apps/distribution/README.md); nothing was signed"; exit 1; }
          [ -n "$BRANDING_YAML" ] || { echo "::error::the environment release-apple has no variable BRANDING_YAML (the build branding, apps/client/README.md); nothing was signed"; exit 1; }
          printf '%s\n' "$DISTRIBUTION_YAML" > "$RUNNER_TEMP/distribution.yaml"
          printf '%s\n' "$BRANDING_YAML" > "$RUNNER_TEMP/branding.yaml"
          make -C apps/client release-apple VERSION="$VERSION" OUT="$GITHUB_WORKSPACE/dist" DISTRIBUTION_FILE="$RUNNER_TEMP/distribution.yaml" BRANDING_FILE="$RUNNER_TEMP/branding.yaml"
      # The host packages (brief M7-23): the binaries of the package kind pkg signed with the
      # Developer ID Application identity and the hardened runtime, one .pkg per architecture
      # signed with the Developer ID Installer identity, notarized, stapled and accepted by spctl
      # (tools/distribution/hostdist.py); without the secrets it stops before anything is signed.
      - name: Build, sign and notarize the host packages (services/host/Makefile, target release-apple)
        if: steps.info.outputs.component == 'host'
        env:
          VERSION: ${{ steps.info.outputs.version }}
          DISTRIBUTION_YAML: ${{ vars.DISTRIBUTION_YAML }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}
          APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          [ -n "$DISTRIBUTION_YAML" ] || { echo "::error::the environment release-apple has no variable DISTRIBUTION_YAML (apps/distribution/README.md); nothing was signed"; exit 1; }
          printf '%s\n' "$DISTRIBUTION_YAML" > "$RUNNER_TEMP/distribution.yaml"
          make -C services/host release-apple VERSION="$VERSION" OUT="$GITHUB_WORKSPACE/dist" DISTRIBUTION_FILE="$RUNNER_TEMP/distribution.yaml"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-apple
          path: dist
          if-no-files-found: error

