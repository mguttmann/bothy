# SPDX-License-Identifier: Apache-2.0
#
# Post-merge deny-list scan of main with the private list (requirement 22, ADR 0042).
# Pull requests from forks only see the generic rules, and a squash merge can change the
# commit message after the pull request checks ran. This workflow scans exactly what
# reached main: the pushed commits (before..after) with the private list from the
# protected environment "denylist". A finding fails the run; the owner then follows
# docs/quality/push-discipline.md, section "Deny-list hit on `main`".
#
# A manual run (workflow_dispatch) scans what a push run scans: the tree of main, plus the
# commits of the optional input `range`, never the whole history (tools/denylist/main_range.py).
# A failed run on main opens or updates an issue with the label `denylist-main` (job `alert`,
# tools/denylist/main_alert.py): run link, finding counts and locations only, never a term.
#
# Runs only for pushes to main and manual runs (tools/ci/check_runners.py, POST_MERGE_WORKFLOWS). The code
# that runs is the merged, reviewed commit, on a GitHub-hosted runner like every job (ADR 0039).

name: denylist-main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      range:
        description: "Commits to scan besides the tree of main, as BASE..TIP with two commit ids (empty: no commits)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: denylist-main
  cancel-in-progress: false

jobs:
  denylist:
    name: denylist (private list, main)
    environment: denylist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
          enable-cache: false
      - name: make denylist (pushed commits)
        env:
          LIST: ${{ secrets.BOTHY_DENYLIST }}
          ALLOW: ${{ secrets.BOTHY_DENYLIST_ALLOW_AUTHORS }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_RANGE: ${{ inputs.range }}
          BOTHY_DENYLIST_SUMMARY: ${{ runner.temp }}/denylist-summary.json
        run: |
          umask 077
          dir=$(mktemp -d "$RUNNER_TEMP/denylist.XXXXXX")
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$LIST" > "$dir/denylist.txt"
          printf '%s\n' "$ALLOW" > "$dir/allow-authors.txt"
          export BOTHY_DENYLIST_FILE="$dir/denylist.txt"
          # A push scans before..after (all reachable commits without a usable "before");
          # a manual run scans the tree and only the commits of the input range.
          DENYLIST_RANGE=$(python3 tools/denylist/main_range.py)
          export DENYLIST_RANGE
          make denylist
      - name: Summary for the issue
        id: summary
        if: failure()
        env:
          SUMMARY_FILE: ${{ runner.temp }}/denylist-summary.json
        run: python3 tools/denylist/main_alert.py output "$SUMMARY_FILE" >> "$GITHUB_OUTPUT"

  alert:
    name: alert (issue on a red run)
    needs: denylist
    # Only a failed scan of main; the token may write issues in this job only.
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ needs.denylist.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: python3 tools/denylist/main_alert.py issue
