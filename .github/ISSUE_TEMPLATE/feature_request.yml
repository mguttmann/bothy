name: Feature request
description: Propose a new capability or a change of behaviour.
labels: ["type: feature", "status: triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Please check docs/roadmap.md and the "never" list in docs/spec/01-produkt.md first.
        Larger changes start as a discussion in the issue and end with an ADR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which problem do you have today? Who has it, and how often?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Include effects on permissions and privacy if any.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself (see CONTRIBUTING.md)
