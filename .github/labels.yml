# SPDX-License-Identifier: Apache-2.0
#
# Issue and pull request labels. Source of truth; `make labels-sync` applies it with gh,
# `make labels-check` validates it and the labels used by the issue templates and
# GOVERNANCE.md. Triage rules: GOVERNANCE.md.

- name: "type: bug"
  color: "d73a4a"
  description: "Something does not work as specified"
- name: "type: feature"
  color: "1d76db"
  description: "New capability or a change of behaviour"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: security"
  color: "b60205"
  description: "Security hardening that is not a vulnerability report"
- name: "type: chore"
  color: "c5def5"
  description: "Maintenance without user-visible change"

- name: "area: server"
  color: "5319e7"
  description: "Go server, API, sync, authorization"
- name: "area: apps"
  color: "5319e7"
  description: "Flutter apps, console, design system"
- name: "area: agents"
  color: "5319e7"
  description: "Agent platform, adapters, SDKs, extensions"
- name: "area: ops"
  color: "5319e7"
  description: "Deployment, observability, release"
- name: "area: repo"
  color: "5319e7"
  description: "Quality gates, CI, repository tooling"

- name: "status: triage"
  color: "fbca04"
  description: "New; a maintainer has not looked at it yet"
- name: "status: needs-info"
  color: "fef2c0"
  description: "Waiting for the reporter"
- name: "status: accepted"
  color: "0e8a16"
  description: "Confirmed and wanted; open for work"
- name: "status: blocked"
  color: "e99695"
  description: "Waiting for another issue or decision"
- name: "status: declined"
  color: "ededed"
  description: "Will not be done; the reason is in the issue"
- name: "status: duplicate"
  color: "ededed"
  description: "Same as another issue"

- name: "priority: high"
  color: "b60205"
  description: "Breaks core use or data; next in line"
- name: "priority: medium"
  color: "d93f0b"
  description: "Important, planned for a coming milestone"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"

- name: "good first issue"
  color: "7057ff"
  description: "Small, well described, good for new contributors"
- name: "help wanted"
  color: "008672"
  description: "Maintainers welcome a contribution"
- name: "breaking change"
  color: "b60205"
  description: "Changes a public contract (API, SDK, configuration)"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (Renovate)"
