# WebSocket gateway of the chat server, AsyncAPI 3.0. Normative (ADR 0013).
# Protocol: docs/spec/04-sync-protocol.md. Body schemas: openapi.yaml (components.schemas).
# Lint: npx -y @redocly/cli@2.62.1 lint --config docs/api/redocly.yaml

asyncapi: 3.0.0

info:
  title: Chat Server Gateway
  version: 0.1.0
  x-protocol-versions: [1]
  description: |-
    WebSocket gateway for people, agents and apps. Frames are JSON text frames `{"op": <name>, "d":
    <body>}`. Authentication happens in-band with `identify` or `resume` (DPoP proof with the nonce
    from `hello`), not in the upgrade request. Protocol rules: docs/spec/04-sync-protocol.md. Body
    schemas are shared with openapi.yaml.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json

servers:
  instance:
    host: '{host}'
    pathname: /api/v1
    protocol: wss
    description: The instance origin.
    variables:
      host:
        default: chat.example.com
        description: Host of the instance.

channels:
  gateway:
    address: /gateway
    title: Gateway
    description: One connection per device (a newer one closes the older with `4017`) or agent consumer (`4015`). Close codes are listed in `x-close-codes`. A failing op answers `error` with a problem code and keeps the connection.
