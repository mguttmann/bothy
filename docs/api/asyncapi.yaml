    - $ref: '#/channels/gateway/messages/event.channel.updated'
    - $ref: '#/channels/gateway/messages/event.channel.settings_changed'
    - $ref: '#/channels/gateway/messages/event.channel.archived'
    - $ref: '#/channels/gateway/messages/event.command.changed'
    - $ref: '#/channels/gateway/messages/event.file.updated'
    - $ref: '#/channels/gateway/messages/event.user.updated'
    - $ref: '#/channels/gateway/messages/event.agent.updated'
    - $ref: '#/channels/gateway/messages/event.instance.updated'
    - $ref: '#/channels/gateway/messages/event.status.updated'
    - $ref: '#/channels/gateway/messages/event.grant.changed'
    - $ref: '#/channels/gateway/messages/event.group.changed'
    - $ref: '#/channels/gateway/messages/event.access.changed'
    - $ref: '#/channels/gateway/messages/event.access.expiring'
    - $ref: '#/channels/gateway/messages/event.session.revoked'
    - $ref: '#/channels/gateway/messages/event.read_state.updated'
    - $ref: '#/channels/gateway/messages/event.draft.updated'
    - $ref: '#/channels/gateway/messages/event.draft.deleted'
    - $ref: '#/channels/gateway/messages/event.settings.updated'
    - $ref: '#/channels/gateway/messages/event.sidebar.updated'
    - $ref: '#/channels/gateway/messages/event.notification_pref.updated'
    - $ref: '#/channels/gateway/messages/event.quiet_hours.updated'
    - $ref: '#/channels/gateway/messages/event.gdpr.request_updated'
    - $ref: '#/channels/gateway/messages/event.import.progress'
    - $ref: '#/channels/gateway/messages/event.agent.invocation'
    - $ref: '#/channels/gateway/messages/event.agent.followup'
    - $ref: '#/channels/gateway/messages/event.run.cancel_requested'
    - $ref: '#/channels/gateway/messages/event.interaction.created'
    - $ref: '#/channels/gateway/messages/event.command.invoked'
    - $ref: '#/channels/gateway/messages/event.agent.config_changed'
    - $ref: '#/channels/gateway/messages/event.typing.started'
    - $ref: '#/channels/gateway/messages/event.run.updated'
    - $ref: '#/channels/gateway/messages/event.agent.presence_changed'
    - $ref: '#/channels/gateway/messages/event.command.autocomplete_requested'
    - $ref: '#/channels/gateway/messages/event.notification.created'
    - $ref: '#/channels/gateway/messages/event.host.updated'
    - $ref: '#/channels/gateway/messages/event.terminal_session.changed'
    - $ref: '#/channels/gateway/messages/event.host.presence_changed'
    - $ref: '#/channels/gateway/messages/event.stats.live'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect

  terminal.send.hello:
    action: send
    channel:
      $ref: '#/channels/terminalStream'
    summary: First frame with the DPoP nonce.
    messages:
    - $ref: '#/channels/terminalStream/messages/terminal.hello'
    x-authz-action: terminal.stream
    x-rate-limit-class: rl.terminal
  terminal.receive.identify:
    action: receive
    channel:
      $ref: '#/channels/terminalStream'
    summary: Authenticate the device; only the device of the current session token passes.
    messages:
    - $ref: '#/channels/terminalStream/messages/terminal.identify'
    x-authz-action: terminal.stream
    x-rate-limit-class: rl.terminal
  terminal.send.error:
    action: send
    channel:
      $ref: '#/channels/terminalStream'
    summary: Error before the handshake; a close code follows.
    messages:
    - $ref: '#/channels/terminalStream/messages/terminal.error'
    x-authz-action: terminal.stream
    x-rate-limit-class: rl.terminal
  terminal.receive.frame:
    action: receive
    channel:
      $ref: '#/channels/terminalStream'
    summary: Noise message from the device, forwarded to the host.
    messages:
    - $ref: '#/channels/terminalStream/messages/noise.frame'
    x-authz-action: terminal.stream
    x-rate-limit-class: rl.terminal
  terminal.send.frame:
    action: send
    channel:
      $ref: '#/channels/terminalStream'
    summary: Noise message from the host, forwarded to the device.
    messages:
    - $ref: '#/channels/terminalStream/messages/noise.frame'
    x-authz-action: terminal.stream
    x-rate-limit-class: rl.terminal
  hostControl.send.hello:
    action: send
    channel:
      $ref: '#/channels/hostControl'
    summary: First frame with challenge and JWKS.
    messages:
    - $ref: '#/channels/hostControl/messages/host.hello'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostControl.receive.identify:
    action: receive
    channel:
      $ref: '#/channels/hostControl'
    summary: Login of the host service.
    messages:
    - $ref: '#/channels/hostControl/messages/host.identify'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
    reply:
      channel:
        $ref: '#/channels/hostControl'
      messages:
      - $ref: '#/channels/hostControl/messages/host.ready'
  hostControl.send.ready:
    action: send
    channel:
      $ref: '#/channels/hostControl'
    summary: Control connection accepted.
    messages:
    - $ref: '#/channels/hostControl/messages/host.ready'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostControl.receive.heartbeat:
    action: receive
    channel:
      $ref: '#/channels/hostControl'
    summary: Liveness; missing `terminal.host_heartbeat_miss_limit` heartbeats close with `4009`.
    messages:
    - $ref: '#/channels/hostControl/messages/host.heartbeat'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
    reply:
      channel:
        $ref: '#/channels/hostControl'
      messages:
      - $ref: '#/channels/hostControl/messages/host.heartbeat_ack'
  hostControl.send.heartbeat_ack:
    action: send
    channel:
      $ref: '#/channels/hostControl'
    summary: Answer to `heartbeat`.
    messages:
    - $ref: '#/channels/hostControl/messages/host.heartbeat_ack'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostControl.receive.report:
    action: receive
    channel:
      $ref: '#/channels/hostControl'
    summary: Profiles, session users and self-checks; a change of the server-host flag, a check result or the reported session users is audited.
    messages:
    - $ref: '#/channels/hostControl/messages/host.report'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostControl.send.session.open:
    action: send
    channel:
      $ref: '#/channels/hostControl'
    summary: Ask for the data connection of a session.
    messages:
    - $ref: '#/channels/hostControl/messages/host.session.open'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostControl.send.session.close:
    action: send
    channel:
      $ref: '#/channels/hostControl'
    summary: End the PTY of a session (revocation, owner, limits).
    messages:
    - $ref: '#/channels/hostControl/messages/host.session.close'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostControl.receive.session.started:
    action: receive
    channel:
      $ref: '#/channels/hostControl'
    summary: The PTY runs.
    messages:
    - $ref: '#/channels/hostControl/messages/host.session.started'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostControl.receive.session.ended:
    action: receive
    channel:
      $ref: '#/channels/hostControl'
    summary: A session ended on the host.
    messages:
    - $ref: '#/channels/hostControl/messages/host.session.ended'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostControl.send.error:
    action: send
    channel:
      $ref: '#/channels/hostControl'
    summary: Error for one op.
    messages:
    - $ref: '#/channels/hostControl/messages/host.error'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostData.send.hello:
    action: send
    channel:
      $ref: '#/channels/hostData'
    summary: First frame with challenge.
    messages:
    - $ref: '#/channels/hostData/messages/host.hello'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostData.receive.identify:
    action: receive
    channel:
      $ref: '#/channels/hostData'
    summary: Login with `session_id`; the session must belong to this host and not be closed.
    messages:
    - $ref: '#/channels/hostData/messages/host.identify'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostData.send.error:
    action: send
    channel:
      $ref: '#/channels/hostData'
    summary: Error before the first Noise frame.
    messages:
    - $ref: '#/channels/hostData/messages/host.error'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostData.receive.frame:
    action: receive
    channel:
      $ref: '#/channels/hostData'
    summary: Noise message from the host, forwarded to the device.
    messages:
    - $ref: '#/channels/hostData/messages/noise.frame'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host
  hostData.send.frame:
    action: send
    channel:
      $ref: '#/channels/hostData'
    summary: Noise message from the device, forwarded to the host.
    messages:
    - $ref: '#/channels/hostData/messages/noise.frame'
    x-authz-action: host.connect
    x-rate-limit-class: rl.host

components:
  messages:
    op.identify:
      name: identify
      title: identify
      summary: Authenticate a new gateway session.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [identify]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayIdentify
    op.resume:
      name: resume
      title: resume
      summary: Resume a gateway session after a short disconnect.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [resume]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayResume
    op.heartbeat:
      name: heartbeat
      title: heartbeat
      summary: Liveness signal with the last processed `seq`. Agents add their state; then `agent.heartbeat` is checked as well.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [heartbeat]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayHeartbeat
    op.reauth:
      name: reauth
      title: reauth
      summary: Hand over a new access token during the connection.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [reauth]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayReauth
    op.focus:
      name: focus
      title: focus
      summary: Set the threads currently on screen (live-box patches, typing). Unreadable threads are ignored silently.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [focus]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayFocus
    op.typing.start:
      name: typing.start
      title: typing.start
      summary: The person types in a thread. People only.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [typing.start]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayTyping
    op.typing.stop:
      name: typing.stop
      title: typing.stop
      summary: The person stopped typing. No event is sent; the op only resets the throttle of the connection.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [typing.stop]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayTyping
    op.ack:
      name: ack
      title: ack
      summary: 'Agents only: acknowledge all events up to `seq`.'
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [ack]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayAck
    op.run.update:
      name: run.update
      title: run.update
      summary: 'Agents only: live-box patch of an own run, same as `PATCH /runs/{run_id}`.'
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [run.update]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayRunUpdate
    op.stats.subscribe:
      name: stats.subscribe
      title: stats.subscribe
      summary: Subscribe to `stats.live` for the instance or one space. Needs `stats.read`; a denial answers `error` and keeps the connection.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [stats.subscribe]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayStatsSubscribe
    op.stats.unsubscribe:
      name: stats.unsubscribe
      title: stats.unsubscribe
      summary: End the `stats.live` subscription of the connection.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [stats.unsubscribe]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayStatsUnsubscribe
    op.command.autocomplete_result:
      name: command.autocomplete_result
      title: command.autocomplete_result
      summary: 'Agents and apps: suggestions for an autocomplete request (04, 15.7).'
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [command.autocomplete_result]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayAutocompleteResult
    op.hello:
      name: hello
      title: hello
      summary: First frame after the upgrade.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [hello]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayHello
    op.ready:
      name: ready
      title: ready
      summary: Session ready, with snapshot. Catch-up follows when a cursor was sent.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [ready]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayReady
    op.resumed:
      name: resumed
      title: resumed
      summary: Resume accepted; catch-up from the cursor follows.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [resumed]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayResumed
    op.cursor:
      name: cursor
      title: cursor
      summary: Advance the cursor without an event (skipped invisible events).
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [cursor]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayCursor
    op.catchup.complete:
      name: catchup.complete
      title: catchup.complete
      summary: Catch-up finished; the connection is live.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [catchup.complete]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayCatchupComplete
    op.resync_required:
      name: resync_required
      title: resync_required
      summary: Catch-up impossible; load `GET /sync/snapshot`. The connection stays open and is live from `head_seq`.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [resync_required]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayResyncRequired
    op.heartbeat_ack:
      name: heartbeat_ack
      title: heartbeat_ack
      summary: Answer to `heartbeat`.
      payload:
        type: object
        required: [op, d]
        properties:
          op:
            type: string
            enum: [heartbeat_ack]
          d:
            $ref: ./openapi.yaml#/components/schemas/GatewayHeartbeatAck
    op.reauth_required:
      name: reauth_required
