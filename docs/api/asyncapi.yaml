    - $ref: '#/channels/gateway/messages/event.reaction.removed'
    - $ref: '#/channels/gateway/messages/event.pin.added'
    - $ref: '#/channels/gateway/messages/event.pin.removed'
    - $ref: '#/channels/gateway/messages/event.thread.created'
    - $ref: '#/channels/gateway/messages/event.thread.updated'
    - $ref: '#/channels/gateway/messages/event.thread.closed'
    - $ref: '#/channels/gateway/messages/event.thread.reopened'
    - $ref: '#/channels/gateway/messages/event.thread.moved'
    - $ref: '#/channels/gateway/messages/event.thread.moved_out'
