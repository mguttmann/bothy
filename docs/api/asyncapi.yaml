      event.host.presence_changed:
        $ref: '#/components/messages/event.host.presence_changed'
      event.stats.live:
        $ref: '#/components/messages/event.stats.live'
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
    x-close-codes:
    - code: 1000
      name: normal
      client_action: do not reconnect unless the app is in the foreground
    - code: 1001
      name: going_away
      client_action: reconnect with backoff, try `resume`
    - code: 4000
      name: unknown_error
      client_action: reconnect with backoff
    - code: 4001
      name: unknown_op
      client_action: report the error, reconnect
    - code: 4002
      name: decode_error
      client_action: report the error, reconnect
    - code: 4003
      name: not_identified
      client_action: an op was sent before `identify`; reconnect
    - code: 4004
      name: authentication_failed
      client_action: renew the token; if that fails, log out
    - code: 4005
      name: already_identified
      client_action: report the error, reconnect
    - code: 4006
      name: session_invalid
      client_action: '`identify` instead of `resume`'
    - code: 4007
      name: protocol_version_unsupported
      client_action: show the app update note, do not reconnect
    - code: 4008
      name: rate_limited
      client_action: 'only `rl.gateway_connect` at `identify` and `resume`: wait for the time given in the close reason'
    - code: 4009
      name: heartbeat_timeout
      client_action: reconnect with backoff, try `resume`
    - code: 4011
      name: token_expired
      client_action: renew the token, then `resume`
    - code: 4012
      name: revoked
      client_action: 'session, device or principal revoked: delete local data, log out, do not reconnect'
    - code: 4013
      name: server_restart
      client_action: reconnect at once with a random delay, try `resume`
    - code: 4014
      name: slow_consumer
      client_action: 'outbound queue full or write deadline `gateway.write_timeout` missed: reconnect, catch up from the cursor'
    - code: 4015
      name: consumer_replaced
      client_action: 'agents only: another process took over the same consumer; do not reconnect'
    - code: 4016
      name: device_pending
      client_action: 'device pending approval: do not reconnect until `GET /api/v1/devices/{id}` reports state `active`'
    - code: 4017
      name: device_replaced
      client_action: 'a newer connection of the same device is active: do not reconnect on your own, only when the app returns to the foreground or on user action'
    - code: 4018
      name: forbidden
      client_action: 'credentials are valid, but `gateway.connect` is denied (for example `scope_missing` of an app): show the error, do not renew the token, do not reconnect on your own'

  terminalStream:
    address: /terminal/sessions/{session_id}/stream
    title: Terminal stream of a device
    description: 'End-to-end encrypted terminal stream (Noise_NK_25519_ChaChaPoly_SHA256, docs/spec/24-terminal.md section 5). After `hello` and `identify` only binary frames, each one Noise message; the first is handshake message 1 with the session token. Not part of the gateway; nothing of it enters the event log.'
    x-protocol-versions: [1]
    parameters:
      session_id:
        description: Terminal session ID (UUIDv7). The proxy routes both stream paths of a session by this segment to the same node (docs/spec/16-operations.md, section 4.4).
    messages:
      terminal.hello:
        $ref: '#/components/messages/terminal.hello'
      terminal.identify:
        $ref: '#/components/messages/terminal.identify'
      terminal.error:
        $ref: '#/components/messages/terminal.error'
      noise.frame:
        $ref: '#/components/messages/noise.frame'
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
    x-close-codes:
    - code: 1000
      name: normal
      client_action: session ended normally; do not reconnect
    - code: 1001
      name: going_away
      client_action: the node shuts down; attach again with `terminal.attach` within `terminal.detach_grace`
    - code: 4002
      name: decode_error
      client_action: text frame after `identify`, invalid JSON or frame over the Noise limit; report the error
    - code: 4004
      name: authentication_failed
      client_action: renew the token; if that fails, log out
    - code: 4008
      name: rate_limited
      client_action: wait for the time given in the close reason
    - code: 4012
      name: revoked
      client_action: session, device or person revoked; delete local data, log out
    - code: 4013
      name: server_restart
      client_action: attach again with `terminal.attach` within `terminal.detach_grace`
    - code: 4014
      name: slow_consumer
      client_action: relay buffer full; attach again
    - code: 4100
      name: terminal_closed
      client_action: 'the session ended; the close reason holds `close_reason`; do not reconnect'
    - code: 4101
      name: terminal_token_stale
      client_action: 'session token expired (`token_expired`) or already used (`token_replayed`); open or attach again with a fresh step-up'
    - code: 4102
      name: terminal_host_unavailable
      client_action: the other side is missing (host offline or no counterpart on this node); the session is `detached`; attach again later
    - code: 4103
      name: terminal_replaced
      client_action: another device attached; do not reconnect on your own
    - code: 4104
      name: terminal_handshake_failed
      client_action: 'Noise handshake or prologue failed, token signature or binding (`kid`, `typ`, `aud`, `sid`, `cek`) invalid, profile unknown or working directory (`wdi`) not one of the session user, server host without owner, session user (`osu`) unknown or bound to another person, or unknown frame; show a hard warning, do not reconnect'
  hostControl:
    address: /hosts/connect
    title: Control connection of a host service
    description: 'Outgoing connection of `bothy-host`, one per host. A second connection with the same keys makes the server probe the older one: if the older does not answer it is closed with `4009`; if it answers, both are closed with `4112` and the host is disabled (24, 3.4). Login with the Ed25519 key registered at pairing; `identify` lists the sessions the host service still knows (`live_sessions`), and the server ends every other session of the host in `active` or `detached` with `host_restarted` (24, 6.2). After `ready` the host service sends `report` (profiles, session users, self-checks) before it accepts any `session.open`, and the server sends `session.open` only after that `report` (24, 2.2). When `doctor` refused the start, the host service sends that `report` and closes the connection without accepting `session.open`. The server sends `session.open` per session; the host service answers with a data connection.'
    x-protocol-versions: [1]
    messages:
      host.hello:
        $ref: '#/components/messages/host.hello'
      host.identify:
        $ref: '#/components/messages/host.identify'
      host.ready:
        $ref: '#/components/messages/host.ready'
      host.heartbeat:
        $ref: '#/components/messages/host.heartbeat'
      host.heartbeat_ack:
        $ref: '#/components/messages/host.heartbeat_ack'
      host.report:
        $ref: '#/components/messages/host.report'
      host.session.open:
        $ref: '#/components/messages/host.session.open'
      host.session.close:
        $ref: '#/components/messages/host.session.close'
      host.session.started:
        $ref: '#/components/messages/host.session.started'
      host.session.ended:
        $ref: '#/components/messages/host.session.ended'
      host.error:
        $ref: '#/components/messages/host.error'
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
    x-close-codes:
    - code: 1000
      name: normal
      client_action: reconnect with backoff
    - code: 1001
      name: going_away
      client_action: reconnect with backoff
    - code: 4002
      name: decode_error
      client_action: report the error, reconnect
    - code: 4008
      name: rate_limited
      client_action: wait for the time given in the close reason
    - code: 4009
      name: heartbeat_timeout
      client_action: reconnect with backoff
    - code: 4013
      name: server_restart
      client_action: reconnect at once with a random delay; keep PTYs until `terminal.detach_grace`
    - code: 4014
      name: slow_consumer
      client_action: relay buffer full; reconnect the data connection
    - code: 4100
      name: terminal_closed
      client_action: 'data connection only: the session ended; end the PTY'
    - code: 4110
      name: host_unpaired
      client_action: keys unknown or replaced by a re-pairing; stop and run `bothy-host pair` again
    - code: 4111
      name: host_disabled
      client_action: the host is disabled or retired; end all PTYs, reconnect only after a long backoff
    - code: 4112
      name: host_duplicate
      client_action: 'a second live host service with the same keys was found; the host is disabled; stop, do not reconnect, an owner must re-pair (24, 3.4)'
    - code: 4113
      name: host_auth_failed
      client_action: proof invalid or not sent within `terminal.host_auth_timeout`; check clock and keys, reconnect with backoff
    - code: 4114
      name: host_version_unsupported
      client_action: protocol version too old; update the host service, do not reconnect
  hostData:
    address: /hosts/sessions/{session_id}/stream
    title: Data connection of a host service for one session
    description: 'Opened by the host service after `session.open`. After `hello` and `identify` (with `session_id`) only binary Noise frames, forwarded unchanged to and from the device stream of the same session.'
    x-protocol-versions: [1]
    parameters:
      session_id:
        description: Terminal session ID (UUIDv7). The proxy routes both stream paths of a session by this segment to the same node (docs/spec/16-operations.md, section 4.4).
    messages:
      host.hello:
        $ref: '#/components/messages/host.hello'
      host.identify:
        $ref: '#/components/messages/host.identify'
      host.error:
        $ref: '#/components/messages/host.error'
      noise.frame:
        $ref: '#/components/messages/noise.frame'
    bindings:
      ws:
        method: GET
        bindingVersion: 0.1.0
    x-close-codes:
    - code: 1000
      name: normal
      client_action: reconnect with backoff
    - code: 1001
      name: going_away
      client_action: reconnect with backoff
    - code: 4002
      name: decode_error
      client_action: report the error, reconnect
    - code: 4008
      name: rate_limited
      client_action: wait for the time given in the close reason
    - code: 4009
      name: heartbeat_timeout
      client_action: reconnect with backoff
    - code: 4013
      name: server_restart
      client_action: reconnect at once with a random delay; keep PTYs until `terminal.detach_grace`
    - code: 4014
      name: slow_consumer
      client_action: relay buffer full; reconnect the data connection
    - code: 4100
      name: terminal_closed
      client_action: 'data connection only: the session ended; end the PTY'
    - code: 4110
      name: host_unpaired
      client_action: keys unknown or replaced by a re-pairing; stop and run `bothy-host pair` again
    - code: 4111
      name: host_disabled
      client_action: the host is disabled or retired; end all PTYs, reconnect only after a long backoff
    - code: 4112
      name: host_duplicate
      client_action: 'a second live host service with the same keys was found; the host is disabled; stop, do not reconnect, an owner must re-pair (24, 3.4)'
    - code: 4113
      name: host_auth_failed
      client_action: proof invalid or not sent within `terminal.host_auth_timeout`; check clock and keys, reconnect with backoff
    - code: 4114
      name: host_version_unsupported
      client_action: protocol version too old; update the host service, do not reconnect

operations:
  receive.identify:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: Authenticate a new gateway session.
    messages:
    - $ref: '#/channels/gateway/messages/op.identify'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
    reply:
      channel:
        $ref: '#/channels/gateway'
      messages:
      - $ref: '#/channels/gateway/messages/op.ready'
  receive.resume:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: Resume a gateway session after a short disconnect.
    messages:
    - $ref: '#/channels/gateway/messages/op.resume'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
    reply:
      channel:
        $ref: '#/channels/gateway'
      messages:
      - $ref: '#/channels/gateway/messages/op.resumed'
  receive.heartbeat:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: Liveness signal with the last processed `seq`. Agents add their state; then `agent.heartbeat` is checked as well. Does not consume the `rl.gateway_connect` bucket, which counts only `identify` and `resume` (05 section 3).
    messages:
    - $ref: '#/channels/gateway/messages/op.heartbeat'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
    reply:
      channel:
        $ref: '#/channels/gateway'
      messages:
      - $ref: '#/channels/gateway/messages/op.heartbeat_ack'
  receive.reauth:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: Hand over a new access token during the connection. Does not consume the `rl.gateway_connect` bucket (05 section 3).
    messages:
    - $ref: '#/channels/gateway/messages/op.reauth'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
  receive.focus:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: Set the threads currently on screen (live-box patches, typing). Unreadable threads are ignored silently.
    messages:
    - $ref: '#/channels/gateway/messages/op.focus'
    x-authz-action: gateway.focus
    x-rate-limit-class: rl.read
  receive.typing.start:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: The person types in a thread. People only; agents show typing through their run (04 section 12).
    messages:
    - $ref: '#/channels/gateway/messages/op.typing.start'
    x-authz-action: typing.start
    x-rate-limit-class: rl.typing
  receive.typing.stop:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: The person stopped typing. No event is sent; the op only resets the throttle of the connection.
    messages:
    - $ref: '#/channels/gateway/messages/op.typing.stop'
    x-authz-action: typing.start
    x-rate-limit-class: rl.typing
  receive.ack:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: 'Agents only: acknowledge all events up to `seq`.'
    messages:
    - $ref: '#/channels/gateway/messages/op.ack'
    x-authz-action: agent.events.consume
    x-rate-limit-class: rl.agent_runtime
  receive.run.update:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: 'Agents only: live-box patch of an own run, same as `PATCH /runs/{run_id}`.'
    messages:
    - $ref: '#/channels/gateway/messages/op.run.update'
    x-authz-action: run.update
    x-rate-limit-class: rl.agent_runtime
  receive.command.autocomplete_result:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: 'Agents and apps: answer a `command.autocomplete_requested`, same as `POST /command-autocompletions/{request_id}/answer`.'
    messages:
    - $ref: '#/channels/gateway/messages/op.command.autocomplete_result'
    x-authz-action: command.autocomplete.respond
    x-rate-limit-class: rl.agent_runtime
  receive.stats.subscribe:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: Subscribe to the live frames `stats.live` of the instance or of one space (docs/spec/25-visualization.md, section 5). One subscription per connection; a new one replaces it.
    messages:
    - $ref: '#/channels/gateway/messages/op.stats.subscribe'
    x-authz-action: stats.read
    x-rate-limit-class: rl.read
  receive.stats.unsubscribe:
    action: receive
    channel:
      $ref: '#/channels/gateway'
    summary: End the `stats.live` subscription of the connection.
    messages:
    - $ref: '#/channels/gateway/messages/op.stats.unsubscribe'
    x-authz-action: stats.read
    x-rate-limit-class: rl.read
  send.hello:
    action: send
    channel:
      $ref: '#/channels/gateway'
    summary: First frame after the upgrade.
    messages:
    - $ref: '#/channels/gateway/messages/op.hello'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
  send.ready:
    action: send
    channel:
      $ref: '#/channels/gateway'
    summary: Session ready, with snapshot. Catch-up follows when a cursor was sent.
    messages:
    - $ref: '#/channels/gateway/messages/op.ready'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
  send.resumed:
    action: send
    channel:
      $ref: '#/channels/gateway'
    summary: Resume accepted; catch-up from the cursor follows.
    messages:
    - $ref: '#/channels/gateway/messages/op.resumed'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
  send.cursor:
    action: send
    channel:
