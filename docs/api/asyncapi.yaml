        $ref: '#/components/messages/event.agent.config_changed'
      event.typing.started:
        $ref: '#/components/messages/event.typing.started'
      event.run.updated:
        $ref: '#/components/messages/event.run.updated'
      event.agent.presence_changed:
        $ref: '#/components/messages/event.agent.presence_changed'
      event.command.autocomplete_requested:
        $ref: '#/components/messages/event.command.autocomplete_requested'
