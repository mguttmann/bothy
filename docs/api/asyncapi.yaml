    summary: Advance the cursor without an event (skipped invisible events).
    messages:
    - $ref: '#/channels/gateway/messages/op.cursor'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
  send.catchup.complete:
    action: send
    channel:
      $ref: '#/channels/gateway'
    summary: Catch-up finished; the connection is live.
    messages:
    - $ref: '#/channels/gateway/messages/op.catchup.complete'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
  send.resync_required:
    action: send
    channel:
      $ref: '#/channels/gateway'
    summary: Catch-up impossible; load `GET /sync/snapshot`. The connection stays open and is live from `head_seq`.
    messages:
    - $ref: '#/channels/gateway/messages/op.resync_required'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
  send.heartbeat_ack:
    action: send
    channel:
      $ref: '#/channels/gateway'
    summary: Answer to `heartbeat`.
    messages:
    - $ref: '#/channels/gateway/messages/op.heartbeat_ack'
    x-authz-action: gateway.connect
    x-rate-limit-class: rl.gateway_connect
  send.reauth_required:
    action: send
    channel:
      $ref: '#/channels/gateway'
    summary: The access token expires soon; send `reauth`.
    messages:
    - $ref: '#/channels/gateway/messages/op.reauth_required'
    x-authz-action: gateway.connect
