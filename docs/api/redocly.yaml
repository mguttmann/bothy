# Lint configuration for the API contracts (ADR 0013, docs/spec/06-api.md section 15).
# Run from the repository root (pinned version, updated by Renovate):
#   npx -y @redocly/cli@2.62.1 lint --config docs/api/redocly.yaml
# Without file arguments both APIs below are linted. A single file:
#   npx -y @redocly/cli@2.62.1 lint docs/api/openapi.yaml --config docs/api/redocly.yaml
#
# The action lists mirror docs/spec/05-aktionen.md section 4 (closed catalogue), the rate-limit
# classes section 3. The gate check `api-catalogue-sync` compares these lists with 05
# (docs/spec/06-api.md); a new action enters 05 first, then this file. From ticket M1-02 the
# lists are generated from docs/spec/actions.yaml (ADR 0049, machine-readable action catalogue).

extends:
  - recommended

apis:
  rest@v1:
    root: ./openapi.yaml
    rules:
      rule/operation-id-camel-case:
        subject:
          type: Operation
          property: operationId
        assertions:
          pattern: /^[a-z][a-zA-Z0-9]*$/
        message: operationId must be lowerCamelCase.
  gateway@v1:
    root: ./asyncapi.yaml
    rules:
      # Authentication is in-band (`identify`/`resume` frames with DPoP proof), not part of the
      # WebSocket handshake, so AsyncAPI security schemes cannot express it.
      security-defined: off

rules:
  # Schemas for gateway frames are only referenced from asyncapi.yaml.
  no-unused-components: off
  # OpenAPI 3.1 allows `description` next to `$ref` (JSON Schema 2020-12); we use it for field docs.
  spec-ref-siblings: off
  # Replaced by rule/operation-4xx-response below, which exempts operations with rate-limit
  # class `none` (webhook event descriptions under `webhooks:`): they have no client error.
  operation-4xx-response: off
  rule/operation-4xx-response:
    subject:
      type: Responses
    where:
      - subject:
          type: Operation
          property: x-rate-limit-class
        assertions:
          notPattern: /^none$/
    assertions:
      requireAny: ['400', '401', '403', '404', '409', '410', '412', '413', '415', '416', '422', '428', '429']
    message: Operation must document at least one 4xx response.
  operation-summary: error
  tag-description: error
  no-invalid-media-type-examples: error
  no-invalid-schema-examples: error

  # 05-aktionen.md rule 3: every operation names exactly one known action.
  rule/authz-action-required:
    subject:
      type: Operation
    assertions:
      required:
        - x-authz-action
    message: Every operation needs x-authz-action from docs/spec/05-aktionen.md.
  # System actions (05 rule 10: grant.expire, group.member.expire, instance.bootstrap,
  # signing_key.transition) are never on a route or op, so neither list contains them.
  rule/authz-action-known:
    subject:
      type: Operation
      property: x-authz-action
    assertions:
      enum:
        # catalogue (docs/spec/05-aktionen.md section 4)
        - access.explain
        - access.preview
        - access.view_as
        - agent.billing_mode.set
        - agent.billing_mode.set_all
        - agent.config.read
        - agent.create
        - agent.credential_holder.set
