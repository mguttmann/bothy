        - webhook_in.revoke
        - webhook_out.deliver
        - webhook_out.manage
        - webhook_out.read
        - webhook_out.redeliver
    message: x-authz-action is not in the action catalogue.

  rule/rate-limit-class-required:
    subject:
      type: Operation
    assertions:
      required:
        - x-rate-limit-class
    message: Every operation needs x-rate-limit-class.
  rule/rate-limit-class-known:
    subject:
      type: Operation
      property: x-rate-limit-class
    assertions:
      enum:
        - none
        - rl.admin
        - rl.agent_runtime
        - rl.export
        - rl.gateway_connect
        - rl.import
        - rl.interaction
        - rl.message
        - rl.public_auth
        - rl.read
        - rl.search
        - rl.trigger
        - rl.typing
        - rl.upload
        - rl.webhook_in
        - rl.write
    message: x-rate-limit-class is not a class of docs/spec/05-aktionen.md section 3 (or none).

  # 05-aktionen.md rule 4: every event type names its receive action.
  rule/event-receive-action-required:
    subject:
      type: Message
    where:
      - subject:
          type: Message
          property: x-event-kind
        assertions:
          defined: true
    assertions:
      required:
        - x-receive-action
    message: Every event message needs x-receive-action.
  # Receive actions: catalogue actions plus `self` (05-aktionen.md section 6).
  rule/receive-action-known-message:
    subject:
      type: Message
      property: x-receive-action
    assertions:
      enum: &receive_actions
        - access.explain
        - access.preview
