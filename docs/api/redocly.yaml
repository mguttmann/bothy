  rule/receive-action-known-webhook:
    subject:
      type: Operation
      property: x-receive-action
    assertions:
      enum: *receive_actions

  # Conservative schemas for code generators (oapi-codegen, dart-dio): no null type,
  # no type arrays, oneOf only with a discriminator.
  rule/no-type-arrays-or-null:
    subject:
      type: Schema
      property: type
    assertions:
      pattern: /^(string|integer|number|boolean|object|array)$/
    message: Use one JSON type per schema; express "no value" by omitting the member.
  rule/oneof-needs-discriminator:
    subject:
      type: Schema
    assertions:
      mutuallyRequired:
        - oneOf
        - discriminator
    message: oneOf is only allowed together with a discriminator.
  rule/no-anyof:
    subject:
      type: Schema
    assertions:
      disallowed:
        - anyOf
    message: anyOf is not allowed; use oneOf with a discriminator.
