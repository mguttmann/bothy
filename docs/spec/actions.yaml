  note: vor Zustellung `agent.invoke` für den Auslöser
  resource_version: false
- type: agent.followup
  kind: durable
  resource: run
  receive_action: agent.events.consume
  audience: self
  receivers: agent
  receive_text: self (Agent) und `agent.events.consume`
  note: vor Zustellung `agent.invoke` für den Auslöser
  resource_version: false
- type: run.cancel_requested
  kind: durable
  resource: run
  receive_action: agent.events.consume
  audience: self
  receivers: agent
  receive_text: self (Agent) und `agent.events.consume`
  resource_version: false
- type: interaction.created
  kind: durable
  resource: interaction
  receive_action: agent.events.consume
  audience: self
  receivers: agent_or_app
  receive_text: self (Agent oder App, Eigentümer der Komponente); Agent zusätzlich `agent.events.consume`,
    App `events:subscribe`
  note: vor Zustellung an Agenten `agent.invoke`
  resource_version: false
- type: command.invoked
  kind: durable
  resource: command
  receive_action: agent.events.consume
  audience: self
  receivers: agent_or_app
  receive_text: self (Agent oder App, Eigentümer des Befehls); Agent zusätzlich `agent.events.consume`,
    App `events:subscribe`
  note: vor Zustellung an Agenten `agent.invoke`
  resource_version: false
- type: agent.config_changed
  kind: durable
  resource: channel
  receive_action: agent.config.read
  audience: self
  receivers: agent
  receive_text: self (Agent) und `agent.config.read`
  note: Prompt, Skills, Projektbindung geändert
  resource_version: false
- type: host.updated
  kind: durable
  resource: host
  receive_action: host.read
  note: auch beim Anlegen; Zustand, Inhaber, LLM-Erklärung, Profile, Prüfergebnisse; `key_changed` bei
    Neukopplung; nie Schlüssel
  resource_version: true
- type: terminal_session.changed
  kind: durable
  resource: terminal_session
  receive_action: self
  audience: self
  note: 'an die Person der Sitzung: Zustand, Gerät, `close_reason`; nie Inhalte'
  resource_version: true
- type: typing.started
  kind: ephemeral
  resource: thread
  receive_action: thread.read
  note: Thread im Fokus
  resource_version: false
- type: run.updated
  kind: ephemeral
  resource: run
  receive_action: run.read
  note: Thread im Fokus
  resource_version: true
- type: agent.presence_changed
  kind: ephemeral
  resource: agent
  receive_action: agent.read
  resource_version: false
- type: host.presence_changed
  kind: ephemeral
  resource: host
  receive_action: host.read
  resource_version: false
- type: stats.live
  kind: ephemeral
  resource: instance, space
  receive_action: stats.read
  note: nur an Verbindungen mit Abo `stats.subscribe`; Inhalt gefiltert auf die sichtbaren Kanäle, Kosten
    nur mit `cost.read.aggregate` ([25-visualisierung.md](25-visualisierung.md), Abschnitt 5)
  resource_version: false
- type: notification.created
  kind: ephemeral
  resource: thread
  receive_action: push.deliver
  audience: self
  receive_text: self und `push.deliver`
  note: nur an Verbindungen des Empfängers, statt eines Pushes an dieses Gerät ([13-push-benachrichtigungen.md](13-push-benachrichtigungen.md),
    Abschnitt 6.3)
  resource_version: false
- type: command.autocomplete_requested
  kind: ephemeral
  resource: command
  receive_action: agent.events.consume
  audience: self
  receivers: agent_or_app
  receive_text: self (Eigentümer des Befehls); Agent zusätzlich `agent.events.consume`
  note: trägt eine Marke mit `trigger_kind = autocomplete`; nur an eine Gateway-Verbindung des Eigentümers
  resource_version: false
