  resource: user
  receive_action: self
  audience: self
  resource_version: false
- type: gdpr.request_updated
  kind: durable
  resource: gdpr_request
  receive_action: gdpr.request.read
  resource_version: false
- type: import.progress
  kind: durable
  resource: import_source
  receive_action: import.read
  resource_version: false
- type: agent.invocation
  kind: durable
  resource: run
  receive_action: agent.events.consume
  audience: self
  receivers: agent
  receive_text: self (agent) and `agent.events.consume`
  note: before delivery, `agent.invoke` for the triggering person
  resource_version: false
- type: agent.followup
  kind: durable
  resource: run
  receive_action: agent.events.consume
  audience: self
  receivers: agent
  receive_text: self (agent) and `agent.events.consume`
  note: before delivery, `agent.invoke` for the triggering person
  resource_version: false
- type: run.cancel_requested
  kind: durable
  resource: run
  receive_action: agent.events.consume
  audience: self
  receivers: agent
  receive_text: self (agent) and `agent.events.consume`
  resource_version: false
- type: interaction.created
  kind: durable
  resource: interaction
  receive_action: agent.events.consume
  audience: self
  receivers: agent_or_app
  receive_text: self (agent or app, owner of the component); agent additionally `agent.events.consume`,
    app `events:subscribe`
  note: before delivery to agents, `agent.invoke`
  resource_version: false
- type: command.invoked
  kind: durable
  resource: command
  receive_action: agent.events.consume
  audience: self
  receivers: agent_or_app
  receive_text: self (agent or app, owner of the command); agent additionally `agent.events.consume`,
    app `events:subscribe`
  note: before delivery to agents, `agent.invoke`
  resource_version: false
- type: agent.config_changed
  kind: durable
  resource: channel
  receive_action: agent.config.read
  audience: self
  receivers: agent
  receive_text: self (agent) and `agent.config.read`
  note: prompt, skills, project binding changed
  resource_version: false
- type: host.updated
  kind: durable
  resource: host
  receive_action: host.read
  note: also on creation; state, assignee, LLM declaration, profiles, check results, assignments of the
    session users; `key_changed` on re-pairing; never keys
  resource_version: true
- type: terminal_session.changed
  kind: durable
  resource: terminal_session
  receive_action: self
  audience: self
  note: 'to the person of the session: state, device, `close_reason`; never contents'
  resource_version: true
- type: typing.started
  kind: ephemeral
  resource: thread
  receive_action: thread.read
  note: thread in focus
  resource_version: false
- type: run.updated
  kind: ephemeral
  resource: run
  receive_action: run.read
  note: thread in focus
  resource_version: true
- type: agent.presence_changed
  kind: ephemeral
  resource: agent
  receive_action: agent.read
  resource_version: false
- type: host.presence_changed
  kind: ephemeral
  resource: host
  receive_action: host.read
  resource_version: false
- type: stats.live
  kind: ephemeral
  resource: instance, space
  receive_action: stats.read
  note: only to connections with a `stats.subscribe` subscription; content filtered to the visible channels,
    costs only with `cost.read.aggregate` ([25-visualization.md](25-visualization.md), section 5)
  resource_version: false
- type: notification.created
  kind: ephemeral
  resource: thread; for a hint without a thread the recipient (`user`)
  receive_action: push.deliver
  audience: self
  receive_text: 'self and `push.deliver`; for a hint without a thread: self and the recipient rule of R-AZ-30'
  note: only to connections of the receiver, instead of a push to this device ([13-push-notifications.md](13-push-notifications.md),
    section 6.3)
  resource_version: false
- type: command.autocomplete_requested
  kind: ephemeral
  resource: command
  receive_action: agent.events.consume
  audience: self
  receivers: agent_or_app
  receive_text: self (owner of the command); agent additionally `agent.events.consume`
  note: carries a token with `trigger_kind = autocomplete`; only to one gateway connection of the owner
  resource_version: false
ws_ops:
- op: identify
  direction: client_to_server
  action: gateway.connect
- op: resume
  direction: client_to_server
  action: gateway.connect
- op: heartbeat
  direction: client_to_server
  action: gateway.connect
  also_actions:
  - agent.heartbeat
  action_text: '`gateway.connect` (the session must be valid, consumes nothing from `rl.gateway_connect`);
    for agents additionally `agent.heartbeat`'
- op: reauth
  direction: client_to_server
  action: gateway.connect
  action_text: '`gateway.connect` (consumes nothing from `rl.gateway_connect`)'
- op: focus
  direction: client_to_server
  action: gateway.focus
  action_text: '`gateway.focus` per thread'
- op: typing.start
  direction: client_to_server
  action: typing.start
- op: typing.stop
  direction: client_to_server
  action: typing.start
- op: ack
  direction: agent_to_server
  action: agent.events.consume
- op: run.update
  direction: agent_to_server
  action: run.update
- op: command.autocomplete_result
  direction: agent_or_app_to_server
  action: command.autocomplete.respond
- op: stats.subscribe
  direction: client_to_server
  action: stats.read
  action_text: '`stats.read` on the instance or space respectively'
  row_group: stats
- op: stats.unsubscribe
  direction: client_to_server
  action: stats.read
  action_text: '`stats.read` on the instance or space respectively'
  row_group: stats
- op: hello
  direction: server_to_client
  action: gateway.connect
  action_text: none of its own; part of the session from `gateway.connect`
  row_group: session
- op: ready
  direction: server_to_client
  action: gateway.connect
  action_text: none of its own; part of the session from `gateway.connect`
  row_group: session
- op: resumed
  direction: server_to_client
  action: gateway.connect
  action_text: none of its own; part of the session from `gateway.connect`
  row_group: session
- op: cursor
  direction: server_to_client
  action: gateway.connect
  action_text: none of its own; part of the session from `gateway.connect`
  row_group: session
- op: catchup.complete
  direction: server_to_client
  action: gateway.connect
  action_text: none of its own; part of the session from `gateway.connect`
  row_group: session
- op: resync_required
  direction: server_to_client
  action: gateway.connect
  action_text: none of its own; part of the session from `gateway.connect`
  row_group: session
- op: heartbeat_ack
  direction: server_to_client
  action: gateway.connect
  action_text: none of its own; part of the session from `gateway.connect`
  row_group: session
- op: reauth_required
  direction: server_to_client
  action: gateway.connect
  action_text: none of its own; part of the session from `gateway.connect`
  row_group: session
- op: error
  direction: server_to_client
  action: gateway.connect
  action_text: none of its own; part of the session from `gateway.connect`
  row_group: session
- op: dispatch
  direction: server_to_client
  action: gateway.connect
  action_text: receive action of the event type (section 6)
  per_event_receive_action: true
channel_ops:
- channel: terminal_stream
  channel_text: device stream `/terminal/sessions/{session_id}/stream`
  ops:
  - hello
  direction: server_to_device
  action: terminal.stream
- channel: terminal_stream
  ops:
  - identify
  direction: device_to_server
  action: terminal.stream
- channel: terminal_stream
  ops:
  - noise_frame
  direction: both
  action: terminal.stream
  action_text: '`terminal.stream` (the session must be valid)'
- channel: terminal_stream
  ops:
  - error
  direction: server_to_device
  action: terminal.stream
- channel: host_control
  channel_text: control `/hosts/connect`
  ops:
  - hello
  - ready
  - heartbeat_ack
  - error
  - session.open
  - session.close
  direction: server_to_host
  action: host.connect
- channel: host_control
  ops:
  - identify
  - heartbeat
  - report
  - session.started
  - session.ended
  direction: host_to_server
  action: host.connect
- channel: host_data
  channel_text: data `/hosts/sessions/{session_id}/stream`
  ops:
  - hello
  - identify
  - noise_frame
  direction: both
  action: host.connect
  action_text: '`host.connect` (the session belongs to the host)'
- channel: host_data
  ops:
  - error
  direction: server_to_host
  action: host.connect
