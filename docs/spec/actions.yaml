# SPDX-License-Identifier: Apache-2.0
#
# Action catalogue of the authorisation (ADR 0049): every action of docs/spec/05-aktionen.md
# with its columns, the rate-limit classes, the event types with their receive action and the
# WebSocket ops with their action. This file is the only source of these facts; the tables of
# chapter 05 and the lists in docs/api/redocly.yaml are generated from it.
# Edit here, then run `make catalog`; `make catalog-check` holds the copies in the gate.
# Schema and rules: tools/catalog/README.md.

version: 1
rate_limit_classes:
- id: rl.public_auth
  key: 'Client-IP (IPv6: das /64-Präfix)'
  purpose: Anmeldung, Refresh, öffentliche Endpunkte; zählt zusätzlich jede gescheiterte Prüfung vorgelegter
    Anmeldedaten ([02-architektur.md](02-architektur.md), Abschnitt 9.1)
- id: rl.gateway_connect
  key: Gerät bzw. Token, geprüft bei `identify` und `resume`, sobald Anmeldedaten geprüft sind
  purpose: WebSocket-Sitzung aufbauen
- id: rl.read
  key: Prinzipal
  purpose: lesende Abfragen
- id: rl.write
  key: Prinzipal
  purpose: allgemeine Schreibvorgänge
- id: rl.message
  key: Prinzipal
  purpose: Nachrichten senden und bearbeiten
- id: rl.trigger
  key: Prinzipal
  purpose: Agenten auslösen, Befehle, Vorschläge
- id: rl.interaction
  key: Prinzipal
  purpose: Komponenten bedienen
- id: rl.upload
  key: Prinzipal
  purpose: Dateien hochladen
- id: rl.search
  key: Prinzipal
  purpose: Suche
- id: rl.typing
  key: Verbindung
  purpose: Tippen
- id: rl.admin
  key: Prinzipal
  purpose: Verwaltung
- id: rl.export
  key: Prinzipal
  purpose: Export, DSGVO-Pakete
- id: rl.agent_runtime
  key: Agent
  purpose: Heartbeat, Lauf-Patches, Bestätigungen
- id: rl.webhook_in
  key: Eingangs-Webhook
  purpose: eingehende Webhooks
- id: rl.import
  key: Prinzipal
  purpose: Stapel eines laufenden Imports (`import.apply`)
- id: rl.terminal
  key: Prinzipal
  purpose: Terminal öffnen, anhängen, Strom verbinden
- id: rl.host
  key: Rechner (nach der Prüfung des Anmeldeschlüssels)
  purpose: Steuer- und Datenverbindungen des Host-Dienstes
sections:
- public
- instance
- identity
- grants
- structure
- threads
- messages
- files
- personal
- agents
- apps
- operations
- dev
- terminal
actions:
- id: instance.discovery.read
  section: public
  description: JWKS, Protokollversionen, minimales Branding, Branding-Logo
  resource: instance
  right: public
  owner: false
  step_up: false
  audit: never
  rights_change: false
  rl_class: rl.public_auth
  effect: read
- id: auth.login.begin
  section: public
  description: Anmeldung starten (OIDC, Passkey-Challenge, Header-Login, Geräte-Kopplung)
  resource: instance
  right: public
  owner: false
  step_up: false
  audit: denials
  rights_change: false
  rl_class: rl.public_auth
  effect: write
- id: auth.login.complete
  section: public
  description: Anmeldung abschließen (OIDC-Server-Code, Passkey, Einladungs-Code, Passwort mit TOTP, Kopplung),
    Gerät und Geräteschlüssel registrieren, Sitzung anlegen
  resource: instance
  right: public
  owner: false
  step_up: false
  audit: always
  rights_change: false
  rl_class: rl.public_auth
  effect: write
- id: auth.token.refresh
  section: public
  description: Refresh-Token rotieren (mit Nachsicht `auth.refresh_reuse_grace`; im Wartungsmodus ohne
    Rotation, ADR 0065); Wiederverwendung sperrt die Familie
  resource: auth_session
  right: public (gültiges Refresh-Token und DPoP-Beweis der Familie)
  owner: false
  step_up: false
  audit: denials
  rights_change: false
  rl_class: rl.public_auth
  effect: write
- id: auth.logout
  section: public
  description: eigene Sitzung beenden; Push-Registrierungen dieser Sitzung werden deaktiviert
