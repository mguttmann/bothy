# SPDX-License-Identifier: Apache-2.0
#
# Action catalogue of the authorization (ADR 0049): every action of docs/spec/05-actions.md
# with its columns, the rate-limit classes, the event types with their receive action and the
# WebSocket ops with their action. This file is the only source of these facts; the tables of
# chapter 05 and the lists in docs/api/redocly.yaml are generated from it.
# Edit here, then run `make catalog`; `make catalog-check` holds the copies in the gate.
# Schema and rules: tools/catalog/README.md.

version: 1
rate_limit_classes:
- id: rl.public_auth
  key: 'client IP (IPv6: the /64 prefix)'
  purpose: login, refresh, public endpoints; additionally counts every failed check of presented credentials
    ([02-architecture.md](02-architecture.md), section 9.1)
- id: rl.gateway_connect
  key: device or token, checked at `identify` and `resume` once the credentials are checked
  purpose: establish a WebSocket session
- id: rl.read
  key: principal
  purpose: read queries
- id: rl.write
  key: principal
  purpose: general writes
- id: rl.message
  key: principal
  purpose: send and edit messages
- id: rl.trigger
  key: principal
  purpose: trigger agents, commands, suggestions
- id: rl.interaction
  key: principal
  purpose: use components
- id: rl.upload
  key: principal
  purpose: upload files
- id: rl.search
  key: principal
  purpose: search
- id: rl.typing
  key: connection
  purpose: typing
- id: rl.admin
  key: principal
  purpose: administration
- id: rl.export
  key: principal
  purpose: export, GDPR packages
- id: rl.agent_runtime
  key: agent
  purpose: heartbeat, run patches, acks
- id: rl.webhook_in
  key: incoming webhook
  purpose: incoming webhooks
- id: rl.import
  key: principal
  purpose: batches of a running import (`import.apply`)
- id: rl.terminal
  key: principal
  purpose: open a terminal, attach, connect a stream
- id: rl.host
  key: host (after the check of the authentication key)
  purpose: control and data connections of the host service
sections:
- public
- instance
- identity
- grants
- structure
- threads
- messages
- files
- personal
- agents
- apps
- operations
- dev
- terminal
actions:
- id: instance.discovery.read
  section: public
  description: JWKS, protocol versions, minimal branding, branding logo
  resource: instance
  right: public
  owner: false
  step_up: false
  audit: never
  rights_change: false
  rl_class: rl.public_auth
  effect: read
- id: console.csp_report
  section: public
  description: accept a Content Security Policy violation report of the web console, without content in the
    log ([19-security.md](19-security.md), section 5, rule 6; R-AZ-33)
  resource: instance
  right: public
  owner: false
  step_up: false
  audit: never
  rights_change: false
  rl_class: rl.public_auth
  effect: read
- id: auth.login.begin
  section: public
  description: start a login (OIDC, passkey challenge, header login, device pairing)
  resource: instance
  right: public
  owner: false
  step_up: false
  audit: denials
  rights_change: false
  rl_class: rl.public_auth
  effect: write
- id: auth.login.complete
  section: public
  description: complete a login (OIDC server code, passkey, enrollment code, password with TOTP, pairing),
    register the device and device key, create a session
  resource: instance
  right: public
  owner: false
  step_up: false
  audit: always
  rights_change: false
  rl_class: rl.public_auth
  effect: write
- id: auth.token.refresh
  section: public
  description: rotate the refresh token (with grace `auth.refresh_reuse_grace`; in maintenance mode without
    rotation, ADR 0065); reuse revokes the family
  resource: auth_session
  right: public (valid refresh token and DPoP proof of the family)
  owner: false
  step_up: false
  audit: denials
  rights_change: false
  rl_class: rl.public_auth
  effect: write
- id: auth.logout
  section: public
  description: end one's own session; push registrations of this session are deactivated
  resource: auth_session
  right: self
  owner: false
  step_up: false
  audit: always
  rights_change: false
  rl_class: rl.write
  effect: write
- id: auth.step_up
  section: public
  description: provide a fresh confirmation (passkey, step-up device key, password with TOTP, new OIDC
    login)
  resource: auth_session
  right: self
  owner: false
  step_up: false
  audit: always
  rights_change: false
  rl_class: rl.public_auth
