#
# Shared analysis rules of the Dart workspace. Every member includes its base set
# (package:lints/recommended.yaml for pure Dart, package:flutter_lints/flutter.yaml for
# Flutter) and then this file (docs/DECISIONS.md D-M4-01-4).
#
# Generated code is excluded from the doc lint and the style lint (and from coverage in
# `make coverage`); compile errors in it still fail, because the members that import it are
# analyzed and compiled (docs/DECISIONS.md D-M4-01-4).

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Every public symbol has a doc comment (docs/spec/23-quality.md "Documentation in code").
    public_member_api_docs: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/lib/src/generated/**"
    - "build/**"

linter:
  rules:
    - public_member_api_docs
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - unawaited_futures
    - directives_ordering
