# SPDX-License-Identifier: Apache-2.0
#
# Documentation site (ADR 0045). Build: `make docs` (mkdocs build --strict); versions are
# pinned in tools/uv.lock. The navigation lists every page under docs/ except the single
# ADRs: they are reached through the ADR index, which tools/docs/adr_index.py --check keeps
# complete, and `not_in_nav` names them. Any other page missing from the navigation and
# any navigation entry without a page fail the strict build (`omitted_files: warn`).

site_name: Bothy
site_description: A command center for AI agents in chat form. Chat, live view, grants, terminal, costs and statistics, self-hosted.
site_url: https://OWNER.github.io/bothy/
repo_url: https://github.com/OWNER/bothy
repo_name: bothy
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  # System fonts: reading the site sends no request to a font service.
  font: false
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: System default
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light

# Colors of the site and of its Mermaid blocks come from the design tokens (generated file,
# tools/design-tokens/tokens.py).
extra_css:
  - design/site-theme.css

plugins:
  - search:
      lang: [en]

# Links to repository files outside docs/ point to the repository host (the target must
# exist; tools/docs/mkdocs_repo_links.py).
hooks:
  - tools/docs/mkdocs_repo_links.py
  - tools/docs/mkdocs_markdown_structure.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style anchors, so that links work the same on GitHub and in the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

# Deliberately outside the navigation: single ADRs (linked from the ADR index).
not_in_nav: |
  /adr/0*.md

