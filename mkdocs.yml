# SPDX-License-Identifier: Apache-2.0
#
# Documentation site (ADR 0045). Build: `make docs` (mkdocs build --strict); versions are
# pinned in tools/uv.lock. The navigation lists every page under docs/ except the single
# ADRs: they are reached through the ADR index, which tools/docs/adr_index.py --check keeps
# complete, and `not_in_nav` names them, and the generated Dart API pages under api/dart/,
# which docs/reference/dart-api.md links (M4-01). Any other page missing from the navigation and
# any navigation entry without a page fail the strict build (`omitted_files: warn`).

site_name: Bothy
site_description: A command center for AI agents in chat form. Chat, live view, grants, terminal, costs and statistics, self-hosted.
site_url: https://OWNER.github.io/bothy/
repo_url: https://github.com/OWNER/bothy
repo_name: bothy
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
# The readme that `dart doc` puts beside its static assets is not a page of the site; its
# reference-style link with a code span would be an unresolved autoref (mkdocstrings).
exclude_docs: |
  api/dart/*/static-assets/readme.md

theme:
  name: material
  language: en
  # System fonts: reading the site sends no request to a font service.
  font: false
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: System default
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light

# Colors of the site and of its Mermaid blocks come from the design tokens (generated file,
# tools/design-tokens/tokens.py).
extra_css:
  - design/site-theme.css

plugins:
  - search:
      lang: [en]
  # API reference of the Python SDK hand layer and of the Hermes adapter from their google
  # docstrings (docs/sdk/python.md, docs/sdk/hermes-adapter.md);
  # the generated core is documented by docs/api/openapi.yaml.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [sdk/python/src, plugins/hermes-adapter/src]
          options:
            docstring_style: google
            docstring_section_style: table
            filters: ["!^_"]
            show_source: false
            show_if_no_docstring: false
            show_root_heading: true
            show_root_full_path: true
            heading_level: 2
            members_order: source

# Links to repository files outside docs/ point to the repository host (the target must
# exist; tools/docs/mkdocs_repo_links.py).
hooks:
  - tools/docs/mkdocs_repo_links.py
  - tools/docs/mkdocs_markdown_structure.py
  # The REST, schema and gateway reference pages, rendered from docs/api/openapi.yaml and
  # docs/api/asyncapi.yaml at build time; they exist only in the build (M7-19).
  - tools/docs/mkdocs_api_reference.py
  # The index page of the ruling fragments in docs/decisions.d/; it exists only in the build
  # (PL/24).
  - tools/docs/mkdocs_ruling_fragments.py
  # The typedoc reference of the TypeScript SDK under api/typescript-reference/, built by
  # `make docs` before MkDocs; the build fails without it (docs/decisions.d/M2-30.md D-M2-30-13).
  - tools/docs/mkdocs_sdk_reference.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style anchors, so that links work the same on GitHub and in the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

# Deliberately outside the navigation: single ADRs (linked from the ADR index) and the ruling
# files of the tickets (linked from the generated page decisions.d/index.md).
not_in_nav: |
  /adr/0*.md
  /decisions.d/*.md
  /api/dart/

