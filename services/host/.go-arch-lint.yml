# SPDX-License-Identifier: Apache-2.0
# Architecture rules of the host service. Maintained by hand: one component per package,
# vendors only where named (docs/spec/02-architektur.md, "Code-Layout"). Later tickets add
# their packages here in the same change (an unattached package fails make arch).
version: 3
workdir: .
allow:
  depOnAnyVendor: false
excludeFiles: ["^.*_test\\.go$"]
vendors:
  v-noise: { in: [github.com/flynn/noise] }
  v-sys:   { in: [golang.org/x/sys/**] }
  v-yaml:  { in: [go.yaml.in/yaml/v3] }
  v-websocket: { in: [github.com/coder/websocket, github.com/coder/websocket/**] }
  v-pty:   { in: [github.com/creack/pty] }
components:
  cmd:         { in: cmd/** }
  noise:       { in: internal/noise }
  frame:       { in: internal/frame }
  fingerprint: { in: internal/fingerprint }
  buildinfo:   { in: internal/buildinfo }
  clock:       { in: internal/clock }
  clocktest:   { in: internal/clock/clocktest }
  config:      { in: internal/config }
  state:       { in: internal/state }
  hostos:      { in: internal/hostos }
  hostostest:  { in: internal/hostos/hostostest }
  doctor:      { in: internal/doctor }
  localchan:   { in: internal/localchan }
  helper:      { in: internal/helper }
  install:     { in: internal/install }
  startup:     { in: internal/startup }
  pairing:     { in: internal/pairing }
  control:     { in: internal/control }
  controltest: { in: internal/control/controltest }
  session:     { in: internal/session }
  sessiontest: { in: internal/session/sessiontest }
  pty:         { in: internal/pty }
  profiles:    { in: internal/profiles }
  confirm:     { in: internal/confirm }
  platformtest: { in: test/** }
  testdata:    { in: testdata/** }
# M2-42 and M2-43: cmd may use every internal package; doctor, install, helper, startup and pairing use
# hostos only through its interfaces (they receive implementations from cmd).
deps:
  noise:      { canUse: [v-noise] }
  cmd:        { anyProjectDeps: true, canUse: [v-sys] }
  clocktest:  { mayDependOn: [clock] }
  config:     { canUse: [v-yaml] }
  state:      { canUse: [v-sys] }
  hostos:     { canUse: [v-sys] }
  hostostest: { mayDependOn: [hostos] }
  localchan:  { mayDependOn: [frame], canUse: [v-sys] }
  doctor:     { mayDependOn: [clock, config, hostos, state] }
  helper:     { mayDependOn: [config, doctor, frame, hostos, localchan, noise, profiles, pty, state], canUse: [v-sys] }
  install:    { mayDependOn: [config, hostos, localchan], canUse: [v-sys] }
  startup:    { mayDependOn: [config, doctor, hostos, localchan, pairing, state] }
  pairing:    { mayDependOn: [doctor, fingerprint, noise, state] }
  # M2-43: the control connection uses startup's port types and doctor's report types; it never
  # touches the local channel of the PTY helpers.
  control:    { mayDependOn: [clock, doctor, startup], canUse: [v-websocket] }
  controltest: { canUse: [v-websocket] }
  # M2-45: the session manager is the only user of the data connection (websocket) besides the
  # control client; pty alone uses creack/pty; profiles and confirm reach the system through
  # golang.org/x/sys only.
  session:     { mayDependOn: [clock, config, control, doctor, frame, localchan, noise, state], canUse: [v-websocket] }
  sessiontest: { mayDependOn: [fingerprint, frame, noise], canUse: [v-websocket] }
  pty:         { canUse: [v-pty, v-sys] }
  # M2-48: test/** (platform, and noisedevice, the Noise sidecar of the terminal suite's device)
  # may use every component and vendor; no production component names it (02 6).
  platformtest: { anyProjectDeps: true, anyVendorDeps: true }
  profiles:    { mayDependOn: [config, doctor, hostos, state], canUse: [v-sys] }
  confirm:     { mayDependOn: [hostos], canUse: [v-sys] }
