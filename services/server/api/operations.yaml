# Enable list of REST operations (plan decision P-04). The server generates and registers only
# the operations under `enabled`; every other operationId under `paths` of docs/api/openapi.yaml
# stands under `later` with the milestone that builds it. A handler ticket moves its operationIds
# from `later` to `enabled` and implements them in its module's adapters/httpapi. Format, rules
# and how to regenerate: services/server/api/README.md. The generator (api/routes/gen) only
# checks this file; it never rewrites it.
