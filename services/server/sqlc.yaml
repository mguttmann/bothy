# SPDX-License-Identifier: Apache-2.0
# sqlc configuration (ADR 0007 rule 1): one sql entry per module, the schema read from migrations/
# (sqlc understands goose files and skips their Down sections), queries under
# internal/<module>/adapters/postgres/queries/, generated code in .../sqlcgen. Regenerate with
# `sqlc generate -f sqlc.yaml`; make codegen-check regenerates, compares and fails on drift
# (docs/spec/02-architecture.md section 7.3).
version: "2"
sql:
  # instance (M1-15): file names end in .gen.go (docs/DECISIONS.md M1-05/7).
  - engine: postgresql
    schema: migrations
    queries: internal/instance/adapters/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/instance/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_querier_file_name: querier.gen.go
        output_files_suffix: .gen
        emit_interface: false
  # identity (M1-26)
  - engine: postgresql
    schema: migrations
    queries: internal/identity/adapters/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/identity/adapters/postgres/sqlcgen
        sql_package: pgx/v5
  # audit (M1-24): file names end in .gen.go (docs/DECISIONS.md M1-05/7).
  - engine: postgresql
    schema: migrations
    queries: internal/audit/adapters/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/audit/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_querier_file_name: querier.gen.go
        output_files_suffix: .gen
        emit_interface: false
  # authz (M1-27)
  - engine: postgresql
    schema: migrations
    queries: internal/authz/adapters/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/authz/adapters/postgres/sqlcgen
        sql_package: pgx/v5
  # sync (M1-16): file names end in .gen.go (docs/DECISIONS.md M1-05/7).
  - engine: postgresql
    schema: migrations
    queries: internal/sync/adapters/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/sync/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_querier_file_name: querier.gen.go
        output_files_suffix: .gen
        emit_interface: false
  # agents (M1-51)
  - engine: postgresql
    schema: migrations
    queries: internal/agents/adapters/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/agents/adapters/postgres/sqlcgen
        sql_package: pgx/v5
