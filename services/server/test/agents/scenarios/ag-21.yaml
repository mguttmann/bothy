id: AG-21
title: Context above agent.context_max_bytes
sources: ["09 16.2", "09 4.6"]
world: matrix
config:
  agent.context_max_bytes: "2048"
  agent.context_message_max_bytes: "1024"
agents:
  lotse: {agent: Lotse}
setup:
  - as: owner
    call: putChannelBehavior
    with: {channel_id: $channel.Support/Allgemein, if_match: current, merge: true, thread_require_mention: true}
    expect: {status: 200}
cases:
  - name: main
    steps:
      - as: owner
        call: createMessage
        with: {thread_id: $main.Support/Allgemein, content_md: "Long discussion"}
        expect: {status: 201}
        keep: {p1: id}
      - as: owner
        call: createThread
        with: {channel_id: $channel.Support/Allgemein, title: "Long thread", parent_message_id: $p1, first_message: {content_md: "Oldest message of the thread"}}
        expect: {status: 201}
        keep: {t1: thread.id, oldest: first_message.id}
      - repeat:
          times: 4
          steps:
            - as: owner
              call: createMessage
              with: {thread_id: $t1, content_md: "Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line."}
              expect: {status: 201}
      - as: alex
        call: createMessage
        with: {thread_id: $t1, content_md: "@lotse summarise the log. The trigger stays complete although it is long: Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line. Export log line."}
        expect: {status: 201}
        keep: {m1: id}
      - agent: lotse
        do: receive
        with: {type: agent.invocation}
        expect: {verdict: valid}
        keep: {r1: run_id}
      - agent: lotse
        do: start
        with: {run: $r1}
        expect: {status: 200}
      - agent: lotse
        do: context
        with: {run: $r1}
        expect:
          status: 200
          trigger_complete: true
          truncated_before_seq: <present>
          context_bytes: "<=2048"
          elements.0.truncated: true
          elements.0.bytes: "<=1024"
      - check: run
        id: $r1
        expect: {state: running}
