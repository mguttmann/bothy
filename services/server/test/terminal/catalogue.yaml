- id: TM-T29
  title: 'No shared locations (T13): (a) a working directory of B that A can write, and A creates `.claude/settings.json` there with a hook and an `apiKeyHelper`, then B opens the profile `claude` there; (b) a folder above a working directory of B that A can write; (c) a working directory under two session users in `host_service.claude_workdirs`, placed first in the list of B, followed by a further folder of B; (d) a `CLAUDE_CONFIG_DIR` of the profile `claude` of B that A can read; (e) an entry in the working directory of B that belongs to A; then the instance operator removes it, a periodic run passes, then they call `bothy-host doctor`; then a home of B whose check of the entries at start takes longer than `host_service.entry_scan_timeout`, and A opens during this run; (f) the program of a profile `command` that a session user can write; one that belongs to another user of the host who is neither a session user nor a trusted owner; one in a folder that belongs to such a user; with `organization` the same three cases for `host_service.claude_bin`, for example in a folder of a package manager that belongs to the account of a person with administrator rights; under Windows `host_service.claude_bin` as a `.cmd`; in addition, the program of a profile `command` that becomes writable for a session user only during operation, while A and B have sessions; (g) B sends a `workdir_index` outside their own list; a token with a `wdi` outside the list of `osu` (server bypassing the host service); (h) in a folder above a working directory of B, a `CLAUDE.md` that belongs to A; there a `CLAUDE.md` of `root` that A can write; there a folder `.claude` that belongs to A; (i) Windows 10 and Windows 11 with default permissions on `C:\`, helper under `C:\Program Files\bothy-host`, `host_service.claude_bin` under `C:\Program Files`, home and working directory of B under `C:\Users`, plus a test folder in `C:\` whose DACL carries an inherited entry before an explicit one: `doctor` before `bothy-host install`; `install` with the confirmation refused, then with it given; then A tries `mkdir C:\.git`; then a `C:\.git` that A created before the installation; (j) a working directory of B whose configured path leads, through a link owned by `root`, into a folder of A that B can traverse; above a working directory of B, a `CLAUDE.md` as a link owned by `root` to a file of A; the same working directory for A and for B outside the home folders, for B through a link, under macOS and Windows additionally in different upper and lower case; B has further working directories in their home, and one working directory of B leads through a link into a working directory of A in the home of A (mode `0700`), another one is missing; (k) `llm_credentials = personal`, the login shell of the holder sets `CLAUDE_CONFIG_DIR` to a folder outside their home, then to a link in the home that points outside, then to a link in the home that points nowhere, then to a folder in the home; (l) `llm_credentials = organization`, another `claude` in the `PATH` of the session user and of the service, B opens the profile `claude`; then `host_service.claude_bin` as a script with `#!/usr/bin/env node`, no `node` in the search list, a `node` only in the remaining `PATH` of the profile, B opens the profile `claude`'
  expected: '(a), (b), (d), (e) and (h) HD11 not passed with the name of B, B gets no session (`open_failed` with `shared_location`, running ones end with `host_policy_violation`), hook and `apiKeyHelper` never run (trace of the process starts), other session users still get sessions; with (e), B stays blocked after the removal of the entry beyond the periodic run and gets sessions again only after `bothy-host doctor`, and with the long run HD11 does not pass for B (`entry_scan_timeout` with the name of B), while A already gets a session before the end of this run; (c) HD7 not passed, the folder is missing from both lists, `pair` and `report` report the lists without it, and the index of the further folder in the reported list of B starts `claude` in exactly this folder; (f) in all cases start refused (HD10, HD11); during operation the host rejects new sessions, those of A and B end with `host_policy_violation` and `shared_location`, the report names no session user, and after the correction both open again after the next periodic run; (g) `403 terminal_denied` with `reason: profile_unknown`; with the token no PTY, `4104` with `profile_unknown`; (i) before `install` and after a refused confirmation HD11 not passed with `drive_root_writable`, start refused, the ACL of `C:\` unchanged; after the confirmation only the entry `(AD)` is missing at `C:\`, the remaining entries stand in the same order with the same control bits, and the security descriptor of every direct subfolder of `C:\` is the same before and after, including that of the test folder, which a propagation of the inheritance would have reordered or protected (2.2 item 6), HD10 and HD11 pass, `mkdir C:\.git` as A fails; with the old `C:\.git` HD11 not passed for every other session user with their name, passed after the entry is removed (T-TM-14); (j) the first two like (a), the third like (c); the folder in the home of A and the missing folder are missing only from the reported list of B (HD7, warning), the list of A keeps its folder, HD11 passes for A and B, and B opens the profile `claude` in their working directories in the home (their PTY helper resolved them); (k) in the first three cases the profile `claude` does not start (`open_failed` with `shared_location`), the profile `shell` opens; in the fourth `claude` runs with exactly this folder as `CLAUDE_CONFIG_DIR`; (l) exactly the resolved path of `host_service.claude_bin` starts, the other `claude` never (trace of the process starts); with the script without `node` in the search list the host reports no profile `claude` (HD7, warning), `doctor` warns with `auth_status_unchecked`, opening fails with `403 terminal_denied` and `reason: profile_unknown`, and the `node` from the remaining `PATH` never runs (trace of the process starts)'
