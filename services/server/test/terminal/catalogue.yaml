# SPDX-License-Identifier: Apache-2.0
# Terminal test catalogue (brief M2-48 Design note 7): for every ID of docs/spec/24-terminal.md
# section 14 and every AZ-M, ID-T and SEC-T ID that threat model section 6.7 names, where it runs
# and which ticket implemented it. `make docs` checks it with tools/docs/terminal_catalogue.py
# against chapter 24, the PLAN row M2-48, exit criterion 8 and threat model section 6.7.
#
# title and expected: for TM-T the cells of the 24 14 row; for AZ-M the cells Principal, Target,
# Action and Condition of the 07 11.1 row joined with " | ", and its Expected cell; for ID-T28 and
# SEC-T05 the Test cell and the Expected or Controls cell of the 08 and 19 test tables.
# runs: kind e2e (`e2e/<package>:scenarios/<file>.yaml` or `e2e/<package>:<TestFunc>`, relative to
# this folder), platform (a test of services/host/test/platform with os), perf (the chaos test of
# make perf) or unit (`<package dir>:<TestFunc>` for Go, `<file>.dart:<test name>` for Dart).
# The platform runs on linux execute in make check through e2e/hostplatform.
# Generated once from the chapters; edit by hand, the gate keeps it equal to them.

