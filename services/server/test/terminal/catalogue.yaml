  title: 'Standstill through HD6 (T-TM-14): (a) in a shell session on a host with `organization`, a first person logs in with a subscription; then a second person opens; (b) the second person also logs in with a subscription in their account; (c) the instance operator removes the login of the second person, locks the session user of the first only on the host, then the owner ends their assignment; (d) the instance operator takes this session user out with `bothy-host session-user remove`, whose home is readable by all; (e) `bothy-host session-user add` with the removed name; (f) `bothy-host session-user add` with a new name while the second person has a session, then the owner assigns the new name to a third person; (g) while the host service is stopped, a subscription login file lies in the account of the second person, then the host restarts; then the instance operator removes the file and calls `bothy-host restart`'
  expected: '(a) running sessions end with `host_policy_violation`, opening fails with `subscription_login_detected`, audit and `host.updated`; `reported_doctor` names, for HD6, the session user of the first person; (b) `reported_doctor` has two HD6 entries, each with one of the two names; (c) the host stays blocked, `reported_doctor` still names the first name; (d) the home of the removed session user is then accessible only to that user, the restart passes HD9 and HD6, the host no longer reports the name, the second person opens again, the first gets `403 terminal_denied` with `reason: no_session_user`; (e) rejected, because the name is bound to the first person in the state directory; (f) the session of the second person ends with `host_restarted`, after the next `report` the new name is in `reported_session_users` without any further step, and the assignment succeeds; (g) `bothy-host` does not start, but sends `report` first: `reported_doctor` names, for HD6, the name of the second person, and the console shows it with the person while the host stays disconnected; `bothy-host doctor` on the host names the same name and ends with an exit code other than 0; the service manager does not restart the host service on its own (exactly one login at the server); after `bothy-host restart` HD6 passes, and the second person opens again'
  runs:
  - kind: e2e
