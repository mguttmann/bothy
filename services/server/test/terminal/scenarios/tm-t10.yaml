      - {device: alex, do: send, session: s1, text: "setsid sleep ${marker} & nohup sleep ${marker} >/dev/null 2>&1 & printf '%s-%s\\n' ready ${marker}\n"}
      - {device: alex, do: expect_output, session: s1, expect: {output: "ready-${marker}"}}
      - check: processes
        host: r1
        user: term-alex
        marker: "${marker}"
        expect: {markers: 2}
      - host: r1
        do: exec
        run: [/opt/bothy-host/bin/bothy-host, session-user, remove, term-alex]
        expect: {exit: 0}
      - {device: alex, do: wait_close, session: s1, expect: {close: {code: 4102}}}
