# SPDX-License-Identifier: Apache-2.0
# TM-T21 of 24 14 (standstill through HD6, T-TM-14) with real host services: the seven parts in one
# case each, every case starting from a fresh world and running the parts before it, so each part
# builds on the state before (brief M2-48 Design note 9). "Instance operator" steps run as root in
# the host container, steps of a person in her shell session; "the console shows" is the server
# data the console reads (Host.doctor with session_user, the assignment in Host.session_users). A
# subscription login is the credential file the Fake-claude writes with login (24 7.4), found by
# HD6 within host_service.credential_check_interval through host_service.claude_bin.
id: tm-t21
title: Standstill through HD6 (T-TM-14)
sources: ["24 14 TM-T21", "24 2.2", "24 7.4", "24 10.3", "24 13", "R-TM-27"]
profile: default
world:
  people: [alex, sam, robin]
  owners: [sam, robin]
  hosts:
    - name: r1
      assigned_to: alex
      llm_credentials: organization
      session_users: [term-alex, term-sam, term-robin]
      assign: {alex: term-alex, sam: term-sam}
      config: {host_service.claude_bin: /opt/termsuite/bin/claude}
  grants:
    - {subject: alex, host: r1}
cases:
  - name: a
    steps:
      # (a) in a shell session on a host with organization the first person logs in with a
      # subscription; then the second person opens
      - {device: alex, do: step_up}
      - {device: alex, do: open, on: r1, session: a1, expect: {status: 201}}
      - {device: alex, do: connect, session: a1, expect: {}}
      - {device: alex, do: handshake, session: a1, expect: {}}
      - {device: alex, do: start, session: a1}
      - {device: alex, do: send, session: a1, text: "printf '%s-%s\\n' ready ${marker}\n"}
      - {device: alex, do: expect_output, session: a1, expect: {output: "ready-${marker}"}}
      - {device: sam, do: step_up}
      - {device: sam, do: open, on: r1, session: a2, expect: {status: 201}}
      - {device: sam, do: connect, session: a2, expect: {}}
      - {device: sam, do: handshake, session: a2, expect: {}}
      - {device: sam, do: start, session: a2}
      - {device: sam, do: send, session: a2, text: "printf '%s-%s\\n' ready ${marker}\n"}
      - {device: sam, do: expect_output, session: a2, expect: {output: "ready-${marker}"}}
      - {device: alex, do: send, session: a1, text: "PATH=/opt/termsuite/bin:$PATH claude login\n"}
      - {device: alex, do: expect_output, session: a1, expect: {output: "Login successful"}}
      - {device: alex, do: wait_close, session: a1, expect: {close: {code: 4100, reason: host_policy_violation}}}
      - {device: sam, do: wait_close, session: a2, expect: {close: {code: 4100, reason: host_policy_violation}}}
      - check: audit
        expect: {resource: a1, action: terminal.terminate, details: {close_reason: host_policy_violation}}
      - check: host
        host: r1
        expect: {doctor: [{check: hd6_llm_login, ok: false, code: subscription_login_detected, session_user: term-alex}]}
      - {device: sam, do: step_up}
      - {device: sam, do: open, on: r1, session: a3, expect: {status: 201}}
      - {device: sam, do: connect, session: a3, expect: {}}
      - {device: sam, do: handshake, session: a3, expect: {}}
      - {device: sam, do: start, session: a3}
      - check: session
        session: a3
        expect: {state: closed, close_reason: open_failed, close_detail: subscription_login_detected}
