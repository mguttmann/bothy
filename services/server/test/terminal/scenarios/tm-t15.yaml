  - name: without_hash_routing
    steps:
      - check: readyz
        expect: {ready: true}
      - {server: front_mode, mode: split}
      - {device: alex, do: step_up}
      - {device: alex, do: open, on: r1, session: s1, expect: {status: 201}}
      - {device: alex, do: connect, session: s1, expect: {}}
      - check: readyz
        expect: {ready: true}
      - {device: alex, do: handshake, session: s1, expect: {close: {code: 4102}}}
      - check: session
        session: s1
        expect: {state: closed, close_reason: open_failed, close_detail: open_timeout}
      - check: metric
        expect: {metric: bothy.terminal.relay.unpaired, attrs: {bothy.terminal.side: client}, rise: 1}
      - check: metric
        expect: {metric: bothy.terminal.relay.unpaired, attrs: {bothy.terminal.side: host}, rise: 1}
      - {server: front_mode, mode: hash}
      - check: readyz
        expect: {ready: true}
