# SPDX-License-Identifier: Apache-2.0
# TM-T15 of 24 14 on M2-47's two-node overlay behind its example edge (cluster.mode multi): with
# hash routing sessions are opened one after the other, each runs and is closed with
# closeTerminalSession, and the sessions are paired on both nodes without a 4102 (the relay's
# record at the end of each side shows the node). Then the TLS front splits the paths: the device
# stream lands on api and the host data connection on api-2; after terminal.open_timeout both close
# with 4102, bothy.terminal.relay.unpaired rises by one with bothy.terminal.side client and by one
# with host, the session ends open_failed with open_timeout, and /readyz stays ready on both nodes
# before, during and after (24 9, 13; brief M2-48 Design note 10). The cases change the routing of
# the shared TLS front, so they run one after the other.
id: tm-t15
title: Two api nodes with hash routing; then without hash routing
sources: ["24 14 TM-T15", "24 9", "24 13", "16 4.4", "17 4.3a"]
profile: twonode
sequential: true
world:
  people: [alex]
  hosts:
    - {name: r1, assigned_to: alex, session_users: [term-alex], assign: {alex: term-alex}}
  grants:
    - {subject: alex, host: r1}
cases:
