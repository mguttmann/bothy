          doctor: [{check: hd11_shared_locations, ok: false, code: shared_location, session_user: term-alex}]
          doctor_lacks: [{check: hd9_foreign_homes, ok: false}]
      # then the instance operator takes A out with session-user remove: the home of A is accessible
