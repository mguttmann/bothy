# SPDX-License-Identifier: Apache-2.0
#
# golangci-lint v2 configuration of the server module (docs/spec/23-quality.md
# "Component contract"). Module boundaries are not checked here but by go-arch-lint with the
# configuration generated from architecture/modules.yaml (make arch).
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gocognit
    - goconst
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unparam
  settings:
    forbidigo:
      # Only cmd/bothy reads the process environment and hands it to platform/config; modules and
      # platform packages get their values from their Config struct
      # (docs/spec/02-architecture.md "Configuration loading" item 5). Type information resolves
      # renamed imports, so `import e "os"; e.Getenv(...)` is found as well.
      analyze-types: true
      # Example functions in tests are checked as well; they are documentation that readers copy.
      exclude-godoc-examples: false
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|ExpandEnv)$
          pkg: ^os$
          msg: read configuration through platform/config; only cmd/bothy reads the environment
        - pattern: ^syscall\.(Getenv|Environ)$
          pkg: ^syscall$
          msg: read configuration through platform/config; only cmd/bothy reads the environment
        # Cmd.Environ returns the whole process environment when Cmd.Env is nil.
        - pattern: ^exec\.Cmd\.Environ$
          pkg: ^os/exec$
          msg: read configuration through platform/config; only cmd/bothy reads the environment
        # ProxyFromEnvironment configures outgoing calls from HTTP_PROXY and related variables.
        - pattern: ^http\.ProxyFromEnvironment$
          pkg: ^net/http$
          msg: read configuration through platform/config; only cmd/bothy reads the environment
        # Core S3 only (docs/spec/12-files.md "4.1", ADR 0010, ADR 0048): no batch deletion,
        # whose SDK checksum several S3-compatible services refuse, and no presigned GET, because
        # clients read only through the server (docs/DECISIONS.md M3-02/12).
        - pattern: ^s3\.Client\.DeleteObjects$
          pkg: ^github\.com/aws/aws-sdk-go-v2/service/s3$
          msg: core S3 only, no DeleteObjects (12 "4.1", ADR 0010, ADR 0048); delete objects one by one with DeleteObject
        - pattern: ^s3\.PresignClient\.PresignGetObject$
          pkg: ^github\.com/aws/aws-sdk-go-v2/service/s3$
          msg: no presigned GET, clients read only through the server (12 "4.1", R-FI-03, ADR 0048)
    depguard:
      rules:
        # Only the S3 driver imports the AWS SDK, in production and test files alike
        # (docs/spec/12-files.md "15. Tests", ADR 0010 and ADR 0048 "Confirmation", ADR 0008
        # names depguard for rules per file pattern; docs/DECISIONS.md M3-02/12). go-arch-lint
        # grants a vendor to all adapters of a module and cannot narrow it to one package.
        aws-sdk-only-in-s3-driver:
          list-mode: lax
          files:
            - $all
            - "!**/internal/files/adapters/s3/**"
            - "!**/internal/audit/adapters/s3sink/**"
          deny:
            - pkg: github.com/aws/
              desc: only internal/files/adapters/s3 and internal/audit/adapters/s3sink may import the AWS SDK (12 "15", ADR 0048, M7-22)
        # ID-T27 (docs/spec/08-identity.md "15. Tests"): every random part of a token or code of
        # identity (refresh tokens, cookies, API tokens, codes) comes from crypto/rand, so the
        # identity module may not import math/rand at all, tests included (M1-34).
        crypto-rand-only-in-identity:
          list-mode: lax
          files:
            - "**/internal/identity/**"
          deny:
            - pkg: math/rand
              desc: identity draws every random value from crypto/rand (08 ID-T27)
            - pkg: math/rand/v2
              desc: identity draws every random value from crypto/rand (08 ID-T27)
    gocognit:
      # SonarQube rule go:S3776 of the quality gate "Bothy way" (quality/sonar/quality-gate.json,
      # no new issue) reports a function above cognitive complexity 15. gocognit reports above
      # min-complexity, so make lint fails on the same functions before the analysis does.
      min-complexity: 15
    goconst:
      # Rule go:S1192 of the same gate: a string literal written three times. goconst counts per
      # package where the analysis counts per file, and it skips literals in call arguments,
      # which the analysis counts (docs/DECISIONS.md M1-07).
      min-occurrences: 3
    nolintlint:
      # Every suppression names its linter and says why.
      require-explanation: true
      require-specific: true
    sloglint:
      # docs/observability/signals.md "Logs": the message is constant English text, never built
      # from input; attributes are slog.Attr values with constant keys (the catalog keys live in
      # internal/platform/otel/attr); a function that has a context passes it on, so the
      # record carries trace_id, span_id and bothy.correlation_id (brief M1-10).
      static-msg: true
      attr-only: true
      no-raw-keys: true
      context: scope
    revive:
      rules:
        # A doc comment on every exported symbol and on every package
        # (fixed requirement "documentation in code").
        - name: exported
        - name: package-comments
  # The exclusion preset "comments" would hide missing doc comments; it stays off.
  exclusions:
    presets: []
    # Generated files are linted too, so a "// Code generated ... DO NOT EDIT." header cannot hide a
    # forbidden call. A ticket that adds generated Go code (*.gen.go, sqlcgen/) excludes the
    # linters that code cannot satisfy for those paths, never forbidigo (docs/DECISIONS.md M1-07).
    generated: disable
    rules:
      # cmd/bothy reads the environment once and passes it on as config.Sources.Env.
      - path: ^cmd/bothy/
        linters: [forbidigo]
      # Tests of repository tools (not product code; the module register excludes tools/ from the
      # architecture gate too) get pinned binaries from make through the environment
      # (GO_ARCH_LINT) and pass it on to them (docs/DECISIONS.md M1-07).
      - path: ^tools/.+_test\.go$
        linters: [forbidigo]
      # Like the analysis (sonar.test.inclusions), gocognit and goconst check product code only;
      # table rows of tests repeat literals on purpose.
      - path: _test\.go$
        linters: [gocognit, goconst]
      # Tests log arbitrary keys on purpose: they prove that the handlers of platform/otel drop
      # them and that secret values stay redacted (docs/DECISIONS.md M1-10).
      - path: _test\.go$
        linters: [sloglint]
      # Generated code, which sonar.exclusions leaves out of the analysis as well (M1-05/7);
      # tools/ci/tests/test_server_lint_config.py holds both lists together. A directory named
      # gen is not generated: the route generator in api/routes/gen is hand-written and checked
      # like the analysis checks it (docs/DECISIONS.md M1-17/15 and M1-17/31).
      - path: (\.gen|_gen|\.pb)\.go$|(^|/)(sqlcgen|generated)/
        linters: [gocognit, goconst]
      # Action ids such as auth.token.refresh look like credentials to G101: gosec skips the
      # ids of the generated identifier file (M1-25, docs/DECISIONS.md M1-25/7).
      - path: ^internal/kernel/authorize/catalog_ids_gen\.go$
        linters: [gosec]
        text: "G101:"
      # TokenResponse carries access and refresh token by contract (openapi.yaml): the strict
      # server marshals them exactly once into the response of refreshToken and
      # createExtensionSession (M1-34, docs/DECISIONS.md M1-34). G117 sees the member name only.
      - path: ^api/rest/(models|rest)\.gen\.go$
        linters: [gosec]
        text: "G117:"
      # The strict server streams the NDJSON body of exportAuditEvents and closes a ReadCloser body
      # in a defer without checking the error (M1-50); the handler hands it no ReadCloser.
      - path: ^api/rest/(models|rest)\.gen\.go$
        linters: [errcheck]
        text: "closer.Close"
      # Query names and SQL of refresh_tokens contain "token"; G101 reads them as credentials. The
      # queries hold no secret: tokens are bound as HMAC parameters (M1-34).
      - path: ^internal/identity/adapters/postgres/sqlcgen/refresh\.sql\.go$
        linters: [gosec]
        text: "G101:"
      # The same for api_tokens (M1-44): the lookup binds token_hash, never the token itself.
      - path: ^internal/identity/adapters/postgres/sqlcgen/apitokens\.sql\.go$
        linters: [gosec]
        text: "G101:"
      # The same for passkey_credentials (M1-40): the rows hold public keys and counters only.
      - path: ^internal/identity/adapters/postgres/sqlcgen/passkey_credentials\.sql\.go$
        linters: [gosec]
        text: "G101:"
      # oapi-codegen writes capitalized error strings ("Header parameter ... is required"); only
      # this check of staticcheck is left out of its output (docs/DECISIONS.md M1-17/27).
      - path: ^api/(rest|routes/internal/fixture/rest)/rest\.gen\.go$
        linters: [staticcheck]
        text: "^ST1005:"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/OWNER/bothy/services/server
