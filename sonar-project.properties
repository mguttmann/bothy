# SPDX-License-Identifier: Apache-2.0
#
# SonarQube analysis of the product code, identical for the local Community Build and
# SonarQube Cloud (docs/quality/sonarqube-local.md). Host, token, organization and the
# Cloud project key come from `make sonar` (SONAR_HOST_URL, SONAR_TOKEN,
# SONAR_ORGANIZATION, SONAR_PROJECT_KEY); this file holds no secrets.
# Repository tools (tools/) are covered by ruff, mypy, bandit and pytest instead.

sonar.projectKey=bothy
sonar.projectName=Bothy
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Scan from the root and include only product directories, so that a directory that
# does not exist yet never breaks the scan. Generated code is excluded: every generated
# Go file ends in .gen.go (docs/DECISIONS.md, M1-05/7) and sqlc output lives in sqlcgen/;
# fixtures under testdata/ are test input, not product code. A directory named gen is not
# excluded: the route generator in services/server/api/routes/gen is hand-written
# (docs/DECISIONS.md, M1-17/15). The Pigeon output of the plugin members (*.g.swift, *.g.kt,
# *.g.cpp, *.g.h) is generated too; SwiftPM test targets live under Tests/ (D-M4-10-7) and
# Android instrumented tests under androidTest/ (D-M5-01-8). The loader template
# apps/console/web/flutter_bootstrap.js is no JavaScript until `flutter build web` replaces its
# placeholders (D-M6-02-13).
sonar.sources=.
sonar.inclusions=services/**,apps/**,packages/**,sdk/**,plugins/**
sonar.exclusions=**/node_modules/**,**/build/**,**/.dart_tool/**,**/generated/**,**/*.g.dart,**/*.freezed.dart,**/*.drift.dart,**/*.steps.dart,**/*.gen.go,**/*.gen.yaml,**/*_gen.go,**/*.pb.go,**/testdata/**,**/sqlcgen/**,**/*.g.swift,**/*.g.kt,**/*.g.cpp,**/*.g.h,plugins/grafana-bothy-live/.config/**,plugins/grafana-bothy-live/src/queries.gen.ts,apps/console/web/flutter_bootstrap.js
sonar.test.inclusions=**/*_test.go,**/test/**,services/server/perf/**,**/tests/**,**/Tests/**,**/androidTest/**,**/*.test.ts,**/*.test.tsx,**/*_test.dart,**/integration_test/**

# Out of the coverage measure: test helper packages under
# internal/<module>/adapters/<module>test (docs/spec/02-architecture.md "6. Code layout") and
# internal/platform/<package>/<package>test, which only tests of other packages import and Go
# coverage does not count for them (docs/DECISIONS.md M3-01/20, M1-20/14), and the two
# configuration files of the TypeScript SDK, which are code for Sonar but no test can run
# (docs/DECISIONS.md M2-23/11), and the generator scripts under packages/<member>/tool/, which the
# member's tests import in-process but `flutter test --coverage` records only for lib/
# (docs/DECISIONS.md D-M4-06-8), and the native platform code of the plugin members under
# packages/<member>/darwin|android|windows/, whose own test suites run on the platform runners
# (platform-tests.json) and write no report this Linux scan can read (docs/DECISIONS.md D-M4-10-7),
# and the drift table definitions under packages/<member>/lib/src/tables/, which only the drift
# generator reads (docs/DECISIONS.md D-M4-12-11), and the test helper libraries
# packages/<member>/lib/testing.dart: only tests import them, and two members have one, so the
# relative path lib/testing.dart of their lcov reports resolves to no file (docs/DECISIONS.md PL/5),
# and the runners and build tools of the apps under apps/<app>/macos|windows/ and apps/<app>/tool/,
# for the reasons of D-M4-10-7 and D-M4-06-8 (docs/DECISIONS.md D-M4-18-16),
# and the Windows and macOS files of the host service (services/host/**/*_windows.go and
# *_darwin.go), which compile only on the runners of the host platform suite, for the reason of
# D-M4-10-7 (docs/DECISIONS.md D-M2-42-30),
# and the panel plugin's configuration files, its colour lint rule and its query generator, which
# tests run as tools (ESLint, a child process), not through the coverage of src/
# (docs/DECISIONS.md D-M7-25-7); its .config/ (scaffold) and queries.gen.ts (generated) are
# excluded above.
sonar.coverage.exclusions=services/server/internal/*/adapters/*test/**,services/server/internal/platform/*/*test/**,sdk/typescript/vitest.config.ts,sdk/typescript/eslint.config.mjs,packages/*/tool/**,packages/*/lib/src/tables/**,packages/*/darwin/**,packages/*/android/**,packages/*/windows/**,packages/*/lib/testing.dart,apps/*/macos/**,apps/*/windows/**,apps/*/tool/**,services/host/**/*_windows.go,services/host/**/*_darwin.go,plugins/grafana-bothy-live/*.js,plugins/grafana-bothy-live/*.mjs,plugins/grafana-bothy-live/*.ts,plugins/grafana-bothy-live/eslint-rules/**,plugins/grafana-bothy-live/scripts/**

# Coverage reports written by `make test`.
sonar.go.coverage.reportPaths=services/server/coverage.out,services/host/coverage.out
sonar.python.coverage.reportPaths=sdk/python/coverage.xml,plugins/*/coverage.xml
sonar.javascript.lcov.reportPaths=sdk/typescript/coverage/lcov.info,plugins/grafana-bothy-live/coverage/lcov.info
# Dart is analysed by SonarQube Cloud only (the Community Build has no Dart analyzer). One
# report per member of the Dart workspace (tools/arch-check/rules.yaml); generated Dart files
# are excluded above (docs/DECISIONS.md D-M4-01-4).
sonar.dart.lcov.reportPaths=apps/client/coverage/lcov.info,apps/console/coverage/lcov.info,packages/design_system/coverage/lcov.info,packages/l10n/coverage/lcov.info,packages/domain/coverage/lcov.info,packages/api_client/coverage/lcov.info,packages/auth/coverage/lcov.info,packages/device_key/coverage/lcov.info,packages/local_store/coverage/lcov.info,packages/sync_engine/coverage/lcov.info,packages/admin_ui/coverage/lcov.info,packages/bothy_viz/coverage/lcov.info,packages/bothy_viz/harness/coverage/lcov.info,packages/bothy_noise/coverage/lcov.info,packages/terminal_ui/coverage/lcov.info

# Fail the scan when the quality gate fails (quality/sonar/quality-gate.json).
sonar.qualitygate.wait=true
