#
# Accepted advisories of the Semgrep project (tools/semgrep/uv.lock, #755): packages that
# Semgrep pins exactly or in a narrow range, so no fixed version can be locked without breaking
# its requirements. Semgrep is a gate tool and never ships. Each entry names one advisory, why
# the gate does not reach the vulnerable code, and an expiry that asks for a new check
# (tools/ci/tests/test_osv_ignores.py).

[[IgnoredVulns]]
id = "GHSA-5h93-6whr-6q8j"
ignoreUntil = 2027-02-28
reason = "mcp 1.29.0, which Semgrep 1.180.0 pins exactly (mcp==1.29.0) for its subcommand `semgrep mcp`. The gate runs only `semgrep scan` and `semgrep --test` over the repository's own files (Makefile, target semgrep) and never starts the MCP client or server of the SDK, so the transport, OAuth and schema code of the advisory does not run. Not shipped. Re-check when Semgrep raises its mcp pin; until then the expiry asks for a new check (#755)."

