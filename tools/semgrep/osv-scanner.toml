[[IgnoredVulns]]
id = "GHSA-53pm-wgxf-c6qf"
ignoreUntil = 2027-02-28
reason = "wcmatch 8.5.2, which Semgrep 1.180.0 pins (~=8.3) for its path filters. The patterns and the names it matches are the repository's own (.semgrepignore, the paths of the rules and the tracked files), never untrusted input; the fix exists only in wcmatch 11, outside Semgrep's range. Not shipped. Re-check when Semgrep allows wcmatch 11 (#755)."
