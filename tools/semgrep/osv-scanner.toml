[[IgnoredVulns]]
id = "GHSA-mf5v-w3w3-f6cg"
ignoreUntil = 2027-02-28
reason = "opentelemetry-api 1.37.0, which Semgrep 1.180.0 pins (~=1.37.0) for its own tracing. The gate runs with --metrics=off and without an OTLP endpoint, and Semgrep parses no traceparent or tracestate header of a request it serves (it serves none). Not shipped. Re-check when Semgrep raises its OpenTelemetry pins (#755)."

