# SPDX-License-Identifier: Apache-2.0
#
# Semgrep, the pattern gate of `make semgrep` (R-QA-05), in a locked environment of its own
# (development only, not distributed). It is not part of tools/pyproject.toml because Semgrep
# runs on Python 3.12 while the tools project runs on 3.14 (docs/quality/toolchain.md). The
# Makefile starts it through `uv run --project tools/semgrep --locked`, so every dependency
# comes from uv.lock with its hashes (#755); Renovate raises it with the tools (pep621 + uv).

[project]
name = "bothy-semgrep"
version = "0.0.0"
description = "Semgrep for the repository gates (development only, not distributed)."
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
  "semgrep==1.180.0",
]

[tool.uv]
package = false
