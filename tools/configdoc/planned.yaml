    etappe: M2
  - match: agent.invocation_token_ttl  # M1-32
    etappe: M1
  - match: agent.jwks_max_age  # M1-32
    etappe: M1
  - match: "api."  # M1-03, M1-18, M1-31
    etappe: M1
