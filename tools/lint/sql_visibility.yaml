# SPDX-License-Identifier: Apache-2.0
#
# Configuration of the gate `sql-visibility` (tools/lint/sql_visibility.py, AZ-P12; 07 "Query
# pattern" rule 1). Every reading sqlc query on a content table carries
# `channel_id = ANY($visible)` or `space_id = ANY($visible_spaces)`, unless it stands under
# `exceptions` with a category and a reason. A new exception needs review: it says why the
# query cannot carry the predicate, never only that it does not.

# The data model chapter whose table headings every content table must name.
data_model: docs/spec/03-data-model.md

# Content tables in their final state, also tables of later milestones, so a new query is
# covered from its first commit.
content_tables:
  - spaces
  - channels
  - channel_skill_bindings
  - project_bindings
  - dm_participants
  - forum_tags
  - threads
  - thread_tags
  - agent_sessions
  - messages
  - message_revisions
  - mentions
  - reactions
  - pins
  - message_templates
  - files
  - file_thumbnails
  - message_attachments
  - file_text_extracts
  - runs
  - run_steps
  - run_followups
  - message_components
  - interactions
  - read_states
  - drafts
  - event_log

# Categories: authorize_resolution (resolves a resource path for authorize), after_authorize
# (loads a single resource after authorize allowed it), system_job (job without principal),
# log_tail (the log tail reads every event; delivery checks authorize per receiver), thread_scope
# (a list over a thread-scoped table without channel_id, such as runs: reads the active runs,
# resolves their threads through the chat port, keeps only threads whose channel is in
# Scope.ChannelIDs and authorizes each row; docs/DECISIONS.md D-M2-05-9).
exceptions:
  - query: agents.ThreadSessions
    category: after_authorize
    reason: "listAgentSessions reads the sessions of the one thread whose agent_session.read authorize allowed; agent_sessions has no channel_id, the thread was checked first (M2-12); the run context of runs reads the session row of the one run whose run.context.read authorize allowed among them (agents.RunSessions, M2-13)"
  - query: agents.CurrentSession
    category: after_authorize
    reason: "the current session of the one thread whose agent_session.bind authorize allowed or whose run invocation agent.invoke decided; nothing of the row leaves before that decision (M2-12)"
  - query: agents.LockCurrentSession
    category: after_authorize
    reason: "locks the current session of the one thread whose agent_session.reset or agent_session.bind authorize allowed, or whose run invocation or run.start runs decided (09 9.1, 9.2, 9.4; M2-12)"
  - query: agents.LockSessions
    category: after_authorize
    reason: "locks the session rows of a bind or a report in ascending id after authorize allowed the operation on their threads; a take-over target is a thread whose second-target check authorize passed (07 4.2, M2-12)"
  - query: agents.CurrentByRef
    category: authorize_resolution
    reason: "finds the thread in which the reference of a bind or report is current; for agent_session.bind it resolves the second target TargetThreadID that authorize checks (07 4.2, 09 9.4); only its id and thread leave as a conflict reason (M2-12)"
  - query: agents.LatestByRef
    category: after_authorize
    reason: "reads the cost baseline of the reference of a bind that authorize allowed; only the two amounts and the currency are used, nothing else of the row leaves (22 section 9 step 7, M2-12)"
  - query: agents.LatestInThreadByRef
    category: after_authorize
    reason: "the most recent row of a reference in the one thread whose run.start runs accepted, to attach the starting run (09 9.1, M2-12)"
  - query: chat.GetChannel
    category: authorize_resolution
    reason: "resolves one channel (space, archive state, operator) for authorize; the use case returns it only after channel.read allowed it; for chat.TriggerFacts (M2-05) it gives the trigger facts inside the unit of work of a message whose message.create authorize allowed, and runs decides with agent.invoke"
  - query: chat.LockChannel
    category: after_authorize
    reason: "locks the one channel a change authorize allowed (03 section 6.3)"
  - query: chat.GetChannelBehavior
    category: after_authorize
    reason: "the behaviour of the one channel whose channel.behavior.read, channel.behavior.update or agent.config.read authorize allowed (M2-02)"
  - query: chat.LockProjectBinding
    category: after_authorize
    reason: "locks the binding of the one forum whose channel.project.bind authorize allowed (M2-03)"
  - query: chat.ListAllChannels
    category: authorize_resolution
    reason: "the structure source of authz: every non-dm channel with its space and operator, from which Scope and authorize compute visibility (07 section 7.2)"
  - query: chat.ActiveChannelKeys
    category: after_authorize
    reason: "ids and sort keys of the channels of the one space whose channel.create or channel.reorder authorize allowed; no content leaves the use case"
  - query: chat.ShareChannel
    category: after_authorize
    reason: "holds the one channel whose preference write authorize allowed (M3-18)"
  - query: chat.ChannelIDsOfSpace
    category: after_authorize
    reason: "ids of the channels of the one space whose archive authorize allowed, for the cleanup of notification preferences (M3-18)"
  - query: chat.ListForumTags
    category: after_authorize
    reason: "the tags of the one forum channel authorize allowed (channel.read or forum_tag.manage)"
  - query: chat.GetForumTag
    category: after_authorize
    reason: "one tag of the channel authorize allowed; a tag of another channel answers not_found"
  - query: chat.LockInheritingChannels
    category: after_authorize
    reason: "locks the inheriting channels of the one space whose operator change authorize allowed (03 section 6.3)"
  - query: chat.ServedChannels
    category: authorize_resolution
    reason: "the channels an agent serves, the facts of invariant I1 that authz.VerifyInvariants checks (07 section 4.4, 10 section 5.2)"
  - query: chat.DefaultOperatedSpaces
    category: authorize_resolution
    reason: "the spaces whose default operator is an agent, facts of invariant I1 (07 section 4.4, 03 section 6.4)"
  - query: chat.GetSpace
    category: authorize_resolution
    reason: "resolves one space for authorize; the use case returns it only after space.read allowed it"
  - query: chat.LockSpace
    category: after_authorize
    reason: "locks the one space a change authorize allowed (03 section 6.3)"
  - query: chat.LockActiveSpaces
    category: after_authorize
    reason: "locks the ids of the global space order after space.create or space.reorder (owner actions on the instance) allowed it; no content leaves the use case"
  - query: chat.ActiveSpaceKeys
    category: after_authorize
    reason: "ids and sort keys of the global space order after space.create or space.reorder allowed it; no content leaves the use case"
  - query: chat.SpaceIDs
    category: authorize_resolution
    reason: "the structure source of authz: every space id, from which Scope computes the visible spaces (07 section 7.2)"
  - query: chat.ShareSpace
    category: after_authorize
    reason: "holds the one space whose preference write authorize allowed (M3-18)"
  - query: chat.ListThreadTags
    category: after_authorize
    reason: "the tags of threads that getThread or listChannelThreads returned after authorize allowed them"
  - query: chat.GetThread
    category: authorize_resolution
    reason: "resolves one thread (channel, operator) for authorize; the use case returns it only after thread.read allowed it"
  - query: chat.GetThreadByParentMessage
    category: authorize_resolution
    reason: "resolves the one thread that started from a message the caller wrote itself (the replay of an incoming webhook post, M2-27); apps authorizes message.create on it before it answers"
  - query: chat.LockThread
    category: after_authorize
    reason: "locks the one thread a change authorize allowed (03 section 6.3)"
  - query: chat.ShareThread
    category: after_authorize
    reason: "holds the one thread against a move while sync copies its channel after authorize allowed the write (M1-61)"
  - query: chat.ListThreadsByActivity
    category: after_authorize
    reason: "the threads of the one channel channel.read allowed (listChannelThreads); a thread is visible exactly when its channel is (07 section 7.2, limit)"
  - query: chat.ListThreadsByCreated
    category: after_authorize
    reason: "the threads of the one channel channel.read allowed (listChannelThreads); a thread is visible exactly when its channel is (07 section 7.2, limit)"
  - query: files.GetFile
    category: authorize_resolution
    reason: "resolves one file by its id (scope channel, uploader, purpose) for authorize; getFile returns it only after file.read allowed it (M3-03)"
  - query: files.GetAttachmentByFile
    category: authorize_resolution
    reason: "resolves where one file is attached (message, thread and channel copies) by its id for the file.read descriptor; getFile, downloads, tickets and transcripts serve the file only after file.read allowed it on that path; MessageOf and recordFileChange reuse it (M3-07)"
  - query: files.LockAttachTargets
    category: after_authorize
    reason: "locks the files the author listed in one message after message.create with upload was allowed, keyed by those ids and checked against the author (12 section 10, M3-07)"
  - query: files.AttachedFileIDs
    category: after_authorize
    reason: "the attachment rows of the same listed files inside the same Attach after their lock; only ids leave the use case (M3-07)"
  - query: files.ListMessageAttachments
    category: after_authorize
    reason: "the attachments of messages the caller already read with message.read (ForMessages, M3-07)"
  - query: files.ListThumbnailsOfFiles
    category: after_authorize
    reason: "the thumbnails of the files of one Attach or ForMessages call, whose messages were already allowed (M3-07)"
  - query: files.LockMessageAttachmentFiles
    category: after_authorize
    reason: "locks the files of the one message whose message.delete authorize allowed (DeleteForMessage, M3-07)"
  - query: files.ListAttachmentStates
    category: after_authorize
    reason: "the states of the attachments of one message whose creation or run was already decided (Pending, M3-07); only a boolean leaves the use case"
  - query: files.GetFileForDelivery
    category: authorize_resolution
    reason: "resolves one file by its id (scope channel, uploader, purpose, states) for authorize; downloads, tickets and transcripts serve it only after file.read allowed it (M3-05)"
  - query: files.GetThumbnail
    category: after_authorize
    reason: "one thumbnail of the one file file.read allowed, by file id and variant (M3-05)"
  - query: files.QuotaUsedBytes
    category: after_authorize
    reason: "the sum of the sizes of the caller's own files for file.quota_bytes_per_principal after file.upload was allowed; keyed by the uploader, only a number (M3-03)"
  - query: files.CountOpenSessions
    category: after_authorize
    reason: "the number and earliest expiry of the caller's own open upload sessions for file.upload_max_open_sessions after file.upload was allowed; keyed by the uploader (M3-03)"
  - query: files.GetSession
    category: authorize_resolution
    reason: "resolves the caller's own upload session by file id and uploader for authorize on its scope channel; an unknown and a foreign id answer the same 404 (M3-03)"
  - query: files.LockSessionForUpdate
    category: after_authorize
    reason: "locks the caller's own upload session by file id and uploader for abort and completion (03 section 6.3, M3-03)"
  - query: files.LockSessionForShare
    category: after_authorize
    reason: "holds the caller's own upload session by file id and uploader while a part is confirmed (M3-03)"
  - query: files.GetScanTarget
    category: system_job
    reason: "the job files.scan reads the one file and session it was inserted for by id, without a principal; it serves nothing to a reader (M3-04)"
  - query: files.LockScanTarget
    category: system_job
    reason: "the job files.scan locks the one file and session it scans by id, without a principal (03 section 6.3, M3-04)"
  - query: files.CountAwaitingScan
    category: system_job
    reason: "the health monitor of the worker counts the files awaiting the scan for bothy.file.scan.queue; only a number, no content (M3-04)"
  - query: files.GetImageFile
    category: system_job
    reason: "the job files.thumbnail reads the one file it was inserted for by id, without a principal; it serves nothing to a reader (M3-06)"
  - query: files.LockImageFile
    category: system_job
    reason: "the job files.thumbnail locks the one file it processes by id, without a principal (03 section 6.3, M3-06)"
  - query: files.ListFileThumbnails
    category: after_authorize
    reason: "the thumbnails of the one file getFile returns after file.read allowed it, or of the one file the job files.thumbnail processes (M3-06)"
  - query: messaging.ListMentions
    category: after_authorize
    reason: "the mentioned principals of the one message authorize allowed (Message.mention_ids)"
  - query: messaging.GetMessage
    category: authorize_resolution
    reason: "resolves one message (thread, channel) for authorize; the use case returns it only after message.read allowed it"
  - query: messaging.ListContextWindow
    category: after_authorize
    reason: "the run context window of the one thread of the run whose run.context.read authorize allowed, or the main thread of its parent message in the same channel; every row passes message.read in filter mode before it leaves (09 4.6, M2-13)"
  - query: messaging.GetMessageByClientID
    category: after_authorize
    reason: "the idempotency lookup of the author's own message after message.create allowed the write in the thread (04 section 5.1 point 4)"
  - query: messaging.ListPersonalTemplates
    category: after_authorize
    reason: "the personal templates of the caller after self.read allowed it; a personal template has no channel (03 message_templates)"
  - query: messaging.CountPersonalTemplates
    category: after_authorize
    reason: "the number of personal templates of the caller for template.max_per_scope after the create was allowed; only a count"
  - query: messaging.CountChannelTemplates
    category: after_authorize
    reason: "the number of templates of the one channel template.manage allowed, for template.max_per_scope; only a count"
  - query: sync.ListConsumerCursors
    category: system_job
    reason: "the lag gauges of the event consumers (head of the log only), no principal"
  - query: sync.OldestEventAfter
    category: system_job
    reason: "occurred_at of the oldest pending event for bothy.event.consumer.pending_age, no principal"
  - query: sync.HeadSeq
    category: log_tail
    reason: "the head of the log (max seq), no content"
  - query: sync.MinRetainedSeq
    category: log_tail
    reason: "the smallest retained seq for resync_required (04), no content"
  - query: sync.EventsAfter
    category: log_tail
    reason: "the log tail reads every event; delivery checks authorize per receiver (07 section 8.1)"
  - query: sync.EventBySeq
    category: system_job
    reason: "one event by its seq for the webhook delivery job (M2-26); webhook_out.deliver authorizes it for the app of the subscription before it leaves"
  - query: sync.LockResourceEvents
    category: after_authorize
    reason: "the stored events of the one resource whose deletion authorize allowed, locked for the redaction (03 section 6.5)"
  - query: sync.GetReadState
    category: after_authorize
    reason: "the caller's own read state of the one thread authorize allowed"
  - query: sync.LockReadState
    category: after_authorize
    reason: "the caller's own read state of the one thread authorize allowed, locked for markThreadUnread"
  - query: sync.ListReadStatesOfChannel
    category: after_authorize
    reason: "the caller's own read states of the one channel, read only when the channel is in the visible set of Scope; each row then passes thread.read"
  - query: chat.LocateThreads
    category: authorize_resolution
    reason: "resolves the channel, space and state of a batch of threads named by id (chat.Threads.Locate) for the thread_scope lists of runs, which keep only threads whose channel is in Scope.ChannelIDs and then authorize each row (M2-05)"
  - query: runs.GetRun
    category: authorize_resolution
    reason: "getRun loads the one run first, because its thread and triggered_by form the descriptor of authorize run.read; a denied run gives the same not_found as a missing one (02 9.2, M2-05)"
  - query: runs.GetRunBinding
    category: authorize_resolution
    reason: "the authentication of a request with the Invocation-Token header loads the one run named by the verified token by primary key, before any authorize, to bind the request to the person who triggered it (07 SR9, 07 7.4 rule 1 exception resolution for authorize); nothing of the row leaves the server (M2-14)"
  - query: runs.LockRun
    category: system_job
    reason: "the delivery check and the job runs.queued_expiry lock the one run named by the event or the job before agent.invoke decides for its trigger; nothing of the row leaves before that decision (M2-08)"
  - query: runs.LockRunForAnswer
    category: after_authorize
    reason: "the answer check reads the one run an agent names in run_id by primary key inside the unit of its authorized message.create, under a shared lock so the run cannot end before the answer commits; only the verdict leaves the module, and a run of another thread or agent answers like an unknown one (M2-19 design note 4)"
  - query: runs.LockHeldRunsOfMessage
    category: system_job
    reason: "the subscriber of files.FileFinalized locks the queued held runs of the finalized file's message, without a principal, to release their agent.invocation; nothing of the rows leaves before the delivery decides agent.invoke (M3-07)"
  - query: runs.LockActiveRunsByStarter
    category: system_job
    reason: "the in-transaction subscriber of authorize.AccessChanged locks the active runs started by the principals whose access the committed change removes, keeps those whose channel they lost and sends their agent run.cancel_requested; nothing of the rows leaves the server (R-SY-11, M2-09)"
  - query: runs.LockActiveRunsByAgent
    category: system_job
    reason: "the in-transaction subscriber of agents.AgentDisabled locks the active runs of the disabled agent and ends them cancelled; nothing of the rows leaves the server (09 2.1, M2-09)"
  - query: runs.LockActiveRunsByThreads
    category: system_job
    reason: "the in-transaction subscriber of chat.ChannelReadOnlySet locks the active runs of the threads of a channel that became read-only and sends their agent run.cancel_requested; nothing of the rows leaves the server (05 channel.read_only.set, M8-03)"
  - query: runs.OrphanCandidates
    category: system_job
    reason: "the job runs.stall_check reads the started active runs without a principal and fails the interrupted and stale ones; nothing of the rows leaves the server (09 5.5, M2-09)"
  - query: runs.EarlierSessionRun
    category: after_authorize
    reason: "the run context reads, for the one run whose run.context.read authorize allowed, whether an earlier started run of its thread used its session row and the triggering message of the latest such run; only a boolean and an id leave (09 4.6, M2-13)"
  - query: runs.DeliveredFollowupsOfSession
    category: after_authorize
    reason: "the run context reads which of its already selected messages a run of the same session in the one thread of the run whose run.context.read authorize allowed received as follow-ups; only message ids leave (09 4.6, M2-13)"
  - query: runs.SessionUsed
    category: after_authorize
    reason: "asks whether a run of the one thread whose invocation agent.invoke allowed already used a session row (the session mode of 09 9.1); only the boolean leaves, never a row (M2-12)"
  - query: runs.LockActiveRunForReport
    category: authorize_resolution
    reason: "the declared source agents.RunSource locks the active run of the one thread of agent_session.report; its agent and session row form the descriptor that authorize decides agent-self on, and a run of another agent gives the not_found of an unknown thread (09 4.7, M2-12)"
  - query: runs.ActiveRunOfThread
    category: after_authorize
    reason: "the active run of the one thread whose message the acceptance handles (09 3.4) or whose run Open found taken; runs has no channel_id, the thread was checked first (D-M2-05-9)"
  - query: runs.ThreadRuns
    category: after_authorize
    reason: "the runs of the one thread listThreadRuns found visible through Scope(run.read); runs has no channel_id, and each row is authorized with run.read (D-M2-05-9)"
  - query: runs.ActiveRuns
    category: thread_scope
    reason: "listActiveRuns and the snapshot read the active runs in batches, resolve their threads through chat.Threads.Locate, keep only threads whose channel is in Scope.ChannelIDs and authorize each row with run.read; runs has no channel_id (D-M2-05-9)"
  - query: runs.ActiveCounts
    category: system_job
    reason: "the gauge bothy.run.active of the worker counts the active runs per agent and state without a principal; only numbers, no content (M2-05)"
  - query: runs.StepCounts
    category: after_authorize
    reason: "step_count of the runs of one page, each of which run.read allowed; run_steps has no channel_id (D-M2-05-9)"
  - query: runs.Steps
    category: after_authorize
    reason: "one page of steps of the one run whose run.read authorize allowed (listRunSteps); run_steps has no channel_id (D-M2-05-9)"
  - query: runs.AllSteps
    category: after_authorize
    reason: "every step of the one run whose run.read authorize allowed (getRun); run_steps has no channel_id (D-M2-05-9)"
  # M2-15: the components and interactions of cards. message_components and interactions have no
  # channel_id; every read names the components of card messages that authorize already checked or
  # that messaging loaded for an event of the same transaction, the one component or interaction
  # whose path authorize then decides, or the cards a job or the end of a run names (07 7.4 rule 1,
  # M2-15 design note 7).
  - query: messaging.LockCardMessage
    category: after_authorize
    reason: "locks the card of a component change after runs authorized interaction.create or component.update on its path, or for the job runs.component_expiry and the end of a run; it returns facts, never content (M2-15)"
  - query: runs.ComponentsOfMessages
    category: after_authorize
    reason: "the components of the card messages of one answer, page or event, each of which message.read allowed or messaging loaded for an event of the same transaction, whose receive action sync checks per reader (M2-15 design note 7)"
  - query: runs.GetComponent
    category: authorize_resolution
    reason: "loads the one component of createInteraction or updateComponent first, because its card's thread and author form the descriptor of authorize; a denied component gives the same not_found as a missing one (02 9.2, M2-15)"
  - query: runs.LockComponent
    category: after_authorize
    reason: "locks the one component whose interaction.create or component.update authorize decided on its path in the same unit of work (M2-15)"
  - query: runs.LockSingleUseGroup
    category: after_authorize
    reason: "the single-use rule of 03: the active single_use components of the one card whose component authorize decided, locked in ascending id (M2-15)"
  - query: runs.LockSingleUseSet
    category: after_authorize
    reason: "the single_use components of the one card whose component.update authorize allowed, locked for a state change (M2-15)"
  - query: runs.LockDueComponents
    category: system_job
    reason: "the job runs.component_expiry locks the due active components of the one card it names, without a principal; nothing of the rows leaves the server except through message.updated (M2-15)"
  - query: runs.NextComponentExpiry
    category: system_job
    reason: "the job runs.component_expiry reads the next expires_at of the one card it names to schedule itself again; only a time (M2-15)"
  - query: runs.ActiveComponentMessagesOfRun
    category: system_job
    reason: "the end of a run reads the cards with active components of that run to disable them; only message ids, no content (M2-15)"
  - query: runs.LockActiveRunComponents
    category: system_job
    reason: "the end of a run locks the active components of that run on one of its cards to disable them; nothing of the rows leaves the server except through message.updated (M2-15)"
  - query: runs.LockRunShared
    category: after_authorize
    reason: "the share lock of the run of a new card of the author, whose message.create authorize allowed; the row is only compared with the author and the thread (M2-15)"
  - query: runs.InteractionByClientID
    category: after_authorize
    reason: "the idempotency lookup of the principal's own (principal, client_interaction_id), 04 5.1; the answer follows only after message.read on the stored interaction's card (M2-15)"
  - query: runs.GetInteraction
    category: authorize_resolution
    reason: "loads the one interaction of respondToInteraction or of a delivery first, because its card forms the descriptor of authorize or the trigger of agent.invoke; a denied interaction gives the same not_found as a missing one (M2-15)"
  - query: runs.LockInteraction
    category: after_authorize
    reason: "locks the one interaction whose interaction.respond authorize allowed, or the one a delivery handles after agent.invoke decided (M2-15)"
  - query: runs.RunOfInteraction
    category: after_authorize
    reason: "the run an interaction opened, for the representation of that interaction to the principal authorize allowed; only a run id (M2-15)"
  - query: runs.PatchSteps
    category: after_authorize
    reason: "the steps of the one run whose run.update authorize allowed and whose row the patch locked; the details stay in the server apart from the summary step (M2-10)"
  - query: runs.ActiveRunsOfThreads
    category: after_authorize
    reason: "the delivery reads of the live box: the active runs of threads the gateway checked with gateway.focus; every recipient passes run.read before a frame is sent (07 7.4 rule 1, loading a checked resource; M2-10)"
  - query: messaging.LastAnchorBefore
    category: system_job
    reason: "the consumer push reads the newest run anchor before an agent message of the one thread of the event, like the log tail; every hint is checked with push.deliver before it is decided and sent (M3-19 design note 5)"
  - query: messaging.AnchorOfRun
    category: system_job
    reason: "the consumer push reads the anchor of the one run of a run.state_changed, like the log tail; every hint is checked with push.deliver (M3-19 design note 5)"
  - query: messaging.LastAgentMessageBefore
    category: system_job
    reason: "the consumer push reads the last agent message of the one run that ended, to point its hint at it; nothing of the row but its id and position leaves, and every hint is checked with push.deliver (M3-19 design note 5)"
  - query: messaging.NewestMessage
    category: system_job
    reason: "the flush job of a bundling window reads the newest message of the one thread of the window for its pointer; the hint is checked with push.deliver first (M3-19 design note 9 d)"
  - query: sync.ResourceEvents
    category: log_tail
    reason: "the consumer push reads the retained events of one run, message or thread in commit order, like the log tail; every hint is checked with push.deliver before it is decided and sent (M3-19 design notes 5 and 16)"
  - query: sync.PersonalEvents
    category: log_tail
    reason: "the badge sync job reads the read_state.updated events of its one person, like the log tail; only thread ids that no longer count leave, and the person is checked as an active human (M3-19 design note 16)"
  - query: sync.ReadPositionsOfThread
    category: system_job
    reason: "the flush job reads the stored read positions of the people the consumer push selected for one thread; only numbers leave, and the hint is checked with push.deliver (M3-19 design note 9 d)"
  - query: sync.ReadPositionsOfUser
    category: system_job
    reason: "the badge count reads one person's read positions in the threads of its visible channels; every counted thread is confirmed with push.deliver (M3-19 design note 16)"
  - query: runs.LockActiveRunOfThread
    category: after_authorize
    reason: "the acceptance locks the active run of the one thread whose message.create authorize allowed, before the trigger decision; runs has no channel_id, and the follow-up is authorized with run.followup.create (D-M2-05-9, M2-11)"
  - query: runs.LockOpenFollowups
    category: after_authorize
    reason: "the end of a run locks the open follow-ups of the one run it is ending in the same unit of work; run_followups has no channel_id, and nothing of the rows leaves the server (07 7.4 rule 1, M2-11)"
  - query: runs.RunFollowups
    category: after_authorize
    reason: "the follow-ups of the one run whose run.read (getRun, live box), run.update (patch) or start/finish use case authorized it; run_followups has no channel_id (07 7.4 rule 1, M2-11)"
  - query: runs.FollowupStatesOf
    category: after_authorize
    reason: "the states of the named follow-ups of the one run whose run.update authorize allowed and whose row the patch or the delivery locked; run_followups has no channel_id (07 7.4 rule 1, M2-11)"
  - query: runs.LockFollowup
    category: after_authorize
    reason: "one follow-up of the one run a patch or a deletion locked after its authorization; run_followups has no channel_id (07 7.4 rule 1, M2-11)"
  - query: runs.FollowupOfMessage
    category: after_authorize
    reason: "the follow-up of the one message whose message.delete authorize allowed in the same unit of work; nothing of the row leaves the server (07 7.4 rule 1, M2-11)"
