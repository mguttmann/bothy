# SPDX-License-Identifier: Apache-2.0
#
# Local SonarQube Community Build for `make sonar` (docs/quality/sonarqube-local.md).
# Development tool, not part of the product stack. Start with `make sonar-up`.
#
# - Web UI and API only on 127.0.0.1 (port SONARQUBE_PORT, default 9000).
# - PostgreSQL only on an internal network without a host port; never the host's 5432.
# - Images pinned by tag and digest; Renovate updates both.
# - The database password comes from tools/sonarqube/.env, which `make sonar-up`
#   creates with a random value (git-ignored, never committed).

name: bothy-sonarqube

services:
  sonarqube:
    image: sonarqube:26.9.0.129388-community@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:?run make sonar-up, which creates tools/sonarqube/.env}
      # Single-node local use: the embedded search engine would otherwise demand host
      # kernel settings (vm.max_map_count) that a desktop container VM rarely has.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "127.0.0.1:${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    networks:
      - sonar_internal
      - sonar_web
    restart: unless-stopped

  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_DB: sonarqube
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:?run make sonar-up, which creates tools/sonarqube/.env}
    volumes:
      - sonarqube_db:/var/lib/postgresql
    networks:
      - sonar_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  sonar_internal:
    internal: true
  sonar_web: {}

volumes:
  sonarqube_data: {}
  sonarqube_extensions: {}
  sonarqube_logs: {}
  sonarqube_db: {}
