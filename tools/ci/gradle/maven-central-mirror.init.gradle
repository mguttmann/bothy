// Gradle init script of the CI jobs that run Gradle (AUD-PKG-P10-repo-ops-host, ruling B5).
// Maven Central answers the shared CI runners with HTTP 429, and Gradle stops at that answer
// even when a later repository has the module. So every build of the build tree (also the
// Flutter Gradle plugin, an included build, and the Android projects of Flutter plugins) gets
// Maven Central from Google's public mirror of it: every Maven Central repository a build
// declares, in the settings, a buildscript block or a project, is pointed at the mirror. The
// mirror serves the same files with the same checksums, and the lock files pin the versions.
// Nothing is added to a project, so a build that refuses project repositories
// (FAIL_ON_PROJECT_REPOS, the Flutter Gradle plugin's) is unaffected. The plugin repositories
// also get the mirror in front before the settings script runs, because the Gradle Plugin
// Portal sends the files of Maven Central modules to Maven Central; a build that declares no
// plugin repository keeps the Plugin Portal behind it. The release build does not use this
// script.
def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2/'
def centralUrls = ['https://repo.maven.apache.org/maven2/', 'https://repo1.maven.org/maven2/']

def toMirror = { RepositoryHandler repos ->
    repos.withType(MavenArtifactRepository).configureEach { repo ->
        def url = repo.url.toString()
        if (!url.endsWith('/')) {
            url += '/'
        }
        if (url in centralUrls) {
            repo.url = mirrorUrl
        }
    }
}

def mirrorFirst = { RepositoryHandler repos ->
    if (repos.any { it instanceof MavenArtifactRepository && it.url.toString() == mirrorUrl }) {
        return
    }
    def mirror = repos.maven {
        name = 'MavenCentralMirror'
        url = mirrorUrl
    }
    repos.remove(mirror)
    repos.addFirst(mirror)
}

beforeSettings { settings ->
    mirrorFirst(settings.pluginManagement.repositories)
    toMirror(settings.pluginManagement.repositories)
    toMirror(settings.dependencyResolutionManagement.repositories)
    settings.gradle.beforeProject { project ->
        toMirror(project.buildscript.repositories)
        toMirror(project.repositories)
    }
}

settingsEvaluated { settings ->
    def plugins = settings.pluginManagement.repositories
    if (plugins.size() == 1) {
        plugins.gradlePluginPortal()
    }
}
