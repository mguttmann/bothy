#
# OSV-Scanner configuration of the panel plugin (docs/quality/licenses.md, "Lizenz-Gate" item 3;
# docs/DECISIONS.md D-M7-25-5). The plugin bundles only its own code: webpack marks React,
# Emotion and @grafana/* external (.config/bundler/externals.ts) and Grafana provides them at
# runtime, and the rest of package-lock.json are build and test tools. So no package below
# ships in dist/; test/repo.test.ts fails when a package enters the bundle. Each entry names one
# package version and its reason; never a blanket override.

[[PackageOverrides]]
name = "@isaacs/cliui"
ecosystem = "npm"
version = "9.0.0"
license.ignore = true
reason = "License BlueOak-1.0.0. Not shipped: a dev dependency of jest (glob), used only to build, lint or test the plugin."

[[PackageOverrides]]
name = "body"
ecosystem = "npm"
version = "5.1.0"
license.override = ["MIT"]
reason = "LICENCE of body 5.1.0 is the MIT text; deps.dev has no SPDX value. Build tool: reached only through webpack-livereload-plugin (tiny-lr), the live-reload of `npm run dev`; never in dist/."

