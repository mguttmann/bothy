# Example configuration of claude-code-runner (docs/spec/09-agents.md 21). Keys are nested by
# their dots: runner.stop_grace is stop_grace in [runner]. Defaults are shown; required keys
# have no default.

[runner]
server_url = "https://chat.example.com"
instance_id = "0192d3a0-0000-7000-8000-000000000001"
agent_token_ref = "file:/var/lib/claude-code-runner/secrets/agent_token"
dpop_key_ref = ""
consumer = "default"
tool_class = "chat"
scoped_allowed_tools = []
# A model the API serves; the CLI's notation with a selector such as [1m] is allowed. The runner
# does not check the name: the API refuses an unknown one, and Claude Code then fails the turn
# or, with a fallback model in the Claude Code settings the turn loads, answers it with that
# model without a sign in the thread.
default_model = "claude-fable-5-2[1m]"
anthropic_api_key_ref = ""
allow_personal = false
forward_ssh_agent = false
cli_probe_timeout = "30s"
poll_interval = "200ms"
claude_bin = "claude"
# git of the folder creation of a binding with provision init or clone (09 18.12).
git_bin = "git"
provision_timeout = "10m"
provision_retry_after = "5m"
# Most folder names the heartbeat reports for "Add forums for existing folders" (09 18.13).
project_folders_max = 500
# Fallback reload of the served channels and their bindings; operator and binding changes
# normally arrive at once through access.changed and agent.config_changed (09 18.1).
channels_resync_interval = "5m"
# Check of the bound folders for a move to the trash, and the heartbeat that can carry the
# server's request to move the folder of a deleted forum (09 18.15).
trash_check_interval = "60s"
# Local transcriber of voice messages and audio attachments (09 18.14): the program and its
# arguments, the audio file path is appended, stdout is the text. Empty means off, for example
# ["/usr/local/bin/transcribe-audio"] (a wrapper around a whisper.cpp binary, see the README).
transcribe_cmd = []
transcribe_timeout = "5m"
# The search assistant (09 18.17): the model and the time limit of one call; the server waits
# search.assist.timeout (default 10s), so keep the limit below it.
search_assist_model = "haiku"
search_assist_timeout = "9s"
# The builder of the interview of "New agent" (26 6.2): off by default; on, this runner answers
# the interview when it is the agent of the server's agents.builder_agent_id. The server waits
# agents.interview.timeout, which the runner cannot read, so keep agent_builder_timeout below it.
agent_builder = false
agent_builder_model = "sonnet"
agent_builder_timeout = "80s"
projects_root = "/srv/projects"
# Folder of a forum without a project binding (Git optional): "." is projects_root itself, a
# name is a folder under it. Empty means off: such a forum gets a message to bind a folder.
default_workspace = ""
state_dir = "/var/lib/claude-code-runner"
followup_grace = "30s"
# Longest wait for the server's check of a follow-up's attachments before the follow-up goes to
# the turn; a file still not ready is then named as such.
followup_file_wait = "2m"
stop_grace = "10s"
kill_grace = "5s"
# A turn that ends with an account error (a usage limit, a login that is gone, subscription
# access switched off, an overloaded API) while its process holds or held background work does
# not end the run (09 18.9): the runner keeps the process and writes a retry line after
# account_retry_first, then after account_retry_second, then every account_retry_interval. Once
# account_retry_max_wait has passed since the first error the run ends as after any error; "0s"
# switches the retry off. The reset time of a usage limit is shown, never waited for.
account_retry_first = "1m"
account_retry_second = "2m"
account_retry_interval = "3m"
account_retry_max_wait = "20m"
session_lock_wait = "10m"
max_parallel_runs = 4
stream_log_retention = "14d"
progress_patch_interval = "2m"
# Hosting of built-in agents (docs/spec/26-builtin-agents.md 3): off by default. With it on, the
# runner also serves every agent whose hosting runner is this runner's agent, each with its own
# connection, token (fetched from the server, kept in memory only), heartbeat and state folder
# under state_dir/hosted/<agent id>/, sharing the slots of max_parallel_runs. Off, the runner
# behaves exactly as without these keys.
hosted_agents = false
# Root of the agent and control folders of hosted agents (26 5.1); required with hosted_agents.
# The start is refused when it is equal to, inside or above state_dir or projects_root, when it
# or a folder above it holds a CLAUDE.md, or when group or others may write it.
hosted_agents_root = ""
# Highest tool class loaded for a hosted agent (chat, scoped or host); reported to the server as
# the capability hosts_agents, which bounds the class an owner can give a hosted agent.
hosted_max_tool_class = "scoped"
# Folder of the secrets of hosted agents (26 5.1 item 3): a secret_ref of a definition may name
# only a file in its subfolder <agent_id>/, never an env: reference, another agent's folder or a
# credential of the runner. Empty (the default) resolves no secret_ref of a definition, so an MCP
# server that names one ends the turn with mcp_reference_unavailable. The start is refused when
# it is not an absolute folder, when group or others may write it, when it overlaps
# hosted_agents_root, state_dir or projects_root, or when a credential of the runner lies in it.
# Each file needs exactly one hard link and is opened without following a link; keep copies or
# links of the runner's or the CLI's credentials out of this folder.
hosted_secrets_dir = ""
# Commands the runner starts for a stdio MCP server of a hosted agent's definition (26 5.6); a
# definition naming another command is refused before the turn. Equal to the server's
# agents.mcp_stdio_runners by default.
mcp_stdio_runners = ["npx", "uvx"]
# Folder of channel skills (26 5.9): a skill reference claude-code:<name> of a channel loads the
# folder <channel_skills_dir>/<name>/ as a plugin, only in turns of tool class host. Empty (the
# default) turns channel skills off, and the runner then reads no skill references at all.
channel_skills_dir = ""
# Turn handover (docs/spec/09-agents.md 18.19.3 to 18.19.7): off by default. On, every turn runs
# under a keeper with a named pipe as stdin, SIGTERM hands live turns over instead of ending them
# (exit 75), the next runner adopts them with full rights, and the heartbeat reports the
# capability turn_handover. Switch it on only against a server that accepts that capability
# (16 10.1); `claude-code-runner stop --turns` ends every turn on purpose.
turn_handover = false
# Roots of answer attachments by name only; an operator may narrow the list, never widen it.
attach_allowed_roots = ["project", "thread_inbox", "runner_temp"]
# Denied names of answer attachments; must contain the list of 09 18.10, may add more.
attach_denied_patterns = [
  ".env*", "*.pem", "*.key", "id_*", ".netrc",
  ".ssh", ".claude", ".config", ".aws", ".azure", ".gnupg",
]

[adapter]
invocation_token_leeway = "10s"
jwks_refresh_min_interval = "60s"

[agent]
run_update_min_interval = "500ms"

[sdk]
http_timeout = "30s"
retry_max_attempts = 5
