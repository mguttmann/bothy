# Example configuration of claude-code-runner (docs/spec/09-agents.md 21). Keys are nested by
# their dots: runner.stop_grace is stop_grace in [runner]. Defaults are shown; required keys
# have no default.

[runner]
server_url = "https://chat.example.com"
instance_id = "0192d3a0-0000-7000-8000-000000000001"
agent_token_ref = "file:/var/lib/claude-code-runner/secrets/agent_token"
dpop_key_ref = ""
consumer = "default"
tool_class = "chat"
scoped_allowed_tools = []
default_model = "model-large"
anthropic_api_key_ref = ""
allow_personal = false
forward_ssh_agent = false
cli_probe_timeout = "30s"
poll_interval = "200ms"
claude_bin = "claude"
# git of the folder creation of a binding with provision init or clone (09 18.12).
git_bin = "git"
provision_timeout = "10m"
provision_retry_after = "5m"
# Most folder names the heartbeat reports for "Add forums for existing folders" (09 18.13).
project_folders_max = 500
# Fallback reload of the served channels and their bindings; operator and binding changes
# normally arrive at once through access.changed and agent.config_changed (09 18.1).
channels_resync_interval = "5m"
# Local transcriber of voice messages and audio attachments (09 18.14): the program and its
# arguments, the audio file path is appended, stdout is the text. Empty means off, for example
# ["/usr/local/bin/transcribe-audio"] (a wrapper around a whisper.cpp binary, see the README).
transcribe_cmd = []
transcribe_timeout = "5m"
projects_root = "/srv/projects"
state_dir = "/var/lib/claude-code-runner"
followup_grace = "30s"
stop_grace = "10s"
kill_grace = "5s"
session_lock_wait = "10m"
max_parallel_runs = 4
stream_log_retention = "14d"
progress_patch_interval = "2m"
# Roots of answer attachments by name only; an operator may narrow the list, never widen it.
attach_allowed_roots = ["project", "thread_inbox", "runner_temp"]
# Denied names of answer attachments; must contain the list of 09 18.10, may add more.
attach_denied_patterns = [
  ".env*", "*.pem", "*.key", "id_*", ".netrc",
  ".ssh", ".claude", ".config", ".aws", ".azure", ".gnupg",
]

[adapter]
invocation_token_leeway = "10s"
jwks_refresh_min_interval = "60s"

[agent]
run_update_min_interval = "500ms"

[sdk]
http_timeout = "30s"
retry_max_attempts = 5
