# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# SPDX-License-Identifier: Apache-2.0
#
# CodeRabbit pull request reviews, active once the repository is public (free for public
# repositories). The local CLI is opt-in (`make review` with BOTHY_CODERABBIT=1), because
# it sends the diff to the CodeRabbit service (docs/quality/push-discipline.md).
# A finding that only CodeRabbit sees becomes a local rule (Semgrep, a test or a lint).

language: en-US
early_access: false

reviews:
  # chill, not assertive: only Blockers and reproduced Majors block a merge (CRT-1 in
  # docs/DECISIONS.md), so nits would only cost review rounds.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  # The summary goes into the walkthrough comment, not the body: the body becomes the
  # squash commit on main, and every body edit runs ci.yml again (docs/quality/push-discipline.md).
  high_level_summary_in_walkthrough: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/uv.lock"
    - "!**/package-lock.json"
    - "!**/pubspec.lock"
    - "!**/go.sum"
    - "!**/*.svg"
    - "!design/build/**"
  path_instructions:
    - path: "**"
      instructions: >-
        Report bugs, security issues, broken contracts (specification, API, schema,
        configuration keys) and problems that break CI. Do not raise style, wording or
        formatting nits; a rule that a matching path-specific instruction states (for
        example dashes or glossary terms in Markdown) is a repository requirement, not
        a nit. Settled repository facts, not findings: lock files, go.sum and rendered
        SVGs are excluded from review on purpose (path_filters); the default theme is
        dark (docs/design/tokens.md, modifier `theme`); GIT_DIR, GIT_WORK_TREE,
        GIT_INDEX_FILE and the other git variables are cleared centrally by the pre-push
        hook before `make check` (tools/hooks/push_plan.py) and by tools/conftest.py, so a
        test or script need not unset them itself. In tests, descriptive test names and
        loopback addresses (127.0.0.1, ::1, localhost) or documentation addresses
        (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24, 2001:db8::/32, example.com,
        example.org, example.net) are fine and not instance-specific data.
    - path: "**/*.md"
      instructions: >-
        All repository content is English (docs/glossary.md, D-W-94).
        Flag en dashes and em dashes, numbers for limits or thresholds that are not
        named configuration values, and anything instance-specific or private (company
        or person names, host names, real IP addresses, paths under a user home). Terms
        must match docs/spec/00-glossary.md. Ask for a source URL and retrieval date only
        for claims about external systems that the specification or the security
        documents rely on (files under docs/spec/**, docs/security/** and docs/adr/**),
        not for other Markdown files.
    - path: ".github/workflows/**"
      instructions: >-
        Every job runs on a fixed GitHub-hosted runner label, never on a runner outside
        GitHub (tools/ci/check_runners.py, ADR 0039). Actions pinned to full commit
        SHAs, top-level `permissions: contents: read`, timeout-minutes on every job,
        no pull_request_target, untrusted values only through environment variables.
    - path: "services/**/*.go"
      instructions: >-
        Every route and event goes through authorize with an action from
        docs/spec/05-actions.md; no read permission means 404, never 403. SQL only through
        sqlc queries: this covers data access queries (reading and writing rows), not
        LISTEN/NOTIFY or advisory locks, which run on the driver connection directly.
        The server never reads model provider credentials.
    - path: "tools/**/*.py"
      instructions: >-
        Repository tools: standard library or PyYAML only, a test for every behavior,
        no secret values in output.
  tools:
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    golangci-lint:
      enabled: true
    ruff:
      enabled: true
    zizmor:
      enabled: true
    languagetool:
      enabled: false

chat:
  auto_reply: true
  art: false

# Learnings from review replies are stored for this repository only; no private knowledge
# source (Jira, Linear, MCP servers) reaches the reviews of this public repository.
knowledge_base:
  opt_out: false
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled
