# SPDX-License-Identifier: Apache-2.0
#
# Git hooks (install once with `make bootstrap`). Fast checks on every commit, the
# commit message on commit-msg, and before every push `make check` for the parts the push
# touches (tools/hooks/push_plan.py; the full `make check` when a shared input changes).
# The local hooks run the same pinned tools as the Makefile (tools/uv.lock,
# tools/bin/tools.lock.json); only the generic file hygiene hooks come from a remote
# repository, pinned to a full commit SHA. `make lint` runs the commit stage over all files.

minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: '^(tools/node/node_modules/|\.cache/|site/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Pigeon writes Kotlin Flutter APIs with a trailing blank, and make codegen-check holds
        # the files byte for byte to a fresh generation (docs/decisions.d/M5-05.md D-M5-05-0).
        exclude: '(\.svg|\.g\.kt)$'
      - id: end-of-file-fixer
        # drift writes its schema files without a final newline and make-migrations refuses a
        # stored schema that differs by one byte (docs/DECISIONS.md D-M4-12-7).
        exclude: '(\.svg|/drift_schemas/.*\.json)$'
      - id: mixed-line-ending
        args: [--fix=lf]
        # .gitattributes checks these out with CRLF (Windows scripts), which --fix=lf would
        # rewrite on every checkout; git keeps them LF in the repository.
        exclude: '\.(ps1|bat|cmd)$'
      - id: check-yaml
        # mkdocs.yml uses !!python tags; --unsafe checks syntax only.
        args: [--unsafe]
      - id: check-toml
      - id: check-json
        # TypeScript reads tsconfig as JSON with comments; the scaffold of @grafana/create-plugin
        # writes its header comment there (M7-25).
        exclude: '^plugins/grafana-bothy-live/\.config/tsconfig\.json$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        # Named value repo.max_file_kb (docs/spec/23-quality.md), every file but the REST contract
        # and its single-file copies, which the next hook checks.
        args: [--maxkb=1024, --enforce-all]
        exclude: ^(docs/api/openapi\.yaml|services/server/api/rest/openapi\.gen\.yaml|sdk/typescript/src/generated/openapi\.ts)$
      - id: check-added-large-files
        name: check for added large files (REST contract)
        # Named value api.contract_max_file_kb (docs/spec/23-quality.md, docs/DECISIONS.md PL/9).
        args: [--maxkb=2048, --enforce-all]
        files: ^(docs/api/openapi\.yaml|services/server/api/rest/openapi\.gen\.yaml|sdk/typescript/src/generated/openapi\.ts)$
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: local
    hooks:
      - id: text-rules
        name: no en or em dashes (U+2013, U+2014)
        entry: uv run --project tools --locked --quiet python tools/hooks/text_rules.py
        language: system
        types: [text]
      - id: secret-formats
        name: no Stripe webhook secret format (whsec_, GitHub secret scanning)
        entry: uv run --project tools --locked --quiet python tools/hooks/secret_formats.py
        language: system
        types: [text]
      - id: ruff-format
        name: ruff format (tools)
        entry: uv run --project tools --locked --quiet ruff format --check
        language: system
        types: [python]
        files: '^(tools|tests/portability)/'
      - id: ruff-check
        name: ruff check (tools)
        entry: uv run --project tools --locked --quiet ruff check
        language: system
        types: [python]
        files: '^(tools|tests/portability)/'
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: make gitleaks-staged
        language: system
        pass_filenames: false
      - id: commit-msg
        name: Conventional Commits and DCO sign-off
        entry: uv run --project tools --locked --quiet python tools/hooks/commit_msg.py --require-signoff
        language: system
        stages: [commit-msg]
      - id: review-evidence
        name: independent review with verdict JA for the pushed commit (.review/<sha>.md)
        entry: uv run --project tools --locked --quiet python tools/hooks/review_gate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: make-check
        name: make check of the parts the push touches (full on shared inputs; fast gates for build/**)
        # tools/hooks/push_plan.py maps the pushed diff to COMPONENTS and AREAS and runs make
        # without the variables git exports to hooks, so every gate sees the repository as in CI
        # (docs/DECISIONS.md D-M4-05-6); PUSH_FULL=1 runs the full make check. A push to build/**
        # runs only the fast gates, because build-verify.yml runs every gate
        # (tools/hooks/build_push.py).
        entry: uv run --project tools --locked --quiet python tools/hooks/build_push.py -- uv run --project tools --locked --quiet python tools/hooks/push_plan.py run
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
