# Overlay "grafana": Grafana Cloud through the OTLP gateway (all three signals to one endpoint),
# or a remote Grafana stack that you operate yourself, with the same gateway behaviour.
# Source (retrieved 2026-10-10): https://grafana.com/docs/grafana-cloud/send-data/otlp/send-data-otlp/
#   Gateway https://otlp-gateway-<REGION>.grafana.net/otlp, basic auth from the stack tile.
# Secret: secrets/collector/grafana_otlp_authorization with the full header value
# "Basic <base64(instance-id:token)>". No extension, so that this overlay stays combinable
# with any other (lists like service.extensions are replaced when merging).
# The local stack from Compose uses the overlay "local", not this one.

exporters:
  otlp_http/grafana:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    headers:
      Authorization: ${file:/run/bothy/secrets/grafana_otlp_authorization}
    compression: gzip

service:
  pipelines:
    traces/grafana:
      receivers: [forward/traces]
      exporters: [otlp_http/grafana]
    metrics/grafana:
      receivers: [forward/metrics]
      exporters: [otlp_http/grafana]
    logs/grafana:
      receivers: [forward/logs]
      exporters: [otlp_http/grafana]
