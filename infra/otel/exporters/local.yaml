# Overlay "local": local default stack from the Compose profile observability.
# Metrics -> Prometheus (OTLP receiver, cumulative temporality as delivered by the SDK),
# Logs -> Loki (OTLP over HTTP), traces -> Tempo (OTLP over gRPC).
# Sources and limits: docs/observability/backends.md, section "Grafana-Stack lokal".

exporters:
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces/local:
      receivers: [forward/traces]
      exporters: [otlp_grpc/tempo]
    metrics/local:
      receivers: [forward/metrics]
      exporters: [otlp_http/prometheus]
    logs/local:
      receivers: [forward/logs]
      exporters: [otlp_http/loki]
