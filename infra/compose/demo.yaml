# SPDX-License-Identifier: Apache-2.0
#
# Overlay of the demo instance (docs/spec/16-operations.md 16, brief M7-27). DEMO ONLY: never use
# it for an installation; make release-build leaves it and infra/compose/demo.sh out of the
# release bundle (tools/ci/product_release.py BUNDLE_EXCLUDES). infra/compose/demo.sh (make demo)
# combines it with the unchanged installation file compose.yaml, the smoke overlay
# test/compose.smoke.yaml (the server image of make image, the generated secrets) and the
# variables of test/smoke.env and test/demo.env. The server image is the release image; nothing
# here changes it.
#
# Topology: demo-tls (the TLS front), demo-agent (the demo agent of the Python SDK) and demo-host
# (the host service container) share the network namespace of api. demo-tls listens on DEMO_PORT
# and api publishes exactly that port on 127.0.0.1 of the host, so the app on the host, the agent
# and the host service reach https://localhost:DEMO_PORT, which is server.public_url (DPoP proofs
# name it, 08 7.3). The front forwards to 127.0.0.1:8080, so the server sees loopback (SEC-TLS-1).
# No other port is published.
#
# The exchange directory of bothy setup demo (16 16.5) is the volume demo-exchange: api writes
# agents.json and host-pairing.json into it as the server user 65532, demo-agent reads it as the
# same user, and demo.sh reads and writes through the one-off service demo-exchange.

# Server keys of the demo, only in this overlay (existing keys, docs/operations/configuration.md):
# - file.scan.mode off: the stack has no clamd (profile scan);
# - the rate limits far above what the demo sends: the people, the agents and the command reach
#   the server from the one address of the TLS front, which a real installation never does; the
#   limits themselves have their own tests;
# - stats.flush_interval 5s: the views of 25 fill within seconds of the warm-up.
x-demo-env: &demo-env
  BOTHY_FILE__SCAN__MODE: "off"
  BOTHY_STATS__FLUSH_INTERVAL: "5s"
  BOTHY_RATELIMIT__RL__PUBLIC_AUTH__PER_MINUTE: "100000"
  BOTHY_RATELIMIT__RL__PUBLIC_AUTH__BURST: "10000"
  BOTHY_RATELIMIT__RL__GATEWAY_CONNECT__PER_MINUTE: "100000"
  BOTHY_RATELIMIT__RL__GATEWAY_CONNECT__BURST: "10000"
  BOTHY_RATELIMIT__RL__READ__PER_MINUTE: "100000"
  BOTHY_RATELIMIT__RL__READ__BURST: "10000"
  BOTHY_RATELIMIT__RL__WRITE__PER_MINUTE: "100000"
  BOTHY_RATELIMIT__RL__WRITE__BURST: "10000"
  BOTHY_RATELIMIT__RL__MESSAGE__PER_MINUTE: "100000"
  BOTHY_RATELIMIT__RL__MESSAGE__BURST: "10000"
  BOTHY_RATELIMIT__RL__TRIGGER__PER_MINUTE: "100000"
  BOTHY_RATELIMIT__RL__TRIGGER__BURST: "10000"
  BOTHY_RATELIMIT__RL__INTERACTION__PER_MINUTE: "100000"
  BOTHY_RATELIMIT__RL__INTERACTION__BURST: "10000"
  BOTHY_RATELIMIT__RL__ADMIN__PER_MINUTE: "100000"
  BOTHY_RATELIMIT__RL__ADMIN__BURST: "10000"
  BOTHY_RATELIMIT__RL__AGENT_RUNTIME__PER_MINUTE: "100000"
  BOTHY_RATELIMIT__RL__AGENT_RUNTIME__BURST: "10000"

services:

  api:
    ports:
      - "127.0.0.1:${DEMO_PORT:?set by demo.sh}:${DEMO_PORT:?set by demo.sh}"
    environment:
      <<: *demo-env
    depends_on:
      demo-exchange-init:
        condition: service_completed_successfully
    volumes:
      # The data set read-only where bothy setup demo looks for it by default (16 16.1).
      - ../demo:/usr/share/bothy/demo:ro
      - demo-exchange:/var/lib/bothy/demo-exchange

  worker:
    environment:
      <<: *demo-env

  # Gives the exchange volume to the server user with mode 0700 before api starts.
  demo-exchange-init:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: "0:0"
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 65532:65532 /exchange && chmod 0700 /exchange"]
    volumes:
      - demo-exchange:/exchange

  # One-off reader and writer of the exchange directory for demo.sh (compose run), as the server
  # user, without a network.
  demo-exchange:
    profiles: [demo-tools]
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: "65532:65532"
    network_mode: none
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - demo-exchange:/exchange

  # TLS front with the per-run leaf of the demo CA (demo/Caddyfile); the image and hardening of
  # the TLS front of the desktop E2E test.
  demo-tls:
    profiles: [demo]
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    network_mode: service:api
    user: ${DEMO_UID_GID:?set by demo.sh}
    read_only: true
    cap_drop: [ALL]
    # The caddy binary of the image carries the file capability cap_net_bind_service; exec fails
    # without it in the bounding set. DEMO_PORT needs no privilege.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
      DEMO_PORT: ${DEMO_PORT:?set by demo.sh}
    tmpfs: [/tmp]
    command: ["caddy", "run", "--config", "/etc/caddy-demo/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./demo/Caddyfile:/etc/caddy-demo/Caddyfile:ro
      - ${DEMO_CERTS:?set by demo.sh}:/certs:ro

  # The demo agent of the Python SDK (sdk/python/src/bothy_sdk/testing/demo_agent.py, 16 16.4):
  # every agent of agents.json, no model call. The image is the pinned Python image of the
  # desktop E2E agent with the runtime dependencies of sdk/python/uv.lock by hash (demo.sh writes
  # requirements.txt); the SDK source is mounted read-only. It reaches the server at the public
  # URL through the TLS front and trusts only the demo CA. The agent waits out short outages of
  # the server itself; the restart policy brings the process back after anything else.
  demo-agent:
    profiles: [demo]
    restart: unless-stopped
    build:
      context: ${DEMO_AGENT_CONTEXT:?set by demo.sh}
      dockerfile_inline: |
        FROM python:3.13-slim-trixie@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
        COPY requirements.txt /tmp/demo-requirements.txt
        RUN pip install --no-cache-dir --no-deps --require-hashes -r /tmp/demo-requirements.txt \
            && rm /tmp/demo-requirements.txt
    image: bothy-demo-agent:${DEMO_RUN_ID:?set by demo.sh}
    pull_policy: never
    network_mode: service:api
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      HOME: /tmp
      PYTHONPATH: /sdk/src
      PYTHONDONTWRITEBYTECODE: "1"
      SSL_CERT_FILE: /ca/ca.pem
    command: ["python3", "-m", "bothy_sdk.testing.demo_agent", "--exchange", "/exchange", "--base-url", "${BOTHY_PUBLIC_URL}/api/v1"]
    volumes:
      - ../../sdk/python/src:/sdk/src:ro
      - demo-exchange:/exchange:ro
      - ${DEMO_CA:?set by demo.sh}:/ca:ro

  # The machine of the host service (24, 16 4.4): the host image of the terminal suite of M2-48
  # (test/host/Dockerfile, systemd as process 1), into which demo.sh copies bothy-host built from
  # this tree. Only this demo service is privileged: systemd needs a writable cgroup tree and
  # bothy-host creates a cgroup per session (24 6.5). It runs as root for the same reason.
  demo-host:
    profiles: [demo]
    image: bothy-demo-host:${DEMO_RUN_ID:?set by demo.sh}
    pull_policy: never
    network_mode: service:api
    privileged: true
    user: "0:0"
    restart: "no"
    tmpfs: [/run, /run/lock, /tmp]

volumes:
  demo-exchange: {}
