# TEST ONLY: routing of the TLS front of the terminal suite in the profile twonode without hash
# routing (TM-T15): the device stream lands on api, the data connection of the host service on
# api-2, and everything else goes to M2-47's example edge.
upstream termsuite_device {
    server api:8080;
}
upstream termsuite_hostdata {
    server api-2:8080;
}
upstream termsuite_rest {
    server edge:8080;
}
