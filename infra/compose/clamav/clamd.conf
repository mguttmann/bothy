# SPDX-License-Identifier: Apache-2.0
# clamd configuration of the Compose service clamav (docs/spec/12-files.md 5.4, docs/spec/19-security.md
# SEC-TLS-5, docs/DECISIONS.md D-M3-04-9). It starts from /etc/clamav/clamd.conf of the pinned image
# clamav/clamav-debian (BOTHY_CLAMAV_VERSION in .env.example) and replaces it read-only.
#
# Kept from the image: the log file with time stamps and the user clamav.
LogFile /var/log/clamav/clamd.log
LogTime yes
User clamav

# Transport: only the Unix socket in the volume clamav-socket, mounted at /run/clamav here and
# read-only in the worker (no TCPSocket: clamd checks requests neither for origin nor for
# authentication). The volume is shared with the worker only, so every user of the worker may
# connect; the worker runs as another user than clamav.
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 666

# Mandatory options of 12 5.4 (option names from the clamd.conf reference, source Q10).
# Files above a limit are reported as Heuristics.Limits.Exceeded... and end with scan_status error.
AlertExceedsMax yes
# StreamMaxLength equals the default of file.scan.clamd_stream_max_bytes, the server's mirror of it;
# MaxFileSize is not below the default of file.max_upload_bytes. Raise all three together.
StreamMaxLength 104857600
MaxFileSize 104857600
# MaxScanSize, MaxRecursion, MaxFiles and AlertEncrypted stay at their defaults.
