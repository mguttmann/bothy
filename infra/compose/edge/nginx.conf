# Example edge for several api nodes (compose.multi-node.yaml, docs/spec/16-betrieb.md 4.4).
#
# Routes both stream paths of a terminal session, the device's
# /api/v1/terminal/sessions/{session_id}/stream and the host service's
# /api/v1/hosts/sessions/{session_id}/stream, by consistent hashing over the {session_id}
# segment to the same api node, where the relay pairs them in memory. Everything else, including
# /api/v1/gateway and the control connection /api/v1/hosts/connect, may land on any node.
#
# Runs as a non-root user on a read-only root file system: pid and all temp paths live under
# /tmp (tmpfs). The operator's TLS edge stays in front of this one.
# Checked by services/server/test/edge (TestEdgeExample_Config, TestEdgeExample_HashRoutesBothStreamPaths).

worker_processes auto;

# Access and error lines carry request lines and client addresses; only critical errors are
# written, to stderr (SEC-LOG-3, SEC-LOG-5).
error_log /dev/stderr crit;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log off;
    server_tokens off;

    # The server enforces its own named body limits; bodies stream through (proxy_request_buffering
    # off below), so nothing is held in the tmpfs /tmp before the server can refuse it.
    client_max_body_size 0;

    # The session ID of a stream path; empty for every other path.
    map $uri $bothy_terminal_session {
        default "";
        "~^/api/v1/(?:terminal|hosts)/sessions/(?<sid>[^/]+)/stream$" $sid;
    }

    # Pass a WebSocket upgrade on; a plain request closes the upstream connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Both sides of one session reach the same node.
    upstream bothy_terminal_stream {
        hash $bothy_terminal_session consistent;
        server api:8080;
        server api-2:8080;
    }

    # REST, /api/v1/gateway and the control connection may land on any node.
    upstream bothy_api {
        server api:8080;
        server api-2:8080;
    }

    server {
        listen 8080;

        location ~ ^/api/v1/(?:terminal|hosts)/sessions/[^/]+/stream$ {
            proxy_pass http://bothy_terminal_stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            # terminal.idle_timeout plus terminal.idle_grace: the longest silence of a session
            # the server keeps.
            proxy_read_timeout 1920s;
            # terminal.idle_timeout plus terminal.idle_grace
            proxy_send_timeout 1920s;
        }

        location / {
            proxy_pass http://bothy_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Bodies and large responses pass through instead of filling the tmpfs /tmp.
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            # terminal.host_heartbeat_interval times terminal.host_heartbeat_miss_limit, above
            # sync.heartbeat_interval of the gateway.
            proxy_read_timeout 60s;
            # terminal.host_heartbeat_interval times terminal.host_heartbeat_miss_limit
            proxy_send_timeout 60s;
        }
    }
}
