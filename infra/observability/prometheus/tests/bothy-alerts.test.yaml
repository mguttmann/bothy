              runbook_url: "docs/observability/alerting.md#bothydatabaseconnectionshigh"

  - name: BothyDatabaseConnectionsHigh stays quiet at 80 percent
    interval: 1m
    input_series:
      - series: 'postgresql_backends{job="bothy/otel-collector", postgresql_database_name="bothy"}'
        values: '80x20'
      - series: 'postgresql_connection_max{job="bothy/otel-collector"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BothyDatabaseConnectionsHigh
        exp_alerts: []

  - name: BothyDatabaseDeadlocks fires at once
    interval: 1m
    input_series:
      - series: 'postgresql_deadlocks_total{job="bothy/otel-collector", postgresql_database_name="bothy"}'
        values: '0 1 1'
    alert_rule_test:
      # No `for`: quiet before the first increase, firing at the first evaluation after it.
      - eval_time: 0m
        alertname: BothyDatabaseDeadlocks
        exp_alerts: []
      - eval_time: 1m
        alertname: BothyDatabaseDeadlocks
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: "PostgreSQL reported deadlocks; check the lock order rule (03-datenmodell 6.3)."
              runbook_url: "docs/observability/alerting.md#bothydatabasedeadlocks"

  - name: BothyDatabaseDeadlocks stays quiet without new deadlocks
    interval: 1m
    input_series:
      - series: 'postgresql_deadlocks_total{job="bothy/otel-collector", postgresql_database_name="bothy"}'
        values: '2x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: BothyDatabaseDeadlocks
        exp_alerts: []
