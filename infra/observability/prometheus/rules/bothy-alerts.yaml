# Hand-written alerts next to the SLO rules (slo-*.yaml, generated from infra/observability/slo).
# Thresholds are starting values; their reasons and upkeep are in docs/observability/alerting.md.
# Runtime texts (summary) are English, like every alert text of the product.

groups:
  - name: bothy-pipeline
    rules:
      # Always firing alert. Alertmanager sends it to an external heartbeat service;
      # if it stops arriving there, the alert pipeline itself is dead.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: heartbeat
        annotations:
          summary: "Alerting pipeline is alive."
          runbook_url: "docs/observability/alerting.md#watchdog"

      - alert: BothyServerTelemetryMissing
        expr: absent_over_time(target_info{job="bothy/bothy-server"}[10m])
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No telemetry from the server for 10 minutes (server down or export broken)."
          runbook_url: "docs/observability/alerting.md#bothyservertelemetrymissing"

      # bothy-backupd sends every value the backup, WAL, restore test and volume alerts read. If
      # it stops or its export breaks, those series end and their alerts have nothing to compare.
      - alert: BothyBackupTelemetryMissing
        expr: absent_over_time(target_info{job="bothy/bothy-backupd"}[10m])
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No telemetry from bothy-backupd for 10 minutes (backup service down or export broken)."
          runbook_url: "docs/observability/alerting.md#bothybackuptelemetrymissing"

      - alert: BothyCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "OpenTelemetry Collector does not answer."
          runbook_url: "docs/observability/alerting.md#bothycollectordown"

      # Exporter errors of the collector. The names of its own metrics change between
      # versions (with or without _total); hence the regex over the name.
      - alert: BothyTelemetryExportFailing
        expr: sum by (exporter) (rate({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?"}[15m])) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Collector exporter {{ $labels.exporter }} fails to send telemetry."
          runbook_url: "docs/observability/alerting.md#bothytelemetryexportfailing"

      - alert: BothyTelemetryDropped
        expr: sum(rate(bothy_telemetry_dropped_total[15m])) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "The server drops telemetry because the export queue is full."
          runbook_url: "docs/observability/alerting.md#bothytelemetrydropped"

  - name: bothy-runtime
    rules:
      - alert: BothyEventFanoutLag
        expr: max(bothy_event_fanout_lag_seconds{job="bothy/bothy-server"}) > 5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Event fan-out lags behind the event log by more than 5 s."
          runbook_url: "docs/observability/alerting.md#bothyeventfanoutlag"

      # The number is the default of consumer.pending_alert_after in seconds: Prometheus cannot
      # read the server configuration, and the alert-thresholds check keeps both equal.
      - alert: BothyEventConsumerLag
        expr: max by (bothy_consumer_name) (bothy_event_consumer_pending_age_seconds{job="bothy/bothy-server"}) > 900
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Worker consumer {{ $labels.bothy_consumer_name }} has an unprocessed event older than consumer.pending_alert_after."
          runbook_url: "docs/observability/alerting.md#bothyeventconsumerlag"

      - alert: BothyAgentConsumerLag
        expr: max by (bothy_agent_handle) (bothy_agent_consumer_lag{job="bothy/bothy-server"}) > 1000
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Agent {{ $labels.bothy_agent_handle }} has more than 1000 unacknowledged events."
          runbook_url: "docs/observability/alerting.md#bothyagentconsumerlag"

      - alert: BothyAgentOffline
        expr: max by (bothy_agent_handle) (bothy_agent_heartbeat_age_seconds{job="bothy/bothy-server"}) > 300
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Agent {{ $labels.bothy_agent_handle }} sent no heartbeat for 5 minutes."
          runbook_url: "docs/observability/alerting.md#bothyagentoffline"

      - alert: BothyBillingModeMismatch
        expr: sum by (bothy_agent_handle) (increase(bothy_agent_billing_mode_mismatch_total[1h])) > 0 or max by (bothy_agent_handle) (bothy_agent_billing_mode_mismatch_age_seconds{job="bothy/bothy-server"}) > 300
        labels:
          severity: page
        annotations:
          summary: "Agent {{ $labels.bothy_agent_handle }} reported a billing mode that differs from its policy."
          runbook_url: "docs/observability/alerting.md#bothybillingmodemismatch"

      - alert: BothyAuthzError
        expr: sum by (bothy_reason) (increase(bothy_authz_errors_total[15m])) > 0
        labels:
          severity: page
        annotations:
          summary: "Permission check programming error ({{ $labels.bothy_reason }}): a route answered without its authorize check or an unknown action was checked."
          runbook_url: "docs/observability/alerting.md#bothyauthzerror"

      - alert: BothySecretRefreshFailing
        expr: sum(increase(bothy_secrets_refresh_failures_total[15m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Re-reading a secret failed; the server keeps the previous value, so a rotation has not taken effect."
          runbook_url: "docs/observability/alerting.md#bothysecretrefreshfailing"

      # `unless` instead of `and ... == 0`: if no scan has ever produced a result, there is no
      # series clean or infected; the sum is then empty instead of 0, and `and` would have
      # suppressed the alert.
      - alert: BothyMalwareScanFailing
        expr: sum(rate(bothy_file_scan_total{bothy_outcome="error"}[15m])) > 0 unless sum(rate(bothy_file_scan_total{bothy_outcome=~"clean|infected"}[15m])) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Malware scanning fails; uploads stay in state pending."
          runbook_url: "docs/observability/alerting.md#bothymalwarescanfailing"

  - name: bothy-data
    rules:
      # The three alerts on a last timestamp fail closed: a gauge without a value in a window as
      # long as the threshold counts like a value that is too old. Without the second half a
      # kind that never succeeded, or a gauge that is no longer reported, kept its alert quiet,
      # because `time() - max(...)` over no series is empty, not large. `absent_over_time` and
      # not `absent`: the value of a run by hand comes from a short-lived process and is gone a
      # few minutes later, and after a restart bothy-backupd reports a last success only once it
      # could read backup_runs. Each window equals its threshold (26h = 93600 s, 15m = 900 s,
      # 8d = 691200 s); the rule tests hold them (docs/decisions.d/AUD-infra-observability-01.md).
      - alert: BothyBackupStale
        expr: |
          time() - max by (bothy_backup_kind) (bothy_backup_last_success_timestamp_seconds) > 93600
          or absent_over_time(bothy_backup_last_success_timestamp_seconds{bothy_backup_kind="physical"}[26h])
          or absent_over_time(bothy_backup_last_success_timestamp_seconds{bothy_backup_kind="logical"}[26h])
          or absent_over_time(bothy_backup_last_success_timestamp_seconds{bothy_backup_kind="objects"}[26h])
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "No successful {{ $labels.bothy_backup_kind }} backup for more than 26 hours."
          runbook_url: "docs/observability/alerting.md#bothybackupstale"

      - alert: BothyWalArchiveStale
        expr: |
          time() - max(bothy_backup_wal_last_archived_timestamp_seconds) > 900
          or absent_over_time(bothy_backup_wal_last_archived_timestamp_seconds[15m])
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No WAL segment archived for 15 minutes; point-in-time recovery is at risk."
          runbook_url: "docs/observability/alerting.md#bothywalarchivestale"

      - alert: BothyRestoreTestStale
        expr: |
          time() - max(bothy_backup_restore_test_last_success_timestamp_seconds) > 691200
          or absent_over_time(bothy_backup_restore_test_last_success_timestamp_seconds[8d])
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "No successful automatic restore test for more than 8 days."
          runbook_url: "docs/observability/alerting.md#bothyrestoreteststale"

      - alert: BothyAuditChainBroken
        expr: sum(increase(bothy_audit_verify_failures_total[1d])) > 0
        labels:
          severity: page
        annotations:
          summary: "Audit log hash chain verification failed."
          runbook_url: "docs/observability/alerting.md#bothyauditchainbroken"

      - alert: BothyVolumeFull
        expr: min by (bothy_volume) (bothy_storage_volume_free_bytes / bothy_storage_volume_size_bytes) < 0.1
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "Volume {{ $labels.bothy_volume }} has less than 10 percent free space."
          runbook_url: "docs/observability/alerting.md#bothyvolumefull"

      - alert: BothyDatabaseConnectionsHigh
        expr: sum(postgresql_backends) / max(postgresql_connection_max) > 0.8
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "PostgreSQL uses more than 80 percent of max_connections."
          runbook_url: "docs/observability/alerting.md#bothydatabaseconnectionshigh"

      - alert: BothyDatabaseDeadlocks
        expr: sum(increase(postgresql_deadlocks_total[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "PostgreSQL reported deadlocks; check the lock order rule (03-data-model 6.3)."
          runbook_url: "docs/observability/alerting.md#bothydatabasedeadlocks"
