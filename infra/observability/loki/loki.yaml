# Loki (single process) for the local default stack. Logs arrive via OTLP from the collector
# (endpoint /otlp). Source (retrieved 2026-10-10): https://grafana.com/docs/loki/latest/send-data/otel/
#   allow_structured_metadata must be true; only a few resource attributes become index labels.
# Retention: BOTHY_LOKI_RETENTION (Compose variable), enforced by the compactor.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: ${BOTHY_LOKI_RETENTION:-14d}

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
